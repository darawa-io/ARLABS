<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AR Lab: Water, DNA & Survey</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Segoe UI', sans-serif; }
        
        /* Video is mirrored */
        #input_video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 1; display: none; }
        #output_canvas { position: absolute; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        /* --- UI LAYERS --- */
        
        /* General Button Style */
        .menu-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            color: #eee; font-size: 1.1rem; font-weight: 600;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .menu-btn.active {
            background: rgba(52, 152, 219, 0.9);
            border-color: #fff;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.7);
            color: white;
        }

        /* 1. Main Menu - Adjusted gap to fit 4 buttons */
        #main-menu {
            position: absolute; top: 30px; left: 0; width: 100%; 
            z-index: 5; display: flex; justify-content: center; 
            gap: 50px; pointer-events: none;
            transition: opacity 0.5s;
        }
        .main-opt { width: 120px; height: 60px; pointer-events: auto; }

        /* 2. Corner Button */
        #corner-menu {
            position: absolute; top: 30px; right: 30px;
            z-index: 5; pointer-events: none;
            transition: opacity 0.5s;
        }
        .corner-opt { width: 100px; height: 60px; pointer-events: auto; background: rgba(231, 76, 60, 0.6); }

        /* 3. Sub Menu */
        #sub-menu {
            position: absolute; top: 30px; left: 0; width: 100%; 
            z-index: 6; display: none; justify-content: center; 
            gap: 40px; pointer-events: none;
        }
        .sub-opt { width: 110px; height: 60px; pointer-events: auto; font-size: 0.9rem; }
        #btn-back { background: rgba(231, 76, 60, 0.6); }

        /* 4. OVERLAY LAYER (Images & QR) */
        #overlay-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3; display: none; 
            pointer-events: none; 
            background-color: rgba(0,0,0,0.5); /* Darker background for better QR contrast */
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #overlay-img {
            object-fit: contain;
            transition: all 0.5s ease;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        
        #overlay-text {
            color: white; font-size: 1.5rem; margin-top: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); display: none;
        }

        /* Loading Screen */
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); color: white; display: flex;
            justify-content: center; align-items: center; z-index: 20;
            flex-direction: column; text-align: center;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #444; border-top: 5px solid #3498db;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <h2>Loading AR System...</h2>
        <p>Use your <b>Index Finger</b> to select buttons.</p>
    </div>

    <!-- MAIN MENU -->
    <div id="main-menu">
        <div id="btn-water" class="menu-btn main-opt">Water</div>
        <div id="btn-clear" class="menu-btn main-opt active">Clear</div>
        <div id="btn-dna" class="menu-btn main-opt">DNA</div>
        <div id="btn-survey" class="menu-btn main-opt" style="border-color: #f1c40f;">Survey</div>
    </div>

    <!-- CORNER BUTTON -->
    <div id="corner-menu">
        <div id="btn-howto" class="menu-btn corner-opt">How To</div>
    </div>

    <!-- SUB MENU -->
    <div id="sub-menu">
        <div id="btn-intro" class="menu-btn sub-opt">Intro</div>
        <div id="btn-bot" class="menu-btn sub-opt">ChatBot</div>
        <div id="btn-code" class="menu-btn sub-opt">Code Tester</div>
        <div id="btn-back" class="menu-btn sub-opt">Back</div>
    </div>

    <!-- OVERLAY LAYER -->
    <div id="overlay-layer">
        <img id="overlay-img" src="" alt="Overlay Content">
        <div id="overlay-text">Scan to take Survey</div>
    </div>

    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>
        // --- UI & STATE MANAGEMENT ---
        let uiState = 'MAIN'; 
        let modelMode = 2; // Start at Clear
        
        // ======================================================
        // PASTE YOUR MICROSOFT/GOOGLE FORM LINK HERE:
        const SURVEY_LINK = "https://forms.office.com/Pages/ResponsePage.aspx?id=placeholder"; 
        // ======================================================

        // DOM Elements
        const mainMenu = document.getElementById('main-menu');
        const cornerMenu = document.getElementById('corner-menu');
        const subMenu = document.getElementById('sub-menu');
        
        const overlayLayer = document.getElementById('overlay-layer');
        const overlayImg = document.getElementById('overlay-img');
        const overlayText = document.getElementById('overlay-text');

        const btnWater = document.getElementById('btn-water');
        const btnClear = document.getElementById('btn-clear');
        const btnDNA = document.getElementById('btn-dna');
        const btnSurvey = document.getElementById('btn-survey');
        const btnHowTo = document.getElementById('btn-howto');
        
        const btnIntro = document.getElementById('btn-intro');
        const btnBot = document.getElementById('btn-bot');
        const btnCode = document.getElementById('btn-code');
        const btnBack = document.getElementById('btn-back');

        function switchUIState(newState) {
            uiState = newState;
            if (uiState === 'MAIN') {
                mainMenu.style.display = 'flex';
                cornerMenu.style.display = 'block';
                subMenu.style.display = 'none';
                overlayLayer.style.display = 'none'; 
                updateModelVisibility(); 
                
            } else if (uiState === 'SUB') {
                mainMenu.style.display = 'none';
                cornerMenu.style.display = 'none';
                subMenu.style.display = 'flex';
                pivotGroup.visible = false; 
            }
        }

        function handleMainButton(id) {
            [btnWater, btnClear, btnDNA, btnSurvey].forEach(b => b.classList.remove('active'));
            
            // Hide overlay by default when switching main buttons
            overlayLayer.style.display = 'none';
            overlayText.style.display = 'none';

            if (id === 'btn-water') {
                modelMode = 1;
                btnWater.classList.add('active');
            } else if (id === 'btn-clear') {
                modelMode = 2;
                btnClear.classList.add('active');
            } else if (id === 'btn-dna') {
                modelMode = 3;
                btnDNA.classList.add('active');
            } else if (id === 'btn-survey') {
                modelMode = 2; // Clear models for survey
                btnSurvey.classList.add('active');
                
                // Show QR Code
                overlayLayer.style.display = 'flex';
                // Use a standard QR Code API
                overlayImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(SURVEY_LINK)}`;
                overlayImg.style.width = "300px";
                overlayImg.style.height = "300px";
                overlayImg.style.opacity = "1.0";
                overlayImg.style.backgroundColor = "white"; // QR needs white background
                overlayImg.style.padding = "20px";
                
                overlayText.style.display = 'block';
            } else if (id === 'btn-howto') {
                switchUIState('SUB');
            }
            updateModelVisibility();
        }

        function handleSubButton(id) {
            [btnIntro, btnBot, btnCode].forEach(b => b.classList.remove('active'));

            if (id === 'btn-back') {
                switchUIState('MAIN');
                return;
            }

            overlayLayer.style.display = 'flex';
            overlayText.style.display = 'none';
            overlayImg.style.padding = "0"; // Reset padding
            overlayImg.style.backgroundColor = "transparent";

            if (id === 'btn-intro') {
                btnIntro.classList.add('active');
                overlayImg.src = "intro.png";
                overlayImg.style.width = "80%";
                overlayImg.style.height = "80%";
                overlayImg.style.opacity = "1.0"; 
            
            } else if (id === 'btn-bot') {
                btnBot.classList.add('active');
                overlayImg.src = "chatbot.png";
                overlayImg.style.width = "80%";
                overlayImg.style.height = "80%";
                overlayImg.style.opacity = "0.8";

            } else if (id === 'btn-code') {
                btnCode.classList.add('active');
                overlayImg.src = "codepen.png";
                overlayImg.style.width = "80%";
                overlayImg.style.height = "80%";
                overlayImg.style.opacity = "0.8";
            }
        }

        function updateModelVisibility() {
            if (uiState !== 'MAIN') return;
            // If Survey is active, hide models
            if (btnSurvey.classList.contains('active')) {
                waterModel.visible = false;
                dnaModel.visible = false;
                return;
            }

            if (modelMode === 1) {
                waterModel.visible = true;
                dnaModel.visible = false;
            } else if (modelMode === 2) {
                waterModel.visible = false;
                dnaModel.visible = false;
            } else if (modelMode === 3) {
                waterModel.visible = false;
                dnaModel.visible = true;
            }
        }

        // --- THREE.JS SETUP ---
        const canvas = document.getElementById('output_canvas');
        const videoElement = document.getElementById('input_video');
        const loadingScreen = document.getElementById('loading');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 12;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);
        camera.add(new THREE.PointLight(0xffffff, 0.5));
        scene.add(camera);

        const pivotGroup = new THREE.Group();
        pivotGroup.visible = false;
        scene.add(pivotGroup);

        // --- WATER MODEL ---
        const waterModel = new THREE.Group();
        pivotGroup.add(waterModel);
        
        const matO = new THREE.MeshPhongMaterial({ color: 0xd92525, shininess: 90 });
        const matH = new THREE.MeshPhongMaterial({ color: 0xebebeb, shininess: 80 });
        const matBond = new THREE.MeshPhongMaterial({ color: 0x2c3e50, shininess: 30 });
        
        function createTextSprite(text, size, color, bold=false) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const font = (bold?'bold ':'') + size + 'px Arial';
            ctx.font = font;
            canvas.width = ctx.measureText(text).width + 20;
            canvas.height = size + 20;
            ctx.font = font;
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width/2, canvas.height/2);
            const tex = new THREE.CanvasTexture(canvas);
            tex.minFilter = THREE.LinearFilter;
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true}));
            spr.scale.set(canvas.width/100, canvas.height/100, 1);
            return spr;
        }

        const oxygen = new THREE.Mesh(new THREE.SphereGeometry(1.3, 32, 32), matO);
        waterModel.add(oxygen);
        
        const lblO = createTextSprite("O", 80, "white", true); lblO.position.z = 1.4; oxygen.add(lblO);
        const lblDO = createTextSprite("δ-", 60, "#ffcccc"); lblDO.position.y = 1.8; waterModel.add(lblDO);

        function makeH(side) {
            const rad = (104.45/2)*(Math.PI/180);
            const x = Math.sin(rad)*2.2*side;
            const y = -Math.cos(rad)*2.2;
            const h = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), matH);
            h.position.set(x, y, 0);
            const lblH = createTextSprite("H", 60, "black", true); lblH.position.z = 0.9; h.add(lblH);
            const lblDH = createTextSprite("δ+", 50, "#ccc"); lblDH.position.y = -1.3; h.add(lblDH);
            
            const mid = new THREE.Vector3().addVectors(oxygen.position, h.position).multiplyScalar(0.5);
            const b = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 2.2, 16), matBond);
            b.position.copy(mid); b.lookAt(h.position); b.rotateX(Math.PI/2);
            waterModel.add(b);
            return h;
        }
        const h1 = makeH(-1); waterModel.add(h1);
        const h2 = makeH(1); waterModel.add(h2);
        
        const lblBond = createTextSprite("98.5pm", 40, "#ddd"); 
        lblBond.position.set(-1.5, -0.2, 0); waterModel.add(lblBond);
        const lblAng = createTextSprite("104.45°", 40, "#fff");
        lblAng.position.set(0, -1.8, 0); waterModel.add(lblAng);

        // --- DNA MODEL ---
        const dnaModel = new THREE.Group();
        pivotGroup.add(dnaModel);
        
        function buildDNA() {
            const matBack = new THREE.MeshPhongMaterial({color:0x9b59b6});
            const cols = [0xf1c40f, 0xe67e22, 0x2ecc71, 0x3498db].map(c=>new THREE.MeshPhongMaterial({color:c}));
            
            for(let i=0; i<14; i++) {
                const y = (i*0.35) - 2.5;
                const ang = i*0.5;
                const x1 = Math.cos(ang), z1 = Math.sin(ang);
                const x2 = Math.cos(ang+Math.PI), z2 = Math.sin(ang+Math.PI);
                
                const b1 = new THREE.Mesh(new THREE.SphereGeometry(0.25), matBack); b1.position.set(x1,y,z1); dnaModel.add(b1);
                const b2 = new THREE.Mesh(new THREE.SphereGeometry(0.25), matBack); b2.position.set(x2,y,z2); dnaModel.add(b2);
                
                const s1 = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,1), cols[(i%2)?2:0]);
                s1.position.set((x1*0.5), y, (z1*0.5)); s1.lookAt(new THREE.Vector3(0,y,0)); s1.rotateX(Math.PI/2); dnaModel.add(s1);

                const s2 = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,1), cols[(i%2)?3:1]);
                s2.position.set((x2*0.5), y, (z2*0.5)); s2.lookAt(new THREE.Vector3(0,y,0)); s2.rotateX(Math.PI/2); dnaModel.add(s2);
            }
        }
        buildDNA();

        // --- HAND TRACKING LOOP ---
        let currentScale = 1.0;
        let targetScale = 1.0;
        const targetQuat = new THREE.Quaternion();

        function onResults(results) {
            loadingScreen.style.display = 'none';
            videoElement.style.display = 'block';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                const indexTip = hand[8]; 
                const screenX = (1 - indexTip.x) * window.innerWidth;
                const screenY = indexTip.y * window.innerHeight;

                let buttonsToCheck = [];
                if (uiState === 'MAIN') {
                    buttonsToCheck = [btnWater, btnClear, btnDNA, btnSurvey, btnHowTo];
                } else {
                    buttonsToCheck = [btnIntro, btnBot, btnCode, btnBack];
                }

                buttonsToCheck.forEach(btn => {
                    const rect = btn.getBoundingClientRect();
                    if (screenX >= rect.left && screenX <= rect.right && 
                        screenY >= rect.top && screenY <= rect.bottom) {
                        
                        if (uiState === 'MAIN') handleMainButton(btn.id);
                        else handleSubButton(btn.id);
                    }
                });
            }

            // Hide models if Mode is 2 (Clear) or Survey is active or SubMenu is open
            if (modelMode === 2 || uiState === 'SUB' || btnSurvey.classList.contains('active') || !results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                pivotGroup.visible = false;
                renderer.render(scene, camera);
                return;
            }

            pivotGroup.visible = true;
            const hand1 = results.multiHandLandmarks[0];
            const p1 = getPosition(hand1[9]); 

            if (results.multiHandLandmarks.length > 1) {
                const hand2 = results.multiHandLandmarks[1];
                const p2 = getPosition(hand2[9]);
                pivotGroup.position.lerp(new THREE.Vector3((p1.x+p2.x)/2, (p1.y+p2.y)/2, 0), 0.2);
                const dist = Math.sqrt(Math.pow(hand1[9].x - hand2[9].x, 2) + Math.pow(hand1[9].y - hand2[9].y, 2));
                let sMult = (modelMode===3) ? 2.5 : 4.0;
                targetScale = Math.max(0.2, Math.min(5.0, dist * sMult));
            } else {
                pivotGroup.position.lerp(p1, 0.2);
                targetScale = (modelMode===3) ? 0.8 : 1.0;
            }
            currentScale += (targetScale - currentScale) * 0.1;
            pivotGroup.scale.set(currentScale, currentScale, currentScale);

            const w = getV(hand1[0]), m = getV(hand1[9]), i = getV(hand1[5]), p = getV(hand1[17]);
            const yAx = new THREE.Vector3().subVectors(m, w).normalize();
            const xAx = new THREE.Vector3().subVectors(i, p).normalize();
            const zAx = new THREE.Vector3().crossVectors(xAx, yAx).normalize();
            xAx.crossVectors(yAx, zAx).normalize();
            const mat = new THREE.Matrix4();
            mat.makeBasis(xAx, yAx, zAx);
            targetQuat.setFromRotationMatrix(mat);
            pivotGroup.quaternion.slerp(targetQuat, 0.2);

            renderer.render(scene, camera);
        }

        function getV(lm) { return new THREE.Vector3(-lm.x, -lm.y, -lm.z*2); }
        function getPosition(lm) {
            const h = 2 * Math.tan((camera.fov*Math.PI/180)/2) * 12;
            const w = h * camera.aspect;
            return new THREE.Vector3(-(lm.x-0.5)*w, -(lm.y-0.5)*h, 0);
        }

        // --- INIT ---
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
        hands.onResults(onResults);
        const cam = new Camera(videoElement, {onFrame: async()=>{await hands.send({image:videoElement})}, width:1280, height:720});
        cam.start();
        window.addEventListener('resize', ()=>{camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight)});

    </script>
</body>
</html>
