<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;700&display=swap');
:root{--bg:#07090f;--bd:rgba(180,200,255,.14);--amber:#ffc857;--blue:#5bc8ff;--green:#4dffa0;--red:#ff5e72;--violet:#b57aff;--text:#ddeeff;--mut:rgba(180,210,255,.6)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:300 14px 'DM Sans',sans-serif}
#c{position:absolute;inset:0;touch-action:none}
.panel{position:absolute;z-index:5;background:rgba(10,14,28,.92);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:16px;padding:12px 15px}
#title-logo{width:34px;height:37px;flex-shrink:0;opacity:.82}
#brand{display:flex;align-items:center;gap:10px;position:absolute;z-index:6;top:calc(14px + env(safe-area-inset-top,0px));left:16px;font:800 17px Syne;color:#fff}
#brand small{display:block;font:400 9px 'Space Mono';letter-spacing:1.5px;color:var(--mut);margin-top:3px}
#tabs{position:absolute;z-index:10;top:calc(14px + env(safe-area-inset-top,0px));right:16px;left:auto;transform:none;
 display:flex;gap:4px;padding:5px;max-width:calc(100vw - 370px);
 overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:rgba(91,200,255,.4) transparent;
 scroll-behavior:smooth;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
#tabs::-webkit-scrollbar{height:4px}
#tabs::-webkit-scrollbar-track{background:transparent}
#tabs::-webkit-scrollbar-thumb{background:rgba(91,200,255,.3);border-radius:3px}
#tabs::-webkit-scrollbar-thumb:hover{background:rgba(91,200,255,.6)}
.tb{flex-shrink:0;border:0;background:none;color:var(--mut);font:400 10px 'Space Mono';padding:6px 9px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tb:hover{color:#fff}.tb.on{background:rgba(91,200,255,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(91,200,255,.45)}
#cap{top:calc(70px + env(safe-area-inset-top,0px));left:16px;width:320px;max-height:46vh;overflow:auto}
#kpi{font:700 10px 'Space Mono';color:var(--amber);margin-bottom:5px}
#ct{font:700 15px Syne;color:#fff;margin-bottom:8px}
#cx{line-height:1.52;color:#c9dcf5}
#cx p{margin:0 0 9px}
#cx p:last-child{margin-bottom:0}
#cx b{color:var(--blue);font-weight:700}
#rc{position:absolute;z-index:5;top:calc(70px + env(safe-area-inset-top,0px));right:16px;width:240px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 250px);overflow:auto}
#rc>.panel{position:relative;width:100%}
.ph{display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:8px;gap:8px}
.ph h2,.ph span{font:700 10px 'Space Mono';color:var(--mut)}
.fb{background:none;border:0;color:var(--mut);font-size:11px;cursor:pointer;pointer-events:none}
.panel.fold>:not(.ph){display:none}.panel.fold .ph{margin-bottom:0}
#opts{display:flex;justify-content:flex-end;margin-bottom:7px;font:400 11px 'Space Mono';color:var(--mut)}
#opts label{cursor:pointer;display:flex;gap:6px;align-items:center}
#opts input{accent-color:var(--blue)}
.r{display:flex;justify-content:space-between;padding:3px 0;font:400 11px 'Space Mono';gap:10px}
.r span:first-child{color:var(--mut)}
#status{margin-top:8px;padding:7px 9px;border-radius:9px;font-size:12px;line-height:1.35;background:rgba(91,200,255,.1)}
#grw{position:relative;height:150px}
#grc{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#grl{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;font:400 10px 'Space Mono';color:var(--mut)}
#grl i{display:inline-block;width:11px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle}
#ctl{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(940px,calc(100vw - 20px))}
#sl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 22px;margin-bottom:9px}
.s{font:400 11px 'Space Mono'}
.s label{display:flex;justify-content:space-between;color:var(--mut);gap:6px}
.s b{color:#fff}
input[type=range]{width:100%;accent-color:var(--blue)}
.plrow{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap}
.plb{flex:1;min-width:90px;border:1px solid var(--bd);background:rgba(180,200,255,.05);color:var(--text);border-radius:10px;padding:6px 9px;font:400 11px 'Space Mono';cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left}
.plb small{color:var(--mut);font-size:9px}
.plb:hover{background:rgba(180,200,255,.13)}
.plb.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:rgba(91,200,255,.14);color:#fff}
.bs{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--bd);background:rgba(180,200,255,.07);color:var(--text);font:400 11px 'Space Mono';padding:8px 12px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:rgba(180,200,255,.16)}
.btn.amber{border-color:rgba(255,200,87,.5);color:var(--amber)}
.btn.green{border-color:rgba(77,255,160,.5);color:var(--green)}
.btn.on{border-color:rgba(77,255,160,.6);background:rgba(77,255,160,.14);color:var(--green)}
.btn input{accent-color:var(--blue);margin:0}
#chal{display:none;bottom:calc(210px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(580px,calc(100vw - 24px));border-color:rgba(255,200,87,.45)}
#chal.show{display:block}
#chal h3{font:700 12px Syne;color:var(--amber);margin-bottom:6px}
#chal p{line-height:1.45;margin-bottom:8px}
#res{margin-top:8px;font-size:13px;min-height:18px;line-height:1.4}
#quiz{display:none;position:absolute;inset:0;z-index:8;background:rgba(7,9,15,.97);overflow:auto;padding:90px 16px 30px}
#quiz.show{display:block}#qi{max-width:640px;margin:auto}
.q{font:700 18px Syne;color:#fff;margin:8px 0 14px;line-height:1.35}
.k{font:700 10px 'Space Mono';color:var(--amber)}
.o{display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 13px;font:400 13px 'DM Sans';border-radius:11px;border:1px solid var(--bd);background:rgba(180,200,255,.05);color:var(--text);cursor:pointer}
.o:hover{background:rgba(180,200,255,.12)}
.o.ok{border-color:var(--green);background:rgba(77,255,160,.12)}
.o.no{border-color:var(--red);background:rgba(255,94,114,.12)}
#ex{margin:10px 0;line-height:1.5;color:#c9dcf5}
@media(max-width:900px){
 #cap{width:calc(100vw - 32px);max-height:22vh;top:calc(104px + env(safe-area-inset-top,0px))}
 #rc{top:auto;bottom:270px;right:10px;width:196px;max-height:44vh}
 #sl{grid-template-columns:1fr 1fr}
 #tabs{max-width:calc(100vw - 20px);left:10px;right:10px;top:calc(52px + env(safe-area-inset-top,0px));transform:none}
 #brand small{display:none}
 #brand{font-size:14px}
 #chal{bottom:calc(250px + env(safe-area-inset-bottom,0px))}
}
#qr-btn{position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:11px;border:1px solid rgba(120,180,255,.25);background:rgba(6,8,20,.92);backdrop-filter:blur(14px);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;transition:all .2s;color:rgba(120,180,255,.55)}
#qr-btn:hover{border-color:rgba(120,180,255,.55);background:rgba(120,180,255,.14);color:#78b4ff}
#qr-btn svg{width:20px;height:20px}
#qr-modal{display:none;position:fixed;inset:0;z-index:300;background:rgba(4,8,20,.78);backdrop-filter:blur(10px);align-items:center;justify-content:center}
#qr-modal.show{display:flex}
#qr-modal-box{background:rgba(6,10,22,.97);border:1px solid rgba(120,180,255,.3);border-radius:20px;padding:26px 24px 22px;text-align:center;position:relative;max-width:270px;width:90%}
#qr-modal-box h3{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;color:rgba(120,180,255,.5);text-transform:uppercase;margin-bottom:14px}
#qr-modal-box img{width:168px;height:168px;border-radius:10px;border:2px solid rgba(120,180,255,.2);display:block;margin:0 auto 14px}
#qr-modal-box p{font-family:'Space Mono',monospace;font-size:8px;color:rgba(120,180,255,.38);letter-spacing:1px;word-break:break-all;line-height:1.7}
#qr-modal-close{position:absolute;top:10px;right:13px;background:none;border:none;color:rgba(160,200,255,.38);font-size:17px;cursor:pointer;line-height:1;transition:color .2s;padding:2px 4px}
#qr-modal-close:hover{color:#78b4ff}
@media(max-width:1040px){#qr-btn{right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}#ctl{left:10px;transform:none;width:min(940px,calc(100vw - 70px))}}

/* Gauge */
#gauge{position:absolute;z-index:5;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:150px;height:150px;pointer-events:none;display:none}
#gauge.show{display:block}

/* expanded graph */
#grp.expanded{position:fixed;top:90px;left:50%;transform:translateX(-50%);width:min(880px,94vw);height:65vh;max-height:none;z-index:1001;border-color:rgba(91,200,255,.5);display:flex;flex-direction:column}
#grp.expanded .ph{flex:none;cursor:default}
#grp.expanded #grw{flex:1;height:auto;min-height:0;cursor:crosshair}
#grp.expanded #grl{flex:none}
#grp.expanded #gradinfo{flex:none}
#grp-bd{display:none;position:fixed;inset:0;z-index:1000;background:rgba(2,4,10,.72)}
#grp-bd.show{display:block}
#grp .ph .gbtn{border:1px solid var(--bd);background:rgba(180,200,255,.08);color:var(--mut);font:400 9px 'Space Mono';padding:3px 7px;border-radius:6px;cursor:pointer;pointer-events:auto}
#grp .ph .gbtn:hover{background:rgba(180,200,255,.18);color:#fff}
#grp .ph .gbtn.on{border-color:var(--green);color:var(--green);background:rgba(77,255,160,.1)}
#grp .ph .gbtn.close{display:none}
#grp.expanded .ph .gbtn.close{display:inline-block}
#gradinfo{display:none;margin-top:8px;padding:8px 12px;border-radius:8px;background:rgba(77,255,160,.08);border:1px solid rgba(77,255,160,.35);font:400 11px 'Space Mono';color:#4dffa0;line-height:1.7}
#grp.expanded #gradinfo.show{display:block}
#gradinfo b{color:#fff;font-weight:700}
#gradinfo .big{display:block;margin-top:4px;font-size:13px;color:#fff;font-weight:700}
#gradinfo .hint{color:rgba(180,210,255,.65);font-style:italic}

/* Calculator button + panel */
#calc-btn{position:fixed;bottom:68px;right:20px;width:40px;height:40px;border-radius:11px;border:1px solid rgba(255,200,87,.3);background:rgba(6,8,20,.92);backdrop-filter:blur(14px);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;transition:all .2s;color:rgba(255,200,87,.7)}
#calc-btn:hover,#calc-btn.on{border-color:rgba(255,200,87,.7);background:rgba(255,200,87,.14);color:var(--amber)}
#calc-btn svg{width:20px;height:20px}
#calc-panel{position:fixed;z-index:1100;right:16px;bottom:116px;width:min(380px,calc(100vw - 20px));height:min(620px,calc(100vh - 140px));display:none;flex-direction:column;background:rgba(10,14,28,.97);border:1px solid rgba(255,200,87,.35);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.6);overflow:hidden}
#calc-panel.show{display:flex}
#calc-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:grab;touch-action:none;user-select:none;border-bottom:1px solid var(--bd);background:rgba(255,200,87,.06)}
#calc-head:active{cursor:grabbing}
#calc-head h2{font:700 10px 'Space Mono';letter-spacing:1.5px;color:var(--amber)}
#calc-close{border:1px solid var(--bd);background:rgba(180,200,255,.08);color:var(--mut);font-size:13px;width:26px;height:26px;border-radius:7px;cursor:pointer}
#calc-close:hover{color:#fff;background:rgba(180,200,255,.18)}
#calc-frame{flex:1;width:100%;border:0;background:#07090f;min-height:0}
#calc-panel.drag #calc-frame{pointer-events:none}
@media(max-width:1040px){#calc-btn{right:10px;bottom:calc(62px + env(safe-area-inset-bottom,0px))}}
@media(max-width:600px){#calc-panel{left:10px;right:10px;width:auto;bottom:calc(110px + env(safe-area-inset-bottom,0px));height:min(600px,calc(100vh - 150px))}}

  M(grp,cy(.2,.2,.02),NV,0,1.92,0,[.95,1,.9]);

const tsz=m=>1.15+.25*Math.cbrt(m);
const tsz2=m=>2.6+.15*Math.cbrt(m);
/* toy cart from the circular motion lab: forward = +x, length 1.15 */
function mkTrol(c){
  const g=new THREE.Group(), mat=(col,o)=>new THREE.MeshStandardMaterial(Object.assign({color:col,metalness:.45,roughness:.35},o||{}));
  const add=(geo,m,x,y,z)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);g.add(o);return o;};
  add(new THREE.BoxGeometry(1.15,.24,.55),mat(c,{emissive:c,emissiveIntensity:.18}),0,.26,0);
  add(new THREE.BoxGeometry(.55,.2,.46),mat(0x9fd8ff,{transparent:true,opacity:.8,metalness:.1}),-.08,.48,0);
  add(new THREE.BoxGeometry(.5,.04,.44),mat(c),-.08,.6,0);
  [.17,-.17].forEach(z=>{
    add(new THREE.BoxGeometry(.06,.07,.14),mat(0xfff2a8,{emissive:0xffe680,emissiveIntensity:1}),.58,.3,z);
    add(new THREE.BoxGeometry(.05,.06,.12),mat(0xff1a1a,{emissive:0xff1a1a,emissiveIntensity:.8}),-.58,.3,z);
  });
  const wg=new THREE.CylinderGeometry(.14,.14,.12,20), wm=mat(0x151a26,{metalness:.1,roughness:.8});
  [[.38,.3],[.38,-.3],[-.38,.3],[-.38,-.3]].forEach(w=>{const o=add(wg,wm,w[0],.14,w[1]);o.rotation.x=Math.PI/2;});
  return g;
}
function mkTrack(grp,len){
  const t=new THREE.Mesh(bx(len,.12,1.3),mDark); t.position.y=-.06; grp.add(t);
  [-1,1].forEach(a=>[-1,1].forEach(b=>{const l=new THREE.Mesh(cy(.05,.05,1.6),mMetal);l.position.set(a*(len/2-.4),-.92,b*.5);grp.add(l);}));
}
const f1=x=>(+x).toFixed(1);
/* inside-the-car view: small second 3D scene with the 3D student */
const CV={};
function placeSeg(g,a,b){const d=b.clone().sub(a);g.position.copy(a).add(b).multiplyScalar(.5);g.scale.set(1,Math.max(d.length(),.001),1);g.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());}
function initCarView(){
  const cv=document.getElementById('carcv'); CV.r=new THREE.WebGLRenderer({canvas:cv,antialias:true}); CV.r.setSize(624,480,false);
  CV.s=new THREE.Scene(); CV.s.background=new THREE.Color(0x16213a);

  CV.c=new THREE.OrthographicCamera(-.7,1.7,1.78,-.07,.1,20); CV.c.position.set(0,0,6);
  const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7,metalness:.1},o||{}));
  const add=(geo,m,x,y,z)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);CV.s.add(o);return o;};
  const seg=(r,m)=>{const g=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,8),m);CV.s.add(g);return g;};
  add(new THREE.PlaneGeometry(5,4),mat(0x1d2b4a),.5,.8,-.7);
  add(new THREE.BoxGeometry(3,.1,1.4),mat(0x0e1424),.5,-.05,0);
  add(new THREE.BoxGeometry(.7,.18,.55),mat(0x8c8068),.1,.27,0);
  add(new THREE.BoxGeometry(.12,.8,.55),mat(0x8c8068),-.3,.7,0);
  add(new THREE.BoxGeometry(.1,.25,.3),mat(0x9d9178),-.3,1.25,0);
  add(new THREE.BoxGeometry(.5,.55,1.1),mat(0x3a4256),1.1,.5,0);
  add(new THREE.BoxGeometry(.02,1,1.1),mat(0x9fd8ff,{transparent:true,opacity:.18}),1.13,1.23,0).rotation.z=.45;
  const wg=new THREE.Group(); wg.position.set(.8,.93,0); wg.rotation.z=.4; CV.s.add(wg);
  const tor=new THREE.Mesh(new THREE.TorusGeometry(.2,.026,10,28),mat(0x11141c)); tor.rotation.y=Math.PI/2; wg.add(tor);
  wg.add(new THREE.Mesh(new THREE.SphereGeometry(.05,12,8),mat(0x2a3146)));
  const col=seg(.025,mat(0x11141c)); placeSeg(col,V(.8,.93,0),V(1.0,.6,0));
  CV.pv=new THREE.Group(); CV.pv.position.set(0,.41,0); CV.s.add(CV.pv);
  CV.st=makeStudent(); CV.st.g.position.set(0,-.78,0); CV.pv.add(CV.st.g);
  const bm=mat(0x0b0e16); CV.b=[seg(.02,bm),seg(.02,bm),seg(.02,bm)];
  CV.bag=add(new THREE.SphereGeometry(.28,24,16),mat(0xf4f6fb,{roughness:.9}),.78,.93,0);
}
function carView(o){
  if(!CV.s)return;
  const th=o.dx/.95, k=o.bag, g=id=>document.getElementById(id), st=CV.st, c=Math.cos(th), sn=Math.sin(th);
  CV.pv.rotation.z=-th;
  [st.legL,st.legR].forEach(l=>l.rotation.z=Math.PI/2+th); [st.kneeL,st.kneeR].forEach(l=>l.rotation.z=-Math.PI/2);
  [st.armL,st.armR].forEach(l=>l.rotation.z=1.3+.8*th); [st.elbowL,st.elbowR].forEach(l=>l.rotation.z=0);
  const wp=(x,y,z)=>V(x*c+(y-.78)*sn,.41-x*sn+(y-.78)*c,z);
  const A=V(-.3,1.5,.3),S=wp(.03,1.4,.29),H=wp(.16,.8,.29),B=V(-.15,.4,.3);
  placeSeg(CV.b[0],A,S); placeSeg(CV.b[1],S,H); placeSeg(CV.b[2],H,B);
  CV.bag.visible=k>.01; CV.bag.position.set(.78-.2*k,.93,0); CV.bag.scale.setScalar(Math.max(k,.001));
  g('tlg').style.display=o.bars?'':'none';
  if(o.bars){
    const W=336;
    g('tb1').setAttribute('width',(W*o.fc).toFixed(1)); g('tb1f').setAttribute('width',(W*o.fc*o.pc).toFixed(1));
    g('tb2f').setAttribute('width',(W*o.ps).toFixed(1)); g('tmk').setAttribute('x',(12+W*o.ps).toFixed(1));
    g('tl1').textContent='Car stops: '+o.tc+' ms'; g('tl2').textContent='Student stops: '+o.ts+' ms  (+'+o.te+' ms)';
  }
  g('smo').textContent=o.tag||'';
  CV.r.render(CV.s,CV.c);
}

/* ---------- shared trolley pair helpers ---------- */
function pairInit(self,c1,c2){
  self.grp=new THREE.Group(); sc.add(self.grp); mkTrack(self.grp,20);
  self.t1=mkTrol(c1); self.t2=mkTrol(c2); self.grp.add(self.t1,self.t2);
  self.la=dynLabel(); self.lb=dynLabel(); self.grp.add(self.la,self.lb);
}
function pairDraw(self,m1,m2){
  const s1=tsz(m1), s2=tsz(m2);
  self.t1.scale.setScalar(s1); self.t2.scale.setScalar(s2);
  self.t1.position.set(self.x1,0,0); self.t2.position.set(self.x2,0,0);
  arrow(1,V(self.x1,.62*s1+.2,0),self.v1<0?LT:RT,Math.min(Math.abs(m1*self.v1)*.07,3.2));
  arrow(0,V(self.x2,.62*s2+.2,0),self.v2<0?LT:RT,Math.min(Math.abs(m2*self.v2)*.07,3.2));
  self.la.position.set(self.x1,.62*s1+1.1,0); self.la.setText('p = '+(m1*self.v1).toFixed(0),'#5bc8ff');
  self.lb.position.set(self.x2,.62*s2+1.1,0); self.lb.setText('p = '+(m2*self.v2).toFixed(0),'#ffc857');
}

  });

      g.strokeStyle='#0a1f14';
      g.lineWidth=2.5;
      g.beginPath(); g.arc(p.x,p.y,8,0,Math.PI*2); g.fill(); g.stroke();
      g.fillStyle='#0a1f14';
      g.font="bold 11px 'Space Mono'";
      g.textAlign='center'; g.textBaseline='middle';
      g.fillText(String(i+1), p.x, p.y+0.5);
    });
  }
}
function drawGraph(){
  const s=SEC[ti];
  if(!s.graph||!s.graphData){return;}
  const c=$('grc'); if(!c)return;
  const dpr=Math.min(devicePixelRatio||1,2);
  if(c.width!==Math.round(c.clientWidth*dpr) || c.height!==Math.round(c.clientHeight*dpr)){
    resizeGraph();
  }
  const d=s.graphData();
  plot(c,d.series,d.tMax,d.vMax);
  const lg=s.graphLegend? s.graphLegend():[];
  const key=JSON.stringify(lg);
  if(key!==grKey){grKey=key;$('grl').innerHTML=lg.map(x=>`<span><i style="background:${x[1]}"></i>${x[0]}</span>`).join('');}
}
function findNearestDataPoint(sx,sy){
  const s=SEC[ti]; if(!s.graphData||!lastPlot) return null;
  const d=s.graphData();
  const {L,T,iw,ih,tMax,vMax}=lastPlot;
  let best=null,bestDist=45;
  for(const series of d.series){
    for(const pt of series.pts){
      const px=L+iw*clamp(pt[0]/tMax,0,1);
      const py=T+ih*(1-clamp(pt[1]/vMax,0,1));
      const dist=Math.hypot(px-sx,py-sy);
      if(dist<bestDist){bestDist=dist; best={t:pt[0], v:pt[1]};}
    }
  }
  return best;
}
function updateGradInfo(){
  const box=$('gradinfo');
  if(!box) return;
  const expanded=$('grp').classList.contains('expanded');
  if(!expanded||gradPts.length===0){ box.classList.remove('show'); return; }
  box.classList.add('show');
  if(gradPts.length===1){
    const p=gradPts[0];
    box.innerHTML='<b>Point 1:</b> t = '+p.t.toFixed(2)+' s, v = '+p.v.toFixed(2)+' m/s<br><span class="hint">Drag to select point 2…</span>';
  } else {
    const p0=gradPts[0], p1=gradPts[1];
    const dv=p1.v-p0.v, dt=p1.t-p0.t;
    const slope=Math.abs(dt)>1e-9?dv/dt:0;
    box.innerHTML='<b>P1:</b> ('+p0.t.toFixed(2)+' s, '+p0.v.toFixed(2)+' m/s) &nbsp; <b>P2:</b> ('+p1.t.toFixed(2)+' s, '+p1.v.toFixed(2)+' m/s)<br>'+
      '<b>Δv</b> = '+dv.toFixed(2)+' m/s &nbsp; <b>Δt</b> = '+dt.toFixed(2)+' s'+
      '<span class="big">Gradient = Δv / Δt = '+slope.toFixed(2)+' m/s²</span>';
  }
}

/* gradient tool: toggle button */
$('gradbtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  gradMode=!gradMode;
  $('gradbtn').classList.toggle('on',gradMode);
  gradPts=[];
  if($('grc')) $('grc').style.cursor=gradMode?'crosshair':'default';
  updateGradInfo();
  drawGraph();
});

/* gradient tool: press-drag-release on the canvas */
(function(){
  const g=$('grc');
  g.addEventListener('pointerdown', e=>{
    if(!gradMode||!lastPlot) return;
    const rect=g.getBoundingClientRect();
    const sx=e.clientX-rect.left, sy=e.clientY-rect.top;
    const {L,T,iw,ih}=lastPlot;
    if(sx<L||sx>L+iw||sy<T||sy>T+ih) return;
    const pt=findNearestDataPoint(sx,sy);
    if(!pt) return;
    e.preventDefault();
    if(gradPts.length>=2) gradPts=[pt];
    else if(gradPts.length===0) gradPts=[pt];
    else gradPts.push(pt);
    gradDragging=true;
    try{g.setPointerCapture(e.pointerId);}catch(_){}
    updateGradInfo();
    drawGraph();
  });
  g.addEventListener('pointermove', e=>{
    if(!gradMode||!gradDragging||gradPts.length===0) return;
    const rect=g.getBoundingClientRect();
    const sx=e.clientX-rect.left, sy=e.clientY-rect.top;
    const pt=findNearestDataPoint(sx,sy);
    if(!pt) return;
    if(gradPts.length===1) gradPts.push(pt);
    else gradPts[1]=pt;
    updateGradInfo();
    drawGraph();
  });
  g.addEventListener('pointerup', ()=>{ gradDragging=false; });
  g.addEventListener('pointercancel', ()=>{ gradDragging=false; });
})();

/* expand graph */
let grpParent=null;
function expandGraph(){
  const g=$('grp');
  if(g.classList.contains('expanded'))return;
  grpParent=g.parentElement;
  document.body.appendChild(g);
  g.classList.add('expanded');
  $('grp-bd').classList.add('show');
  $('grexp').style.display='none';
  updateGradInfo();
  setTimeout(()=>{ resizeGraph(); drawGraph(); },50);
}
function closeGraph(){
  const g=$('grp');
  if(!g.classList.contains('expanded'))return;
  g.classList.remove('expanded');
  $('grp-bd').classList.remove('show');
  $('grexp').style.display='';
  if(grpParent)grpParent.appendChild(g);
  updateGradInfo();
  setTimeout(resizeGraph,50);
}
$('grexp').addEventListener('click',e=>{e.stopPropagation();expandGraph();});
$('grclose').addEventListener('click',e=>{e.stopPropagation();closeGraph();});
$('grp-bd').onclick=closeGraph;
addEventListener('keydown',e=>{if(e.key==='Escape')closeGraph();});

/* ================= QUIZ ================= */
let qn=0,qs=0,qo=[],qcat=null;
const QPICK=5, qbest={};
function qShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(){            // opens the category menu
  $('quiz').classList.add('show');
  const c=$('qi');
  c.innerHTML=`<div class="k">SELF-ASSESSMENT</div>
  <div class="q">Choose a difficulty level</div>
  <div style="color:#c9dcf5;line-height:1.5;margin-bottom:14px">Each level gives you <b>${QPICK} questions</b> picked at random from a larger bank, so you get a different set every time.</div>
  ${QCATS.map(k=>`<button class="o qcat" data-id="${k.id}" style="border-color:${k.c};padding:14px 16px">
    <span style="font:700 16px Syne;color:${k.c}">${k.n}</span>
    <span style="float:right;font:400 12px 'Space Mono';color:#c9dcf5">${qbest[k.id]!==undefined?'best '+qbest[k.id]+'/'+QPICK:QPICK+' questions'}</span><br>
    <span style="color:#c9dcf5">${k.d}</span></button>`).join('')}`;
  c.querySelectorAll('.qcat').forEach(b=>b.onclick=()=>startCat(b.dataset.id));
}
function startCat(id){
  qcat=QCATS.find(k=>k.id===id);
  qn=0; qs=0;
  qo=qShuffle(QZ[id]).slice(0,QPICK).map(q=>{
    const idx=qShuffle(q[2].map((_,i)=>i));        // shuffle the answer options too
    return {kpi:q[0],q:q[1],opts:idx.map(i=>q[2][i]),ans:idx.indexOf(q[3]),ex:q[4]};
  });
  $('quiz').classList.add('show');
  showQ();
}
function showQ(){
  const q=qo[qn], c=$('qi');
  if(!q){
    if(qbest[qcat.id]===undefined||qs>qbest[qcat.id]) qbest[qcat.id]=qs;
    const others=QCATS.filter(k=>k.id!==qcat.id);
    c.innerHTML=`<div class="k" style="color:${qcat.c}">${qcat.n.toUpperCase()} · RESULT</div>
    <div class="q" style="font-size:34px">${qs}/${qo.length}</div>
    <div id="ex">${qs===qo.length?'Excellent — full marks at this level.':qs>=3?'Good work. Revisit the labs for the ones you missed.':'Keep exploring the labs, then try again.'}</div>
    <button class="btn green" id="qtry">🔄 New ${qcat.n} questions</button>
    <button class="btn" id="qmenu">☰ Choose level</button>`;
    $('qtry').onclick=()=>startCat(qcat.id);
    $('qmenu').onclick=startQuiz;
    return;
  }
  c.innerHTML=`<div class="k" style="color:${qcat.c}">${qcat.n.toUpperCase()} · KPI ${q.kpi} · Question ${qn+1}/${qo.length}</div>
  <div class="q">${q.q}</div>
  ${q.opts.map((o,i)=>`<button class="o" data-i="${i}">${o}</button>`).join('')}
  <div id="ex"></div>
  <button class="btn green" id="nx" style="display:none">${qn+1===qo.length?'See result':'Next'}</button>`;
  c.querySelectorAll('.o').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    c.querySelectorAll('.o').forEach(x=>{x.disabled=true; if(+x.dataset.i===q.ans)x.classList.add('ok');});
    if(i!==q.ans)b.classList.add('no'); else qs++;
    $('ex').textContent=q.ex;
    $('nx').style.display='';
    $('nx').onclick=()=>{qn++;showQ();};
  });
}

/* ================= BUTTONS ================= */
$('act').onclick=()=>{const s=SEC[ti]; if(s.act)s.act();};
$('extra').onclick=()=>{const s=SEC[ti]; if(s.extra)s.extra();};
$('pausep').onclick=()=>{paused=!paused; $('pausep').classList.toggle('on',paused); $('pausep').textContent=paused?'▶ Resume':'⏸ Pause';};
$('rs').onclick=()=>{const c=$('chal').classList.contains('show'); setTab(ti); if(c)$('chal').classList.add('show');};
document.querySelectorAll('.ph').forEach(h=>h.onclick=()=>{const p=h.parentElement; const f=p.classList.toggle('fold'); h.querySelector('.fb').textContent=f?'▲':'▼';});

/* ================= MAIN LOOP ================= */
let last=performance.now();
function loop(n){
  const dt=Math.min((n-last)/1000,.05); last=n;
  const s=SEC[ti];
  s.step(paused?0:dt*($('slow').checked?.25:1));
  updateCam(dt);
  s.hud();
  drawGraph();
  rd.render(sc,cam);
  requestAnimationFrame(loop);
}

/* ================= BOOT ================= */
SEC.forEach(s=>{s.init(); s.grp.visible=false;});
resizeGraph();
setTab(0);
requestAnimationFrame(loop);
</script>

  <div id="calc-head"><h2>🧮 CALCULATOR</h2><button id="calc-close" aria-label="Close calculator">✕</button></div>

</div>
<script>
(function(){
  var btn=document.getElementById('calc-btn'),panel=document.getElementById('calc-panel'),
      frame=document.getElementById('calc-frame'),head=document.getElementById('calc-head');
  function setOpen(o){
    panel.classList.toggle('show',o);btn.classList.toggle('on',o);btn.setAttribute('aria-expanded',o);
    if(o&&!frame.src)frame.src=frame.dataset.src;
  }
  btn.addEventListener('click',function(){setOpen(!panel.classList.contains('show'));});
  document.getElementById('calc-close').addEventListener('click',function(){setOpen(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&panel.classList.contains('show'))setOpen(false);});
  var sx,sy,ox,oy,dragging=false;
  head.addEventListener('pointerdown',function(e){
    if(e.target.id==='calc-close')return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+'px';panel.style.top=r.top+'px';panel.style.right='auto';panel.style.bottom='auto';
    sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;dragging=true;panel.classList.add('drag');head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var x=ox+e.clientX-sx,y=oy+e.clientY-sy;
    x=Math.max(0,Math.min(innerWidth-panel.offsetWidth,x));y=Math.max(0,Math.min(innerHeight-60,y));
    panel.style.left=x+'px';panel.style.top=y+'px';
  });
  function end(){dragging=false;panel.classList.remove('drag');}
  head.addEventListener('pointerup',end);head.addEventListener('pointercancel',end);
})();
</script>
