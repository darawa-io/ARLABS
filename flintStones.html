<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile AR Flint</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; touch-action: none; }
        #input_video { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 1; }
        #output_canvas { position: absolute; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        /* Mobile Overlay */
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; z-index: 10; color: white; font-family: sans-serif; text-shadow: 2px 2px 4px #000; pointer-events: none; }
        
        /* Start Button for Mobile Safari/Chrome */
        #start_overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; font-family: sans-serif;
        }
        #start_btn {
            padding: 15px 40px; font-size: 1.2rem; background: #e67e22; color: white;
            border: none; border-radius: 30px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="start_overlay">
        <button id="start_btn">START AR EXPERIENCE</button>
        <p style="margin-top: 20px;">Allow camera access when prompted</p>
    </div>

    <div id="ui"><b>STRIKE FLINTS</b></div>
    <video id="input_video" playsinline muted autoplay></video>
    <canvas id="output_canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvas = document.getElementById('output_canvas');
        const startBtn = document.getElementById('start_btn');
        const startOverlay = document.getElementById('start_overlay');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 12;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const light = new THREE.DirectionalLight(0xffffff, 1.0);
        light.position.set(5, 10, 7);
        scene.add(light);

        // --- STONE LOGIC ---
        function createFlintTexture() {
            const size = 256; // Smaller for mobile memory
            const texCanvas = document.createElement('canvas');
            texCanvas.width = texCanvas.height = size;
            const ctx = texCanvas.getContext('2d');
            ctx.fillStyle = '#3a3a38';
            ctx.fillRect(0,0,size,size);
            for(let i=0; i<20; i++) {
                ctx.fillStyle = `rgba(220, 210, 190, 0.2)`;
                ctx.beginPath(); ctx.arc(Math.random()*size, Math.random()*size, Math.random()*40, 0, Math.PI*2); ctx.fill();
            }
            return new THREE.CanvasTexture(texCanvas);
        }
        const flintTex = createFlintTexture();

        function createStone(seed, scaleX, scaleY, scaleZ) {
            const geo = new THREE.IcosahedronGeometry(2.0, 3);
            const pos = geo.attributes.position;
            const v = new THREE.Vector3();
            for (let i = 0; i < pos.count; i++) {
                v.fromBufferAttribute(pos, i);
                v.x *= scaleX; v.y *= scaleY; v.z *= scaleZ;
                v.addScaledVector(v.clone().normalize(), 0.4 * Math.sin(v.x + seed));
                pos.setXYZ(i, v.x, v.y, v.z);
            }
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: flintTex, roughness: 0.7, flatShading: true }));
        }

        const stoneL = createStone(10, 0.8, 1.5, 1.0);
        const stoneR = createStone(50, 1.4, 0.8, 1.1);
        scene.add(stoneL, stoneR);

        // --- SPARKS ---
        const sparkCount = 40;
        const sparkGeo = new THREE.BufferGeometry();
        const sparkPos = new Float32Array(sparkCount * 3);
        const sparkVels = [];
        for(let i=0; i<sparkCount; i++) sparkVels.push(new THREE.Vector3());
        sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
        const sparkMat = new THREE.PointsMaterial({ color: 0xffcc00, size: 0.25, transparent: true, blending: THREE.AdditiveBlending });
        const sparkSystem = new THREE.Points(sparkGeo, sparkMat);
        scene.add(sparkSystem);
        let sparkLife = 0;

        function triggerSparks(pos) {
            sparkSystem.position.copy(pos);
            sparkLife = 1.0;
            const positions = sparkGeo.attributes.position.array;
            for (let i = 0; i < sparkCount; i++) {
                positions[i*3] = positions[i*3+1] = positions[i*3+2] = 0;
                sparkVels[i].set((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5)).multiplyScalar(1.2);
            }
        }

        function updateRotation(stone, landmarks) {
            const wrist = new THREE.Vector3(landmarks[0].x, landmarks[0].y, landmarks[0].z);
            const indexBase = new THREE.Vector3(landmarks[5].x, landmarks[5].y, landmarks[5].z);
            const pinkyBase = new THREE.Vector3(landmarks[17].x, landmarks[17].y, landmarks[17].z);
            const up = new THREE.Vector3().subVectors(indexBase, wrist).normalize();
            const side = new THREE.Vector3().subVectors(pinkyBase, wrist).normalize();
            const forward = new THREE.Vector3().crossVectors(up, side).normalize();
            const matrix = new THREE.Matrix4().makeBasis(side, up, forward);
            stone.quaternion.slerp(new THREE.Quaternion().setFromRotationMatrix(matrix), 0.2);
        }

        // --- MEDIAPIPE ---
        function onResults(results) {
            stoneL.visible = stoneR.visible = false;
            if (results.multiHandLandmarks) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const label = results.multiHandedness[index].label;
                    const targetStone = (label === "Left") ? stoneR : stoneL;
                    const p = landmarks[9]; 
                    const h = 2 * Math.tan((camera.fov * Math.PI / 180) / 2) * 12;
                    const w = h * camera.aspect;
                    targetStone.position.lerp(new THREE.Vector3(-(p.x - 0.5) * w, -(p.y - 0.5) * h, 0), 0.3);
                    updateRotation(targetStone, landmarks);
                    targetStone.visible = true;
                });
                if (stoneL.visible && stoneR.visible) {
                    const dist = stoneL.position.distanceTo(stoneR.position);
                    if (dist < 4.0) triggerSparks(new THREE.Vector3().lerpVectors(stoneL.position, stoneR.position, 0.5));
                }
            }
            if (sparkLife > 0) {
                sparkLife -= 0.05;
                const positions = sparkGeo.attributes.position.array;
                for (let i = 0; i < sparkCount; i++) {
                    positions[i*3] += sparkVels[i].x; positions[i*3+1] += sparkVels[i].y; positions[i*3+2] += sparkVels[i].z;
                    sparkVels[i].y -= 0.02;
                }
                sparkGeo.attributes.position.needsUpdate = true;
                sparkMat.opacity = sparkLife;
            }
            renderer.render(scene, camera);
        }

        const hands =
