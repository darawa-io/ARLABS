<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Circuit Lab | Current, Resistance &amp; Ohm's Law</title>
<link rel="icon" type="image/png" href="assets/logo1.png">
<link rel="icon" type="image/png" href="assets/logo1.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8A%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;700&display=swap');
:root{--bg:#07090f;--surface:#0d1120;--border:rgba(180,200,255,0.12);--amber:#ffc857;--blue:#5bc8ff;--violet:#b57aff;--green:#4dffa0;--red:#ff5e72;--text:#ddeeff;--muted:rgba(180,210,255,0.55);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'DM Sans',sans-serif;font-weight:300;overflow:hidden;height:100vh;width:100vw;color:var(--text);-webkit-tap-highlight-color:transparent;touch-action:none;}
#mainCanvas{position:absolute;inset:0;z-index:1;touch-action:none;}
#title{position:absolute;top:16px;left:16px;z-index:5;display:flex;align-items:center;gap:10px;}
#title-logo{width:34px;height:37px;flex-shrink:0;opacity:0.82;}
#title-text h1{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;color:#fff;letter-spacing:.5px;}
#title-text p{font-size:9px;color:rgba(180,200,255,0.45);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;font-family:'Space Mono',monospace;}
#tabs{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:4px;background:rgba(10,14,28,0.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:5px;max-width:min(780px,calc(100vw - 220px));overflow-x:auto;}
#tabs::-webkit-scrollbar{height:4px;}
.tab-btn{flex-shrink:0;padding:6px 10px;border-radius:9px;border:none;background:transparent;color:var(--muted);font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.5px;cursor:pointer;white-space:nowrap;transition:all .2s;}
.tab-btn:hover{color:#fff;background:rgba(180,200,255,0.08);}
.tab-btn.active{background:rgba(91,200,255,0.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(91,200,255,0.4);}
#left-stack{position:absolute;top:66px;left:16px;z-index:12;display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-height:calc(100vh - 82px);overflow-y:auto;}
#caption{max-width:340px;flex-shrink:0;background:rgba(10,14,28,0.90);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:14px;padding:14px 16px;transition:all 0.3s ease;}
#caption::-webkit-scrollbar{width:4px;}
.caption-head{display:flex;justify-content:space-between;align-items:center;}
#caption-kpi{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--green);text-transform:uppercase;margin-bottom:4px;}
#caption-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:#fff;margin-bottom:8px;}
#caption-text{font-size:11.5px;line-height:1.6;color:rgba(210,225,255,0.85);}
#caption-text p{margin-bottom:10px;}
#caption-text p:last-child{margin-bottom:0;}
#caption-text b{color:#fff;}
.btn-fold{background:none;border:none;color:var(--muted);cursor:pointer;font-family:'Space Mono',monospace;font-size:12px;padding:2px 6px;border-radius:4px;}
.btn-fold:hover{color:#fff;background:rgba(180,200,255,0.1);}
#caption.collapsed #caption-text{display:none;}
#hud{position:absolute;top:16px;right:16px;background:rgba(10,14,28,0.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:18px;padding:16px;min-width:230px;z-index:10;}
#hud h2{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;color:rgba(180,200,255,0.5);text-transform:uppercase;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:8px;}
.dr{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:5px 8px;border-radius:8px;background:rgba(180,200,255,0.04);gap:10px;}
.dl{font-family:'Space Mono',monospace;font-size:10.5px;color:rgba(180,210,255,0.65);}
.dv{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;text-align:right;}
#controls{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(10,14,28,0.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:26px;padding:9px 16px;z-index:10;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);}
#scene-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;}
.btn{padding:7px 14px;border-radius:20px;border:1px solid rgba(180,200,255,0.25);background:rgba(180,200,255,0.06);color:var(--blue);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap;outline:none;}
.btn:hover{background:rgba(180,200,255,0.14);}
.btn.on{background:rgba(91,200,255,0.2);border-color:var(--blue);color:#fff;}
.btn.green{border-color:rgba(77,255,160,0.4);color:var(--green);background:rgba(77,255,160,0.06);}
.btn.green.on{background:rgba(77,255,160,0.18);border-color:var(--green);color:#fff;}
.btn.amber{border-color:rgba(255,200,87,0.4);color:var(--amber);background:rgba(255,200,87,0.06);}
.btn.amber.on{background:rgba(255,200,87,0.22);border-color:var(--amber);color:#fff;}
.btn:disabled{opacity:0.35;cursor:not-allowed;}
.btn:disabled:hover{background:rgba(180,200,255,0.06);}
.sep{width:1px;height:20px;background:var(--border);flex-shrink:0;}
.sw{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10.5px;font-family:'Space Mono',monospace;white-space:nowrap;}
select{background:rgba(180,200,255,0.08);border:1px solid rgba(180,200,255,0.3);color:var(--text);border-radius:8px;padding:5px 8px;font-family:'Space Mono',monospace;font-size:10.5px;outline:none;}
select option{background:#0d1120;color:#fff;}
input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:rgba(180,200,255,0.15);outline:none;cursor:pointer;width:100px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--violet);cursor:pointer;box-shadow:0 0 8px rgba(181,122,255,0.6);}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--violet);border:none;cursor:pointer;}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10.5px;font-family:'Space Mono',monospace;white-space:nowrap;cursor:pointer;user-select:none;}
#hint{position:absolute;bottom:66px;left:50%;transform:translateX(-50%);font-size:9px;color:rgba(180,200,255,0.25);letter-spacing:1px;pointer-events:none;font-family:'Space Mono',monospace;z-index:10;white-space:nowrap;}
#challenge-wrap{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);z-index:15;display:none;width:min(620px,calc(100vw - 24px));}
#challenge-wrap.show{display:block;}
#challenge-wrap.s5-pos{top:66px;left:16px;bottom:auto;transform:none;width:340px;max-height:min(480px,calc(100vh - 160px));overflow-y:auto;}
#challenge-bar{background:rgba(10,14,28,0.96);backdrop-filter:blur(22px);border:1px solid rgba(255,200,87,0.4);border-radius:18px;padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
#chal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;border-bottom:1px solid rgba(255,200,87,0.2);padding-bottom:6px;}
#chal-head span{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--amber);text-transform:uppercase;font-weight:700;}
#chal-score{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--green);}
#chal-prompt{font-size:12px;line-height:1.5;color:var(--text);margin-bottom:10px;}
#challenge-wrap.collapsed #chal-body, #challenge-wrap.collapsed #chal-prompt, #challenge-wrap.collapsed #chal-actions, #challenge-wrap.collapsed #chal-result {display:none;}
.chal-inputs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
@media (max-width:520px){ .chal-inputs-grid{grid-template-columns:1fr;} }
.chal-field{display:flex;flex-direction:column;gap:4px;}
.chal-field label{font-size:10px;font-family:'Space Mono',monospace;color:var(--muted);}
.chal-input,.chal-select{background:rgba(180,200,255,0.08);border:1px solid rgba(180,200,255,0.3);color:var(--text);border-radius:8px;padding:6px 10px;font-family:'Space Mono',monospace;font-size:11.5px;outline:none;width:100%;}
.chal-input:focus,.chal-select:focus{border-color:var(--blue);box-shadow:0 0 6px rgba(91,200,255,0.4);}
.chal-input:disabled,.chal-select:disabled{opacity:0.45;cursor:not-allowed;background:rgba(0,0,0,0.3);}
.chal-select option{background:#0d1120;color:#fff;}
#chal-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;}
#chal-result{font-size:11.5px;line-height:1.5;margin-top:8px;padding:8px 12px;border-radius:10px;display:none;}
#chal-result.pass{display:block;background:rgba(77,255,160,0.12);color:var(--green);border:1px solid rgba(77,255,160,0.35);}
#chal-result.fail{display:block;background:rgba(255,94,114,0.12);color:var(--red);border:1px solid rgba(255,94,114,0.35);}
#quiz-btn{position:fixed;bottom:16px;right:16px;width:44px;height:44px;border-radius:13px;border:1px solid rgba(180,120,255,.4);background:rgba(6,8,20,.92);backdrop-filter:blur(14px);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:20;transition:all .2s;font-size:19px;}
#quiz-btn:hover{border-color:rgba(181,122,255,.8);background:rgba(181,122,255,.12);}
#quiz-modal{display:none;position:fixed;inset:0;z-index:150;background:rgba(4,6,18,.82);backdrop-filter:blur(10px);align-items:center;justify-content:center;}
#quiz-modal.show{display:flex;}
#quiz-box{background:rgba(9,11,22,.98);border:1px solid rgba(180,120,255,.3);border-radius:20px;padding:26px;text-align:left;position:relative;max-width:480px;width:92%;max-height:82vh;overflow-y:auto;}
#quiz-close{position:absolute;top:12px;right:14px;background:none;border:none;color:rgba(255,255,255,.5);font-size:19px;cursor:pointer;}
#quiz-box h3{font-family:'Syne',sans-serif;font-size:18px;color:#fff;margin-bottom:4px;}
#quiz-progress{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:16px;}
#quiz-kpi{display:inline-block;font-family:'Space Mono',monospace;font-size:9px;color:var(--violet);border:1px solid rgba(181,122,255,.4);border-radius:8px;padding:2px 7px;margin-bottom:10px;}
#quiz-question{font-size:14.5px;line-height:1.6;color:var(--text);margin-bottom:14px;}
#quiz-options{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.quiz-opt{text-align:left;padding:10px 14px;border-radius:12px;border:1px solid rgba(180,200,255,0.2);background:rgba(180,200,255,0.05);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .15s;}
.quiz-opt:hover{background:rgba(180,200,255,0.12);}
.quiz-opt.correct{background:rgba(77,255,160,0.2);border-color:var(--green);}
.quiz-opt.wrong{background:rgba(255,94,114,0.2);border-color:var(--red);}
#quiz-explain{font-size:12px;line-height:1.55;color:rgba(200,215,255,0.75);background:rgba(180,200,255,0.05);border-radius:10px;padding:10px 12px;display:none;margin-bottom:12px;}
#quiz-next{display:none;}
#quiz-final{display:none;text-align:center;}
#quiz-final h2{font-family:'Syne',sans-serif;font-size:26px;color:#fff;margin-bottom:8px;}
#quiz-final p{font-size:13px;color:var(--muted);margin-bottom:16px;}
#qr-btn{position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:11px;border:1px solid rgba(120,180,255,.25);background:rgba(6,8,20,.92);backdrop-filter:blur(14px);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;transition:all .2s;color:rgba(120,180,255,.55);}
#qr-btn:hover{border-color:rgba(120,180,255,.55);background:rgba(120,180,255,.14);color:#78b4ff;}
#qr-btn svg{width:20px;height:20px;}
#qr-modal{display:none;position:fixed;inset:0;z-index:300;background:rgba(4,8,20,.78);backdrop-filter:blur(10px);align-items:center;justify-content:center;}
#qr-modal.show{display:flex;}
#qr-modal-box{background:rgba(6,10,22,.97);border:1px solid rgba(120,180,255,.3);border-radius:20px;padding:26px 24px 22px;text-align:center;position:relative;max-width:270px;width:90%;}
#qr-modal-box h3{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;color:rgba(120,180,255,.5);text-transform:uppercase;margin-bottom:14px;}
#qr-modal-box img{width:168px;height:168px;border-radius:10px;border:2px solid rgba(120,180,255,.2);display:block;margin:0 auto 14px;}
#qr-modal-box p{font-family:'Space Mono',monospace;font-size:8px;color:rgba(120,180,255,.38);letter-spacing:1px;word-break:break-all;line-height:1.7;}
#qr-modal-close{position:absolute;top:10px;right:13px;background:none;border:none;color:rgba(160,200,255,.38);font-size:17px;cursor:pointer;line-height:1;transition:color .2s;padding:2px 4px;}
#qr-modal-close:hover{color:#78b4ff;}
#graph-panel{flex-shrink:0;background:rgba(10,14,28,0.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:12px 14px;width:250px;display:none;}
#graph-panel.show{display:block;}
#graph-panel h3{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--violet);text-transform:uppercase;margin-bottom:8px;}
#graph-canvas{width:100%;height:140px;display:block;background:rgba(0,0,0,0.28);border-radius:8px;}
#graph-legend{font-size:9.5px;font-family:'Space Mono',monospace;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;}
#graph-legend span{display:inline-flex;align-items:center;gap:4px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
#lab-table-wrap{display:none;margin-top:10px;}
#lab-table-wrap.show{display:block;}
#graph-panel.no-canvas #graph-canvas,#graph-panel.no-canvas #graph-legend{display:none;}
.data-table-scroll{max-height:150px;overflow-y:auto;margin-top:4px;border:1px solid var(--border);border-radius:10px;background:rgba(0,0,0,0.25);}
.data-table{width:100%;border-collapse:collapse;font-size:9.5px;font-family:'Space Mono',monospace;}
.data-table th{background:rgba(180,200,255,0.08);color:var(--muted);text-align:left;padding:4px 6px;font-weight:400;position:sticky;top:0;}
.data-table td{padding:4px 6px;border-top:1px solid rgba(180,200,255,0.06);color:#fff;}
#lab-summary{font-size:10px;line-height:1.5;color:rgba(200,215,255,0.8);margin-top:8px;}
#lab-summary b{color:#fff;}
</style>
</head>

const orb = { theta: 0.35, phi: 0.22, radius: 14, cx:0, cy:0.1, cz:0 };
function applyOrbit(){
  orb.phi = clamp(orb.phi, -Math.PI/5, Math.PI/3.2);
  orb.radius = clamp(orb.radius, 5, 30);
  const r=orb.radius,p=orb.phi,t=orb.theta;
  cam3.position.set(orb.cx+r*Math.cos(p)*Math.sin(t), orb.cy+r*Math.sin(p), orb.cz+r*Math.cos(p)*Math.cos(t));
  cam3.lookAt(orb.cx,orb.cy,orb.cz);
}
applyOrbit();
let dragStart=null, pinchDist0=0, pinchR0=orb.radius;
canvas.addEventListener('mousedown',e=>{dragStart={x:e.clientX,y:e.clientY};});
window.addEventListener('mousemove',e=>{ if(!dragStart) return; orb.theta -= (e.clientX-dragStart.x)*0.005; orb.phi += (e.clientY-dragStart.y)*0.005; applyOrbit(); dragStart={x:e.clientX,y:e.clientY}; });
window.addEventListener('mouseup',()=>dragStart=null);

canvas.addEventListener('touchmove',e=>{ e.preventDefault(); if(e.touches.length===1 && dragStart){ orb.theta -= (e.touches[0].clientX-dragStart.x)*0.005; orb.phi += (e.touches[0].clientY-dragStart.y)*0.005; applyOrbit(); dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; } else if(e.touches.length===2 && pinchDist0>0){ const nd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); orb.radius = pinchR0*(pinchDist0/nd); applyOrbit(); } },{passive:false});

function spawnExpandingPulse(origin,color){ const g=new THREE.SphereGeometry(1,16,12); const m=new THREE.MeshBasicMaterial({color,wireframe:true,transparent:true,opacity:0.85}); const mesh=new THREE.Mesh(g,m); mesh.position.copy(origin); mesh.scale.setScalar(0.1); stage.add(mesh); return {mesh, born:performance.now()}; }
function tickPulses(arr, maxLife, maxScale){ for(let i=arr.length-1;i>=0;i--){ const p=arr[i]; const age=(performance.now()-p.born)/1000; if(age>maxLife){ stage.remove(p.mesh); arr.splice(i,1); continue; } const f=age/maxLife; p.mesh.scale.setScalar(0.1+f*maxScale); p.mesh.material.opacity=0.85*(1-f); } }

function makeTextSprite(text, opts){
  opts=opts||{}; const fontSize=opts.fontSize||64; const color=opts.color||'#ffffff'; const bgColor=opts.bgColor||null;
  const cv=document.createElement('canvas'); const ctx=cv.getContext('2d');
  ctx.font=`700 ${fontSize}px 'Space Mono', Arial, sans-serif`;
  const textW=Math.ceil(ctx.measureText(text).width);
  cv.width=textW+48; cv.height=fontSize+40;
  if(bgColor){ ctx.fillStyle=bgColor; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(4,4,cv.width-8,cv.height-8,16); else ctx.rect(4,4,cv.width-8,cv.height-8); ctx.fill(); }
  ctx.font=`700 ${fontSize}px 'Space Mono', Arial, sans-serif`; ctx.fillStyle=color; ctx.textBaseline='middle'; ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,0.85)'; ctx.shadowBlur=8; ctx.fillText(text, cv.width/2, cv.height/2);
  const tex=new THREE.CanvasTexture(cv); tex.needsUpdate=true;
  const m=new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
  const sprite=new THREE.Sprite(m); const h=opts.height||0.45;
  sprite.scale.set((cv.width/cv.height)*h, h, 1); sprite.renderOrder=999; return sprite;
}

/* ===== Shared circuit-building helpers ===== */
function wireSegment(ax,ay,bx,by,color){
  const dx=bx-ax, dy=by-ay; const len=Math.hypot(dx,dy);
  const geo=new THREE.BoxGeometry(len,0.06,0.06);
  const m=mat(color||0x8899bb,{metalness:0.5,roughness:0.45});
  const mesh=new THREE.Mesh(geo,m);
  mesh.position.set((ax+bx)/2,(ay+by)/2,0);
  mesh.rotation.z=Math.atan2(dy,dx);
  return mesh;
}
function loopPoint(t,x0,x1,y0,y1){
  const tt=((t%1)+1)%1;
  const corners=[[x0,y1],[x1,y1],[x1,y0],[x0,y0]];
  const seg=Math.floor(tt*4); const local=(tt*4)-seg;
  const a=corners[seg], b=corners[(seg+1)%4];
  return {x:a[0]+(b[0]-a[0])*local, y:a[1]+(b[1]-a[1])*local};
}
function buildLoopWires(x0,x1,y0,y1,color){
  const g=new THREE.Group();
  g.add(wireSegment(x0,y1,x1,y1,color));
  g.add(wireSegment(x1,y1,x1,y0,color));
  g.add(wireSegment(x1,y0,x0,y0,color));
  g.add(wireSegment(x0,y0,x0,y1,color));
  return g;
}
function batteryMesh(x,y){
  /* Stylized AA cell: black lower body, copper/orange upper body, silver button (+) on top, flat silver disc (−) on bottom — poles clearly marked. */

  black.position.y=yCursor+blackH/2; g.add(black); yCursor+=blackH;
  const ring=new THREE.Mesh(new THREE.CylinderGeometry(r*1.01,r*1.01,0.03,20), mat(0x555f6e,{metalness:0.7,roughness:0.3}));
  ring.position.y=yCursor; g.add(ring);
  const copper=new THREE.Mesh(new THREE.CylinderGeometry(r,r,copperH,20), mat(0xcf7a2e,{metalness:0.35,roughness:0.35}));
  copper.position.y=yCursor+copperH/2; g.add(copper); yCursor+=copperH;
  const tip=new THREE.Mesh(new THREE.CylinderGeometry(r*0.45,r,tipH,20), mat(0xb85f14,{metalness:0.35,roughness:0.35}));
  tip.position.y=yCursor+tipH/2; g.add(tip); yCursor+=tipH;
  const button=new THREE.Mesh(new THREE.CylinderGeometry(r*0.32,r*0.4,0.1,16), mat(0xd7dde3,{metalness:0.75,roughness:0.25}));
  button.position.y=yCursor+0.05; g.add(button); yCursor+=0.1;
  const flatNeg=new THREE.Mesh(new THREE.CylinderGeometry(r,r,0.045,20), mat(0xc3c9d1,{metalness:0.75,roughness:0.25}));
  flatNeg.position.y=-H/2-0.02; g.add(flatNeg);
  const lp=makeTextSprite('+',{color:'#1a1006',height:0.4}); lp.position.set(0,H/2-0.28,r+0.02); g.add(lp);
  const lm=makeTextSprite('-',{color:'#eef4ff',height:0.4}); lm.position.set(0,-H/2+0.28,r+0.02); g.add(lm);
  g.position.set(x,y,0);
  g.userData.topY=yCursor+0.1; g.userData.bottomY=-H/2-0.045;
  return g;
}
function resistorMesh(x,y,label){

function makeLoopParticles(n,color,x0,x1,y0,y1){
  const arr=[];
  for(let i=0;i<n;i++){
    const t=i/n; const p=loopPoint(t,x0,x1,y0,y1);
    const sph=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8), emat(color,0.9));
    sph.position.set(p.x,p.y,0); stage.add(sph);
    arr.push({t,mesh:sph});
  }
  return arr;
}
function updateLoopParticles(arr,dt,speed,dir,x0,x1,y0,y1){
  arr.forEach(p=>{ p.t=((p.t+dir*speed*dt)%1+1)%1; const pt=loopPoint(p.t,x0,x1,y0,y1); p.mesh.position.set(pt.x,pt.y,0); });
}

/* ===== Generic V–I graph panel (canvas-drawn) ===== */
function drawVIGraph(opts){
  const canvas=el('graph-canvas'); if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const padL=44, padB=26, padT=10, padR=10;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const xMax=opts.xMax, yMax=opts.yMax;
  function mapX(v){ return padL+clamp(v/xMax,0,1)*plotW; }
  function mapY(i){ return padT+plotH-clamp(i/yMax,0,1)*plotH; }
  ctx.font="10px 'Space Mono', monospace";
  for(let k=0;k<=4;k++){
    const gx=xMax*k/4, gy=yMax*k/4;
    const px=mapX(gx), py=mapY(gy);
    ctx.strokeStyle='rgba(180,200,255,0.08)';
    ctx.beginPath(); ctx.moveTo(px,padT); ctx.lineTo(px,padT+plotH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL,py); ctx.lineTo(padL+plotW,py); ctx.stroke();
    ctx.fillStyle='rgba(180,200,255,0.45)';
    ctx.fillText(gx.toFixed(gx<10?1:0), px-6, padT+plotH+14);
    ctx.fillText(gy.toFixed(gy<10?1:0), 6, py+3);
  }
  ctx.strokeStyle='rgba(180,200,255,0.35)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(padL,padT+plotH); ctx.lineTo(padL+plotW,padT+plotH); ctx.stroke();
  ctx.fillStyle='rgba(200,215,255,0.65)';
  ctx.fillText(opts.xLabel||'V (Volts)', padL+plotW/2-22, h-2);
  ctx.save(); ctx.translate(12,padT+plotH/2+16); ctx.rotate(-Math.PI/2); ctx.fillText(opts.yLabel||'I (A)',0,0); ctx.restore();
  (opts.curves||[]).forEach(c=>{
    ctx.strokeStyle=c.color; ctx.lineWidth=2.2; ctx.beginPath();
    c.points.forEach((p,idx)=>{ const px=mapX(p.v), py=mapY(p.i); if(idx===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); });
    ctx.stroke();
  });
  (opts.recorded||[]).forEach(p=>{
    ctx.fillStyle=p.color||'#4dffa0';
    ctx.beginPath(); ctx.arc(mapX(p.v),mapY(p.i),3.5,0,Math.PI*2); ctx.fill();
  });
  (opts.liveMarkers||[]).forEach(m=>{
    ctx.fillStyle=m.color||'#ffc857';
    ctx.beginPath(); ctx.arc(mapX(m.v),mapY(m.i),5.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.stroke();
  });
}

/* ================= SCENE 1 — Electric Current (KPI 3.1.1) ================= */
const e1={particles:[],pulses:[],running:false,t:0,n:0,challengeActive:false,chalAnswer:0};
function e1_build(){
  e1.particles=[]; e1.pulses=[]; e1.running=false; e1.t=0; e1.n=0;
  const wireLen=8;
  const wireMesh=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,wireLen,16), mat(0x445566,{metalness:0.6,roughness:0.35}));
  wireMesh.rotation.z=Math.PI/2; stage.add(wireMesh);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.36,0.045,10,30), emat(0xffc857,1.3));
  ring.rotation.y=Math.PI/2; stage.add(ring);
  const lbl=makeTextSprite('marked cross-section', {color:'#ffc857', height:0.3}); lbl.position.set(0,0.95,0); stage.add(lbl);
  const count=16;
  for(let i=0;i<count;i++){
    const grp=new THREE.Group();
    const sph=new THREE.Mesh(new THREE.SphereGeometry(0.16,14,12), emat(0x3a7bd5,0.55));
    grp.add(sph);
    const sign=makeTextSprite('-',{color:'#ffffff',height:0.24});
    sign.position.set(0,0,0.17); grp.add(sign);
    const x=-4+(i/count)*8;
    grp.position.set(x,0,0); stage.add(grp);
    e1.particles.push({mesh:grp,x});
  }
}
function e1_rate(){ return parseFloat(el('e1-rate')?.value||6); }
function e1_slow(){ return !!el('e1-slow')?.checked; }
function e1_tick(dt){
  const speed=e1_rate()*0.5*(e1_slow()?0.25:1);
  if(e1.running) e1.t+=dt;
  e1.particles.forEach(p=>{
    if(e1.running){
      const prevX=p.x;
      p.x+=speed*dt;
      if(p.x>4) p.x-=8;
      p.mesh.position.x=p.x;
      if(prevX<0 && p.x>=0){ e1.n++; e1.pulses.push(spawnExpandingPulse(new THREE.Vector3(0,0,0),0xffc857)); }
    }
  });
  tickPulses(e1.pulses,0.6,2.6);
}
function e1_toggleRun(){
  e1.running=!e1.running;
  const b=el('e1-start');
  b.textContent=e1.running?'⏸ Stop Timer':'▶ Start Timer';
  b.classList.toggle('on',e1.running);
}
function e1_hud(){
  const Q=e1.n*E_CHARGE;
  const I=e1.t>0?Q/e1.t:0;
  if(e1.challengeActive){
    return [{l:'Carriers per second',v:fmt(e1_rate(),1),c:'#ffc857'},{l:'Elapsed time t',v:fmt(e1.t,2)+' s',c:'#5bc8ff'},{l:'Charges counted n',v:e1.n,c:'#4dffa0'}];
  }
  return [
    {l:'Elapsed time t',v:fmt(e1.t,2)+' s',c:'#ffc857'},
    {l:'Charges counted n',v:e1.n,c:'#5bc8ff'},
    {l:'Charge Q = n·e',v:fmtSci(Q,2)+' C',c:'#b57aff'},
    {l:'Current I = Q/t',v:e1.t>0?fmtSci(I,2)+' A':'—',c:'#4dffa0'}
  ];
}
function e1_initChallenge(){
  e1.challengeActive=true; e1.running=false; e1.t=0; e1.n=0;
  const startBtn=el('e1-start'); if(startBtn){ startBtn.disabled=true; startBtn.textContent='▶ Start Timer'; startBtn.classList.remove('on'); }
  const rateSlider=el('e1-rate'); if(rateSlider) rateSlider.disabled=true;
  el('caption').style.display='none';
  el('challenge-wrap').classList.add('s5-pos');
  const variant = Math.random()<0.5?'Qt':'net';
  let promptHtml;
  if(variant==='Qt'){

/* ================= SCENE 6 — Resistivity & Factors (Lab 3, KPI 3.1.7/3.1.8/3.1.9) ================= */
const e6={x0:-2.6,x1:2.6,y0:-1.4,y1:1.4,wireMesh:null,bulb:null,parts:[],challengeActive:false,chalType:null,chalMaterial:null,chalAnswer:0};
function e6_lengthM(){ return parseFloat(el('e6-l')?.value||2); }
function e6_diamMm(){ return parseFloat(el('e6-d')?.value||1); }
function e6_material(){ return el('e6-mat')?.value||'nichrome'; }
function e6_compute(){
  const l=e6_lengthM(), d=e6_diamMm(), matKey=e6_material();
  const rho=MATERIALS[matKey].rho;
  const r=(d/1000)/2;
  const A=Math.PI*r*r;
  const R=rho*l/A;
  return {l,d,matKey,rho,A,R};
}
function e6_build(){
  clearStage();
  e6.parts=[];
  const {x0,x1,y0,y1}=e6;
  stage.add(wireSegment(x1,y1,x1,y0,0x5a6a90));
  stage.add(wireSegment(x1,y0,x0,y0,0x5a6a90));
  stage.add(wireSegment(x0,y0,x0,y1,0x5a6a90));
  stage.add(batteryMesh(x0,0));
  const bulb=bulbMesh(x1,0); stage.add(bulb); e6.bulb=bulb;
  const {l,d,matKey}=e6_compute();
  const visRad=lerp(0.06,0.32,clamp((d-0.2)/(3-0.2),0,1));
  const color=MATERIALS[matKey].color;
  const topLen=x1-x0;
  const lFrac=clamp((l-0.5)/(5-0.5),0,1);
  const visLen=lerp(0.8,4.4,lFrac);
  const leadLen=(topLen-visLen)/2;
  if(leadLen>0.03){
    stage.add(wireSegment(x0,y1,x0+leadLen,y1,0x5a6a90));
    stage.add(wireSegment(x1-leadLen,y1,x1,y1,0x5a6a90));
  }
  const wireMesh=new THREE.Mesh(new THREE.CylinderGeometry(visRad,visRad,visLen,20), mat(color,{metalness:0.55,roughness:0.4}));
  wireMesh.rotation.z=Math.PI/2;
  wireMesh.position.set((x0+x1)/2,y1,0);
  stage.add(wireMesh); e6.wireMesh=wireMesh;
  const lbl=makeTextSprite(MATERIALS[matKey].name+' sample wire',{color:'#ffffff',height:0.3});
  lbl.position.set((x0+x1)/2, y1+visRad+0.4, 0); stage.add(lbl);
  const n=14;
  const partRad=0.09;
  for(let i=0;i<n;i++){
    const sph=new THREE.Mesh(new THREE.SphereGeometry(partRad,10,8), emat(0xbcefff,0.9));
    const t=i/n;
    const p=loopPoint(t,x0,x1,y0,y1);
    sph.position.set(p.x,p.y,0); stage.add(sph);
    e6.parts.push({mesh:sph,t});
  }
}
function e6_tick(dt){
  const {R}=e6_compute();
  const V=6;
  const I=V/R;
  const speed=clamp(I*0.35,0.015,0.5);
  const {x0,x1,y0,y1}=e6;
  updateLoopParticles(e6.parts,dt,speed,1,x0,x1,y0,y1);
  if(e6.bulb){
    const glow=clamp(I*0.25,0.05,3);
    e6.bulb.userData.glass.material.emissiveIntensity=glow;
    e6.bulb.userData.filament.material.emissiveIntensity=1+glow;
    e6.bulb.rotation.y+=dt*0.4;
  }
}
function e6_hud(){
  const {l,d,matKey,rho,A,R}=e6_compute();
  if(e6.challengeActive){
    return [{l:'Length l',v:fmt(l,2)+' m',c:'#ffc857'},{l:'Diameter d',v:fmt(d,2)+' mm',c:'#5bc8ff'},{l:'Material',v:'? (identify or calculate)',c:'#ff5e72'}];
  }
  return [
    {l:'Material',v:MATERIALS[matKey].name,c:'#ffc857'},
    {l:'Length l',v:fmt(l,2)+' m',c:'#5bc8ff'},
    {l:'Diameter d',v:fmt(d,2)+' mm',c:'#5bc8ff'},
    {l:'Area A = πr²',v:fmtSci(A,2)+' m²',c:'#b57aff'},
    {l:'Resistivity ρ',v:fmtSci(rho,2)+' Ωm',c:'#b57aff'},
    {l:'Resistance R = ρl/A',v:fmt(R,3)+' Ω',c:'#4dffa0'}

}

const LAB3_DIMS={l:1.5,d:0.2};
const e8={x0:-2.6,x1:2.6,y0:-1.4,y1:1.4,parts:null,wireMesh:null,bulb:null,records:[]};
function e8_material(){ return el('e8-mat')?.value||'nichrome'; }
function e8_V(){ return parseFloat(el('e8-V')?.value||6); }
function e8_calc(matKey,V){
  const rho=MATERIALS[matKey].rho;
  const l=LAB3_DIMS.l, d=LAB3_DIMS.d;
  const A=Math.PI*Math.pow((d/1000)/2,2);
  const R=rho*l/A;
  const I=V/R;
  return {rho,l,d,A,R,I};
}
function e8_build(){
  clearStage();
  const {x0,x1,y0,y1}=e8;
  stage.add(wireSegment(x1,y1,x1,y0,0x5a6a90));
  stage.add(wireSegment(x1,y0,x0,y0,0x5a6a90));
  stage.add(wireSegment(x0,y0,x0,y1,0x5a6a90));
  stage.add(batteryMesh(x0,0));
  const bulb=bulbMesh(x1,0); stage.add(bulb); e8.bulb=bulb;
  const matKey=e8_material();
  const visRad=0.16;
  const color=MATERIALS[matKey].color;
  const topLen=x1-x0;
  const wireMesh=new THREE.Mesh(new THREE.CylinderGeometry(visRad,visRad,topLen,20), mat(color,{metalness:0.55,roughness:0.4}));
  wireMesh.rotation.z=Math.PI/2; wireMesh.position.set((x0+x1)/2,y1,0);
  stage.add(wireMesh); e8.wireMesh=wireMesh;
  const lbl=makeTextSprite(MATERIALS[matKey].name+' sample (l='+LAB3_DIMS.l+'m, d='+LAB3_DIMS.d+'mm)',{color:'#ffffff',height:0.26});
  lbl.position.set((x0+x1)/2, y1+visRad+0.4, 0); stage.add(lbl);
  e8.parts=makeLoopParticles(14,0xbcefff,x0,x1,y0,y1);
  e8_renderTable();
}
function e8_tick(dt){
  const matKey=e8_material(), V=e8_V();
  const {I}=e8_calc(matKey,V);
  updateLoopParticles(e8.parts,dt,clamp(I*0.3,0.015,0.5),1,e8.x0,e8.x1,e8.y0,e8.y1);
  if(e8.bulb){
    const glow=clamp(I*0.25,0.05,3);
    e8.bulb.userData.glass.material.emissiveIntensity=glow;
    e8.bulb.userData.filament.material.emissiveIntensity=1+glow;
    e8.bulb.rotation.y+=dt*0.4;
  }
}
function e8_hud(){
  const matKey=e8_material(), V=e8_V();
  const {rho,l,d,A,R,I}=e8_calc(matKey,V);
  return [
    {l:'Material',v:MATERIALS[matKey].name,c:'#ffc857'},
    {l:'Length l',v:l+' m',c:'#5bc8ff'},
    {l:'Diameter d',v:d+' mm',c:'#5bc8ff'},
    {l:'Voltage V',v:fmt(V,1)+' V',c:'#ffc857'},
    {l:'Current I',v:fmt(I,3)+' A',c:'#4dffa0'}
  ];
}
function e8_record(){
  const matKey=e8_material(), V=e8_V();
  const {rho,l,d,A}=e8_calc(matKey,V);
  const {I}=e8_calc(matKey,V);
  const noise=1+(Math.random()-0.5)*0.06;
  const Imeas=I*noise;
  const Rmeas=V/Imeas;
  const rhoMeas=Rmeas*A/l;
  const pctDiff=Math.abs(rhoMeas-rho)/rho*100;
  e8.records=(e8.records||[]).filter(r=>r.matKey!==matKey);
  e8.records.push({matKey,l,d,V,I:Imeas,R:Rmeas,rho:rhoMeas,rhoTrue:rho,pctDiff});
  e8_renderTable();
}
function e8_renderTable(){
  const rows=(e8.records||[]).map(r=>[MATERIALS[r.matKey].name, fmt(r.l,1), fmt(r.d,1), fmt(r.V,1), fmt(r.I,3), fmt(r.R,2), fmtSci(r.rho,2), fmt(r.pctDiff,1)+'%']);
  renderLabTable(['Material','l (m)','d (mm)','V (V)','I (A)','R (Ω)','ρ calc (Ωm)','% diff'], rows);
  const summaryEl=el('lab-summary');
  if((e8.records||[]).length>=2){
    summaryEl.innerHTML='Compare your calculated ρ values with the accepted values: Copper 1.68×10⁻⁸, Aluminium 2.65×10⁻⁸, Iron 9.71×10⁻⁸, Nichrome 1.10×10⁻⁶ Ωm. Small % differences come from simulated experimental error.';
  } else {
    summaryEl.innerHTML='Select a material and press Record. Then switch materials and repeat to compare resistivities.';
  }
}
function e8_clear(){ e8.records=[]; e8_renderTable(); }

/* ===== UI WIRING ===== */
let currentIdx=0, challengeMode=false, score={correct:0,total:0};

function buildTabs(){
  const wrap=el('tabs'); wrap.innerHTML='';
  scenes.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='tab-btn'+(i===currentIdx?' active':'');
    b.textContent=s.tab;
    b.onclick=()=>loadScene(i);
    wrap.appendChild(b);
  });
}
function renderHUD(){
  const rows=scenes[currentIdx].hud();
  el('hud-rows').innerHTML=rows.map(r=>'<div class="dr"><span class="dl">'+r.l+'</span><span class="dv" style="color:'+(r.c||'#ddeeff')+'">'+r.v+'</span></div>').join('');
}
function loadScene(i){
  if(scenes[currentIdx] && scenes[currentIdx].onLeave) scenes[currentIdx].onLeave();
  currentIdx=i;
  clearStage();
  const s=scenes[i];
  s.build();
  el('scene-controls').innerHTML=s.controlsHTML;
  showGraphPanel(!!s.showGraph, !!s.graphTable, !!s.hideGraphCanvas);
  if(s.wire) s.wire();
  el('caption-kpi').textContent=s.kpi;
  el('caption-title').textContent=s.title;
  el('caption-text').innerHTML=s.blurb;
  el('caption').style.display='';
  el('caption').classList.remove('collapsed');
  el('btn-caption-fold').textContent='▼';
  buildTabs();
  renderHUD();
  challengeMode=false;
  score={correct:0,total:0};
  el('chal-score').textContent='Score: 0/0';
  el('btn-challenge-toggle').classList.remove('on');
  updateChallengeAvailability();
}
function isCustomChallengeIdx(i){ return i===0 || i===3 || i===5; }
function updateChallengeAvailability(){

  } else {
    el('btn-chal-check').style.display='';
    el('chal-body').innerHTML='';
  }
}
function showChalResult(res){
  score.total++; if(res.correct) score.correct++;
  el('chal-score').textContent='Score: '+score.correct+'/'+score.total;
  const box=el('chal-result');
  box.textContent=res.message;
  box.style.display='';
  box.className=res.correct? 'pass':'fail';
}

el('btn-chal-check').onclick=()=>{
  if(currentIdx===0){ showChalResult(e1_checkChallenge()); return; }
  if(currentIdx===3){ showChalResult(e4_checkChallenge()); return; }
  if(currentIdx===5){ showChalResult(e6_checkChallenge()); return; }
  const c=scenes[currentIdx].challenge; if(!c) return; showChalResult(c.check());
};
el('btn-chal-new').onclick=newChallenge;
el('btn-chal-exit').onclick=()=>{
  challengeMode=false;
  el('btn-challenge-toggle').classList.remove('on');
  el('challenge-wrap').classList.remove('show','s5-pos');
  if(currentIdx===0) e1_exitChallenge();
  if(currentIdx===3) e4_exitChallenge();
  if(currentIdx===5) e6_exitChallenge();
};
el('btn-challenge-toggle').onclick=()=>{
  challengeMode=!challengeMode;
  el('btn-challenge-toggle').classList.toggle('on', challengeMode);
  el('challenge-wrap').classList.toggle('show', challengeMode);
  if(challengeMode) newChallenge();
  else {
    if(currentIdx===0) e1_exitChallenge();
    if(currentIdx===3) e4_exitChallenge();
    if(currentIdx===5) e6_exitChallenge();
  }
};
el('btn-reset-scene').onclick=()=>loadScene(currentIdx);

/* MAIN LOOP */
let lastRender=0;
function animate(ts){
  requestAnimationFrame(animate);
  if(ts-lastRender<33) return; lastRender=ts;
  scenes[currentIdx].tick(0.033);
  renderHUD();
  renderer.render(scene3, cam3);
}
loadScene(0);
animate();

  {kpi:'3.1.1', q:'The formula for electric current in terms of charge is...', opts:['I = Q/t','I = Qt','I = t/Q','I = Q + t'], correct:0, exp:'Current is the rate of flow of charge: I = Q/t (also I = ne/t).'},
  {kpi:'3.1.2', q:'Conventional current in a circuit flows in the direction that...', opts:['positive charges would move','electrons actually move','neither charge moves','only occurs in AC circuits'], correct:0, exp:'Conventional current is defined as the direction positive charge carriers would flow.'},
  {kpi:'3.1.2', q:'In the external circuit, conventional current flows from the battery\'s...', opts:['positive terminal to the negative terminal','negative terminal to the positive terminal','positive terminal back to itself','neutral point outward'], correct:0, exp:'Conventional current flows from + through the external circuit to −.'},
  {kpi:'3.1.3', q:'Which instrument is always connected in series in a circuit?', opts:['Ammeter','Voltmeter','Both are always in parallel','Neither'], correct:0, exp:'An ammeter must carry the same current as the component, so it is wired in series.'},
  {kpi:'3.1.3', q:'A voltmeter is connected...', opts:['In parallel across the component','In series with the component','Nowhere near the component','Only inside the battery'], correct:0, exp:'Voltmeters measure potential difference, so they are connected in parallel.'},
  {kpi:'3.1.4', q:'Resistance is best described as...', opts:['Opposition to the flow of current','A measure of voltage supplied','The rate of charge flow','A type of energy'], correct:0, exp:'Resistance is the opposition a conductor offers to the flow of current, measured in ohms.'},
  {kpi:'3.1.5', q:'Ohm\'s law states that, at constant temperature...', opts:['V is directly proportional to I','V is inversely proportional to I','R is proportional to V only','I is independent of V'], correct:0, exp:'Ohm\'s law: the current through a conductor is directly proportional to the potential difference across it.'},
  {kpi:'3.1.5', q:'Ohm\'s law is expressed mathematically as...', opts:['ΔV = IR','ΔV = I/R','ΔV = I + R','ΔV = R/I'], correct:0, exp:'Rearranged, this also gives R = ΔV/I.'},
  {kpi:'3.1.6', q:'A material with constant resistance over a wide range of voltages is described as...', opts:['Ohmic','Non-ohmic','Magnetic','Insulating only'], correct:0, exp:'Ohmic materials obey Ohm\'s law and give a straight-line I–V graph.'},
  {kpi:'3.1.6', q:'A filament lamp is an example of a(n)...material.', opts:['Non-ohmic','Ohmic','Superconducting','Zero-resistance'], correct:0, exp:'Its resistance rises with temperature, giving a curved (nonlinear) I–V graph.'},
  {kpi:'3.1.7', q:'The resistance of a cylindrical wire is directly proportional to its...', opts:['Length','Cross-sectional area','Colour','Weight'], correct:0, exp:'A longer wire means a longer path for charge carriers, so resistance increases with length.'},
  {kpi:'3.1.7', q:'The resistance of a wire is inversely proportional to its...', opts:['Cross-sectional area','Length','Resistivity','Supply voltage'], correct:0, exp:'A thicker wire (larger cross-sectional area) offers less resistance.'},
  {kpi:'3.1.8', q:'Resistivity is defined as the resistance of a conductor of...', opts:['Length 1 m and cross-sectional area 1 m²','Any length and any area','Length 1 cm only','Zero length'], correct:0, exp:'Resistivity (ρ) is a material property defined for a 1 m length with a 1 m² cross-section, measured in Ωm.'},
  {kpi:'3.1.9', q:'The equation used to calculate resistance from resistivity is...', opts:['R = ρl/A','R = ρA/l','R = A/(ρl)','R = l/(ρA)'], correct:0, exp:'R = ρl/A — resistance increases with length and resistivity, and decreases with area.'},
  {kpi:'Lab 2', q:'In an experiment to verify Ohm\'s law, a graph of voltage (y-axis) against current (x-axis) for an ohmic resistor should be...', opts:['A straight line through the origin','A curve bending upward','A horizontal line','A straight line not through the origin'], correct:0, exp:'For an ohmic conductor, V ∝ I, so the graph is a straight line through the origin with gradient R.'}
];
let quizIdx=0, quizScore=0, quizAnswered=false;
function openQuiz(){ quizIdx=0; quizScore=0; el('quiz-modal').classList.add('show'); el('quiz-live').style.display=''; el('quiz-final').style.display='none'; showQuizQuestion(); }
function showQuizQuestion(){
  quizAnswered=false;
  const item=QUIZ[quizIdx];
  el('quiz-progress').textContent='Question '+(quizIdx+1)+'/'+QUIZ.length;
  el('quiz-kpi').textContent='KPI '+item.kpi;
  el('quiz-question').textContent=item.q;
  el('quiz-explain').style.display='none';
  el('quiz-next').style.display='none';
  el('quiz-options').innerHTML=item.opts.map((o,i)=>'<button class="quiz-opt" data-idx="'+i+'">'+o+'</button>').join('');
  Array.from(el('quiz-options').children).forEach(btn=>{
    btn.onclick=()=>{
      if(quizAnswered) return; quizAnswered=true;
      const idx=parseInt(btn.dataset.idx);
      if(idx===item.correct) quizScore++;
      Array.from(el('quiz-options').children).forEach((b,i)=>{
        if(i===item.correct) b.classList.add('correct');
        else if(i===idx) b.classList.add('wrong');
      });
      el('quiz-explain').textContent=item.exp;
      el('quiz-explain').style.display='block';
      el('quiz-next').style.display='inline-block';
      el('quiz-next').textContent=(quizIdx<QUIZ.length-1)? 'Next →' : 'See results →';
    };
  });
}
el('quiz-next').onclick=()=>{ quizIdx++; if(quizIdx>=QUIZ.length) showQuizFinal(); else showQuizQuestion(); };
function showQuizFinal(){
  el('quiz-live').style.display='none'; el('quiz-final').style.display='block';
  el('quiz-final-score').textContent=quizScore+'/'+QUIZ.length;
  const pct=quizScore/QUIZ.length;
  el('quiz-final-msg').textContent=pct>=0.8?'Outstanding grasp of circuits! 🎉':(pct>=0.5?'Good job! Review the modules and try again.':'Keep practicing current & resistance concepts!');
}
el('quiz-restart').onclick=openQuiz;
el('quiz-btn').onclick=openQuiz;
el('quiz-close').onclick=()=>{ el('quiz-modal').classList.remove('show'); };
el('quiz-modal').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('show'); });
</script>
