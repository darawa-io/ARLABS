<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Capacitance Lab | PHY51</title>
<link rel="icon" type="image/png" href="assets/logo1.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');
:root{--bg:#07090f;--border:rgba(180,200,255,.10);--amber:#ffc857;--blue:#5bc8ff;--violet:#b57aff;--green:#4dffa0;--red:#ff5e72;--text:#ddeeff;--muted:rgba(180,210,255,.45)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'DM Sans',sans-serif;font-weight:300;overflow:hidden;height:100vh;width:100vw;color:var(--text);touch-action:none;-webkit-tap-highlight-color:transparent}
#mainCanvas{position:absolute;inset:0;z-index:1;touch-action:none}
#labelCanvas{position:absolute;inset:0;pointer-events:none;z-index:3}
#title{position:absolute;top:16px;left:16px;z-index:5}
#title h1{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:#fff;letter-spacing:.4px}
#title p{font-size:9px;color:rgba(180,200,255,.4);letter-spacing:1.6px;text-transform:uppercase;margin-top:2px;font-family:'Space Mono',monospace}
#tabbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(10,14,28,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:5px;z-index:10;max-width:calc(100vw - 200px);overflow-x:auto}
#tabbar::-webkit-scrollbar{height:0}
.tab-btn{padding:8px 11px;border-radius:9px;border:none;background:transparent;color:var(--muted);font-family:'Space Mono',monospace;font-size:9.5px;white-space:nowrap;cursor:pointer;transition:all .18s}
.tab-btn:hover{color:#fff}.tab-btn.on{background:rgba(91,200,255,.2);color:#fff}
.panel{background:rgba(10,14,28,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:15px;z-index:10}
.panel>h2,#v2head{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2.5px;color:rgba(180,200,255,.45);text-transform:uppercase;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;user-select:none}
.panel>h2::after{content:'\25BE'}.folded>h2::after{content:'\25B8'}.folded>*:not(h2){display:none!important}.folded>h2{margin:0;border:0;padding:0}
#rightCol{position:absolute;top:70px;right:14px;width:230px;z-index:10;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 150px);overflow-y:auto}
#view2d{display:none}#view2d.show{display:block}
#v2head{cursor:default;margin-bottom:6px}
#v2canvas{display:block;width:100%;height:190px}
.dr{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:5px 8px;border-radius:8px;background:rgba(180,200,255,.04);gap:6px}
.dl{font-family:'Space Mono',monospace;font-size:10px;color:rgba(180,210,255,.6)}
.dv{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;text-align:right}
.dv.amber{color:var(--amber)}.dv.blue{color:var(--blue)}.dv.violet{color:var(--violet)}.dv.green{color:var(--green)}
.hdiv{height:1px;background:var(--border);margin:9px 0}
#legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-family:'Space Mono',monospace;font-size:9px}
.legchip{display:flex;align-items:center;gap:4px;color:rgba(200,215,255,.65)}
.legdot{width:8px;height:8px;border-radius:50%}
.note-box{padding:8px 9px;border-radius:9px;background:rgba(180,120,255,.06);border:1px solid rgba(180,120,255,.18);font-size:10px;font-family:'Space Mono',monospace;color:rgba(210,220,255,.8);line-height:1.7}
#infoPanel{position:absolute;top:70px;left:14px;width:270px;max-width:calc(100vw - 320px);max-height:calc(100vh - 160px);overflow-y:auto}
#info h3{font-family:'Syne',sans-serif;font-size:13.5px;font-weight:700;color:#fff;margin-bottom:8px}
#info p{font-size:11.5px;line-height:1.65;color:rgba(210,222,250,.82);margin-bottom:8px}
#info b{color:#fff}.pos{color:var(--red);font-weight:700}.neg{color:var(--violet);font-weight:700}
.step-tag{display:inline-block;font-family:'Space Mono',monospace;font-size:9px;color:var(--green);background:rgba(77,255,160,.08);border:1px solid rgba(77,255,160,.25);border-radius:6px;padding:2px 7px;letter-spacing:.5px}
#controls{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;background:rgba(10,14,28,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:40px;padding:8px 14px;z-index:10;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
#ctrlbody{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{padding:7px 14px;border-radius:26px;border:1px solid rgba(180,200,255,.25);background:rgba(180,200,255,.06);color:var(--blue);font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap;outline:none}
.btn:hover{background:rgba(180,200,255,.14)}.btn.on{background:rgba(91,200,255,.2);border-color:var(--blue);color:#fff}
.btn.green{border-color:rgba(77,255,160,.4);color:var(--green);background:rgba(77,255,160,.06)}
.btn.amber{border-color:rgba(255,200,87,.4);color:var(--amber);background:rgba(255,200,87,.06)}
.sep{width:1px;height:20px;background:var(--border)}
.sw{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10.5px;font-family:'Space Mono',monospace;white-space:nowrap}
input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:rgba(180,200,255,.15);outline:none;cursor:pointer;width:90px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--violet);box-shadow:0 0 8px rgba(181,122,255,.6)}
#hint{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);font-size:8.5px;color:rgba(180,200,255,.25);letter-spacing:1px;pointer-events:none;font-family:'Space Mono',monospace;z-index:10;white-space:nowrap}
#quiz{position:fixed;inset:70px 0 0 0;z-index:9;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;touch-action:pan-y;padding:16px;background:rgba(7,9,15,.88)}
#quiz-box{background:rgba(13,17,32,.97);border:1px solid var(--border);border-radius:16px;padding:22px;max-width:660px;width:100%}
.qz-meta{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--amber);margin-bottom:8px;display:flex;justify-content:space-between}
.qz-bar{height:4px;border-radius:3px;background:rgba(180,200,255,.1);margin-bottom:16px;overflow:hidden}
.qz-bar i{display:block;height:100%;background:var(--blue)}
.qz-q{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:#fff;margin-bottom:14px;line-height:1.4}
.qz-opt{display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;border-radius:11px;border:1px solid rgba(180,200,255,.2);background:rgba(180,200,255,.05);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}
.qz-opt:hover:not(:disabled){background:rgba(91,200,255,.14)}
.qz-opt.ok{border-color:var(--green);background:rgba(77,255,160,.14)}.qz-opt.bad{border-color:var(--red);background:rgba(255,94,114,.14)}
.qz-exp{margin:10px 0;padding:10px 12px;border-radius:10px;background:rgba(255,200,87,.07);border:1px solid rgba(255,200,87,.25);font-size:12px;line-height:1.6;color:rgba(230,236,255,.9)}
.qz-score{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;color:#fff;margin:6px 0}
@media (max-width:820px){#infoPanel{display:none}#rightCol{top:100px;width:190px;max-height:calc(100vh - 190px)}#tabbar{max-width:calc(100vw - 20px);top:60px;left:14px;transform:none}#quiz{inset:100px 0 0 0}}
#view2d.big{position:fixed;left:10vw;top:10vh;width:80vw;height:80vh;z-index:30;display:flex;flex-direction:column;box-shadow:0 0 0 100vmax rgba(4,6,18,.55)}
#view2d.big #v2canvas{flex:1;height:auto;min-height:0}
body.gbig #rightCol{z-index:40}
#v2head{flex-wrap:wrap;font-size:9px;letter-spacing:1.5px;gap:6px;align-items:center}
#v2btns{display:flex;gap:4px;letter-spacing:0}
.v2b{background:none;border:1px solid var(--border);color:var(--blue);border-radius:7px;cursor:pointer;font-size:11px;padding:2px 7px;font-family:'DM Sans',sans-serif}
.v2b.on{background:rgba(255,200,87,.2);border-color:var(--amber);color:var(--amber)}.v2b:disabled{opacity:.35;cursor:not-allowed}
#v2-restore{display:none}#view2d.big #v2-restore{display:inline-block}#view2d.big #v2-expand{display:none}
#v2canvas{touch-action:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
#chal{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);z-index:15;display:none;width:min(620px,calc(100vw - 24px))}
#chal.show{display:block}
#chal-bar{background:rgba(10,14,28,.97);backdrop-filter:blur(22px);border:1px solid rgba(255,200,87,.4);border-radius:18px;padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#chal-head{display:flex;justify-content:space-between;margin-bottom:8px;border-bottom:1px solid rgba(255,200,87,.2);padding-bottom:6px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--amber);text-transform:uppercase;font-weight:700}
#chal-score{color:var(--green);letter-spacing:0;font-size:10.5px}
#chal-prompt{font-size:12px;line-height:1.5;margin-bottom:10px;color:var(--text)}#chal-prompt b{color:#fff}
#chal-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#chal-row label,#chal-unit{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)}
.chal-input{background:rgba(180,200,255,.08);border:1px solid rgba(180,200,255,.3);color:var(--text);border-radius:8px;padding:6px 10px;font-family:'Space Mono',monospace;font-size:12px;outline:none;width:130px}
.chal-input:focus{border-color:var(--blue)}.chal-input:disabled{opacity:.45;cursor:not-allowed}
#chal-result{display:none;font-size:11.5px;line-height:1.55;margin-top:8px;padding:8px 12px;border-radius:10px}
#chal-result.pass{display:block;background:rgba(77,255,160,.12);color:var(--green);border:1px solid rgba(77,255,160,.35)}
#chal-result.fail{display:block;background:rgba(255,94,114,.12);color:var(--red);border:1px solid rgba(255,94,114,.35)}
#chal-result.warn{display:block;background:rgba(255,200,87,.1);color:var(--amber);border:1px solid rgba(255,200,87,.35)}
#chal-actions{display:flex;gap:8px;margin-top:8px}

#title{display:flex;align-items:center;gap:10px}
#title-logo{width:34px;height:37px;flex-shrink:0;opacity:.82}
/* Calculator + QR buttons */
#qr-btn{position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:11px;border:1px solid rgba(120,180,255,.25);background:rgba(6,8,20,.92);backdrop-filter:blur(14px);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;transition:all .2s;color:rgba(120,180,255,.7)}
#qr-btn:hover{border-color:rgba(120,180,255,.55);background:rgba(120,180,255,.14);color:#78b4ff}
#qr-btn svg{width:20px;height:20px}
#qr-modal{display:none;position:fixed;inset:0;z-index:300;background:rgba(4,8,20,.78);backdrop-filter:blur(10px);align-items:center;justify-content:center}
#qr-modal.show{display:flex}
#qr-modal-box{background:rgba(6,10,22,.97);border:1px solid rgba(120,180,255,.3);border-radius:20px;padding:26px 24px 22px;text-align:center;position:relative;max-width:270px;width:90%}
#qr-modal-box h3{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;color:rgba(120,180,255,.5);text-transform:uppercase;margin-bottom:14px}
#qr-modal-box img{width:168px;height:168px;border-radius:10px;border:2px solid rgba(120,180,255,.2);display:block;margin:0 auto 14px}
#qr-modal-box p{font-family:'Space Mono',monospace;font-size:8px;color:rgba(120,180,255,.38);letter-spacing:1px;word-break:break-all;line-height:1.7}
#qr-modal-close{position:absolute;top:10px;right:13px;background:none;border:none;color:rgba(160,200,255,.38);font-size:17px;cursor:pointer;line-height:1;transition:color .2s;padding:2px 4px}
#qr-modal-close:hover{color:#78b4ff}
#calc-btn{position:fixed;bottom:68px;right:20px;width:40px;height:40px;border-radius:11px;border:1px solid rgba(255,200,87,.3);background:rgba(6,8,20,.92);backdrop-filter:blur(14px);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;transition:all .2s;color:rgba(255,200,87,.7)}
#calc-btn:hover,#calc-btn.on{border-color:rgba(255,200,87,.7);background:rgba(255,200,87,.14);color:var(--amber)}
#calc-btn svg{width:20px;height:20px}
#calc-panel{position:fixed;z-index:1100;right:16px;bottom:116px;width:min(380px,calc(100vw - 20px));height:min(620px,calc(100vh - 140px));display:none;flex-direction:column;background:rgba(10,14,28,.97);border:1px solid rgba(255,200,87,.35);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.6);overflow:hidden}
#calc-panel.show{display:flex}
#calc-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:grab;touch-action:none;user-select:none;border-bottom:1px solid var(--border);background:rgba(255,200,87,.06)}
#calc-head:active{cursor:grabbing}
#calc-head h2{font:700 10px 'Space Mono';letter-spacing:1.5px;color:var(--amber)}
#calc-close{border:1px solid var(--border);background:rgba(180,200,255,.08);color:var(--muted);font-size:13px;width:26px;height:26px;border-radius:7px;cursor:pointer}
#calc-close:hover{color:#fff;background:rgba(180,200,255,.18)}
#calc-frame{flex:1;width:100%;border:0;background:#07090f;min-height:0}
#calc-panel.drag #calc-frame{pointer-events:none}
@media(max-width:1040px){#calc-btn{right:10px;bottom:calc(62px + env(safe-area-inset-bottom,0px))}#qr-btn{right:10px}}
@media(max-width:600px){#calc-panel{left:10px;right:10px;width:auto;bottom:calc(110px + env(safe-area-inset-bottom,0px));height:min(600px,calc(100vh - 150px))}}
/* Quiz levels */
.qz-level{display:inline-block;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:1px solid;border-radius:8px;padding:2px 7px;margin-right:8px}
.qz-break{display:flex;flex-direction:column;gap:8px;margin:0 0 16px;max-width:320px}
.qb-row{display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:11px}
.qb-name{width:66px}
.qb-bar{flex:1;height:6px;border-radius:3px;background:rgba(180,200,255,.12);overflow:hidden}
.qb-bar i{display:block;height:100%;border-radius:3px}
.qb-val{width:38px;text-align:right;color:var(--text)}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('mainCanvas'),lc=$('labelCanvas'),lctx=lc.getContext('2d'),DPR=Math.min(devicePixelRatio||1,2);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x07090f,.018);
const cam=new THREE.PerspectiveCamera(50,1,.1,200);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();lc.width=w;lc.height=h}
addEventListener('resize',resize);resize();
scene.add(new THREE.AmbientLight(0xffffff,2.2));
const sun=new THREE.DirectionalLight(0xfff8f0,1.1);sun.position.set(5,10,6);scene.add(sun);
const rim=new THREE.DirectionalLight(0x6688ff,.5);rim.position.set(-6,4,-4);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x0d1020,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.6;scene.add(floor);
const grid=new THREE.GridHelper(40,30,0x1a2540,0x121c30);grid.position.y=-2.58;scene.add(grid);

/* ---------- orbit ---------- */
const orb={theta:.35,phi:.16,radius:12,cx:0,cy:-.2,cz:0};
function applyOrbit(){orb.phi=Math.max(-.6,Math.min(.95,orb.phi));orb.radius=Math.max(4,Math.min(30,orb.radius));const r=orb.radius,p=orb.phi,t=orb.theta;cam.position.set(orb.cx+r*Math.cos(p)*Math.sin(t),orb.cy+r*Math.sin(p),orb.cz+r*Math.cos(p)*Math.cos(t));cam.lookAt(orb.cx,orb.cy,orb.cz)}
const ptrs=new Map();let pd=0,pr=0;
const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){pd=pdist();pr=orb.radius}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;if(ptrs.size===1){orb.theta-=(e.clientX-p.x)*.005;orb.phi+=(e.clientY-p.y)*.005}p.x=e.clientX;p.y=e.clientY;if(ptrs.size===2&&pd>0)orb.radius=pr*pd/pdist();applyOrbit()});
const pup=e=>ptrs.delete(e.pointerId);canvas.addEventListener('pointerup',pup);canvas.addEventListener('pointercancel',pup);
canvas.addEventListener('wheel',e=>{orb.radius+=e.deltaY*.01;applyOrbit();e.preventDefault()},{passive:false});
applyOrbit();

/* ---------- capacitor model (3D) ---------- */
const cap=new THREE.Group();cap.position.y=.4;scene.add(cap);
const plateMat=c=>new THREE.MeshStandardMaterial({color:0x56637f,metalness:.6,roughness:.35,emissive:c,emissiveIntensity:0});
const pL=new THREE.Mesh(new THREE.BoxGeometry(.1,1,1),plateMat(0xff5e72)),pR=new THREE.Mesh(new THREE.BoxGeometry(.1,1,1),plateMat(0xb57aff));cap.add(pL,pR);
const dotG=new THREE.SphereGeometry(.07,10,10),mRed=new THREE.MeshBasicMaterial({color:0xff5e72}),mVio=new THREE.MeshBasicMaterial({color:0xb57aff});
const dL=[],dR=[];for(let i=0;i<36;i++){const a=new THREE.Mesh(dotG,mRed),b=new THREE.Mesh(dotG,mVio);cap.add(a,b);dL.push(a);dR.push(b)}
const arrows=[];for(let i=0;i<25;i++){const a=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),1,0xffc857);a.line.material.transparent=a.cone.material.transparent=true;cap.add(a);arrows.push(a)}
function setCap(s,g,n,op,tilt){
  const x=g/2+.05;pL.scale.set(1,s,s);pR.scale.set(1,s,s);pL.position.x=-x;pR.position.x=x;
  for(let i=0;i<36;i++){const c=(i*7)%36,y=((c%6)-2.5)/2.5*.42*s,z=(((c/6)|0)-2.5)/2.5*.42*s;dL[i].position.set(-g/2+.03,y,z);dR[i].position.set(g/2-.03,y,z);dL[i].visible=dR[i].visible=i<n}
  pL.material.emissiveIntensity=pR.material.emissiveIntensity=.45*op;
  const len=Math.max(.15,g-.16);
  arrows.forEach((a,i)=>{const ai=i%5,ak=(i/5)|0,ey=(ai===0||ai===4)?(ai-2)/2*tilt:0,ez=(ak===0||ak===4)?(ak-2)/2*tilt:0;
    a.position.set(-g/2+.08,(ai-2)/2*.42*s,(ak-2)/2*.42*s);a.setDirection(new THREE.Vector3(1,ey,ez).normalize());a.setLength(len,Math.min(.22,len*.4),.1);
    a.visible=op>.02;a.line.material.opacity=a.cone.material.opacity=.2+.8*op});
}
/* wire, battery, lamp, flowing electrons */
const wire=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x8fa2c0}));cap.add(wire);
const batMat=new THREE.MeshStandardMaterial({color:0x2a3550,emissive:0xffc857,emissiveIntensity:0});
const bat=new THREE.Group();bat.position.set(-1.4,-2.4,0);bat.add(new THREE.Mesh(new THREE.BoxGeometry(1.1,.6,.5),batMat));
const tp=new THREE.Mesh(new THREE.BoxGeometry(.14,.3,.3),new THREE.MeshStandardMaterial({color:0xff5e72,emissive:0xff5e72,emissiveIntensity:.5}));tp.position.x=-.62;
const tn=new THREE.Mesh(new THREE.BoxGeometry(.14,.3,.3),new THREE.MeshStandardMaterial({color:0xb57aff,emissive:0xb57aff,emissiveIntensity:.5}));tn.position.x=.62;bat.add(tp,tn);cap.add(bat);
const bulbMat=new THREE.MeshStandardMaterial({color:0x445566,emissive:0xffc857,emissiveIntensity:0});
const bulb=new THREE.Group();bulb.position.set(1.4,-2.4,0);bulb.add(new THREE.Mesh(new THREE.SphereGeometry(.38,20,20),bulbMat));
const bl=new THREE.PointLight(0xffc857,0,8);bulb.add(bl);cap.add(bulb);
const flow=[];for(let i=0;i<16;i++){const m=new THREE.Mesh(dotG,mVio);m.scale.setScalar(1.2);cap.add(m);flow.push(m)}
let flowU=0;
function updateWire(s,g,showFlow,speed,dt){
  const x=g/2+.05,pts=[new THREE.Vector3(-x,-s/2,0),new THREE.Vector3(-2.8,-2.4,0),new THREE.Vector3(2.8,-2.4,0),new THREE.Vector3(x,-s/2,0)];
  wire.geometry.setFromPoints(pts);
  const ln=[],tot=pts.slice(1).reduce((a,p,i)=>{const l=p.distanceTo(pts[i]);ln.push(l);return a+l},0);
  flowU=(flowU+speed*dt+1)%1;
  flow.forEach((m,i)=>{m.visible=showFlow;if(!showFlow)return;let d=((i/flow.length+flowU)%1)*tot,k=0;while(k<ln.length-1&&d>ln[k]){d-=ln[k];k++}m.position.lerpVectors(pts[k],pts[k+1],d/ln[k])});
}

/* ---------- state & physics ---------- */
const EPS0=8.85e-12,HID=[2.2e-6,4.7e-6,8.2e-6],HN=['X','Y','Z'];
const RES=1e5;
const S={mod:'store',C:5e-6,Vs:9,Vc:0,mode:'idle',Vset:6,side:10,dmm:5,hid:0,recs:[],reveal:false,fit:false,Edel:0,I:0,t:0,lastI:0,hist:[],chal:false,locked:false,cq:null,hidC:3e-6,nz:[],tool:{on:false,h1:{v:3,q:20},h2:{v:9,q:70},drag:null},score:{calc:[0,0],graph:[0,0]},gm:null};
function eng(x,u){if(!x)return '0 '+u;const P=[[1e-12,'p'],[1e-9,'n'],[1e-6,'µ'],[1e-3,'m'],[1,'']];let a=Math.abs(x),p=P[0];for(const q of P)if(a>=q[0]*.9995)p=q;return (+(x/p[0]).toPrecision(3))+' '+p[1]+u}
const fitC=()=>{let a=0,b=0;S.recs.forEach(r=>{a+=r.v*r.q;b+=r.v*r.v});return b?a/b:0};
const layout=()=>S.mod==='geo'?{s:S.side*.2,g:.2+S.dmm*.16}:{s:3,g:1.6};
const engine=()=>S.mod==='store'||S.mod==='energy';
function physics(dt){
  const old=S.Vc,U0=.5*S.C*old*old;
  if(engine()){
    const tau=RES*S.C;
    if(S.mode==='charge'){S.Vc+=(S.Vs-S.Vc)*(1-Math.exp(-dt/tau));if(Math.abs(S.Vs-S.Vc)<.003)S.Vc=S.Vs;S.I=(S.Vs-S.Vc)/RES}
    else if(S.mode==='disc'){S.Vc*=Math.exp(-dt/tau);if(S.Vc<.003)S.Vc=0;S.I=-S.Vc/RES;S.Edel+=Math.max(0,U0-.5*S.C*S.Vc*S.Vc)}
    else S.I=0;
    if(S.I!==0||S.lastI!==0){S.t+=dt;S.hist.push({t:S.t,i:S.I});if(S.hist.length>3000)S.hist.shift()}
    S.lastI=S.I;
  }else{
    S.I=0;
    if(S.mod==='calc')S.Vc=S.Vset;
    else if(S.mod==='graph'){S.C=S.chal?S.hidC:HID[S.hid];S.Vc=S.Vset}
    else if(S.mod==='geo'){S.C=EPS0*Math.pow(S.side/100,2)/(S.dmm/1000);S.Vc=12}
  }
}
const QREF={store:60e-6,calc:120e-6,graph:100e-6,geo:4.3e-9,energy:120e-6};

/* ---------- module definitions ---------- */
const sl=(k,lab,min,max,step,u)=>`<span class="sw">${lab}<input type="range" data-s="${k}" data-u="${u}" min="${min}" max="${max}" step="${step}" value="${S[k]}"><span id="lbl-${k}">${S[k]} ${u}</span></span>`;
const cBtns=a=>a.map(v=>`<button class="btn${Math.abs(S.C*1e6-v)<1e-6?' on':''}" data-a="C" data-v="${v}">${v} µF</button>`).join('');
const swBtns=`<button class="btn green" data-a="charge">⚡ Charge</button><button class="btn" data-a="open">Isolate</button><button class="btn amber" data-a="disc">💡 Discharge</button>`;
const row=(l,v,c)=>[l,v,c||''];
const note=t=>'<div class="note-box">'+t+'</div>';
const Qcur=()=>S.mod==='graph'?S.C*S.Vc*(S.nz[Math.round(S.Vc)]||1):S.C*S.Vc;
const hideQ=()=>S.chal&&S.mod==='calc';
const chalBtn=()=>`<div class="sep"></div><button class="btn amber${S.chal?' on':''}" data-a="chal">🎯 Challenge Mode</button>`;
const M={
store:{cam:12,title:'Current I against time',graph:1,info:`<h3>4.1.1 · A capacitor stores energy</h3><p>A <b>capacitor</b> is two conducting plates separated by a gap (an insulator). Connected to a battery, electrons are pushed from one plate to the other: one plate gains <span class="pos">+Q</span>, the other <span class="neg">−Q</span>.</p><p>The battery does work to separate these charges. That work is stored as <b>energy in the electric field</b> between the plates.</p><p><span class="step-tag">TRY IT</span> <b>Charge</b>: current flows and the lamp shines while the plates charge; the current dies away as ΔV approaches V<sub>s</sub>. <b>Isolate</b>: the circuit is removed, and the plates keep their charge. <b>Discharge</b>: with no battery, the plates push current the opposite way and the lamp shines again. The graph panel plots I against t (R = 100 kΩ).</p>`,
 ctrl:()=>swBtns+`<div class="sep"></div>`+sl('Vs','V<sub>s</sub>=',1,12,1,'V')+`<button class="btn" data-a="reset">Reset</button>`,
 hud:()=>[row('Battery V<sub>s</sub>',S.Vs+' V','amber'),row('Capacitor ΔV',eng(S.Vc,'V'),'blue'),row('Charge Q',eng(Qcur(),'C'),'violet'),row('Current I',eng(S.I,'A'),'green'),row('Energy stored',eng(.5*Qcur()*S.Vc,'J'),'amber'),note({idle:'Uncharged. Press Charge. (R = 100 kΩ in the circuit.)',charge:'CHARGING: current flows, so the lamp shines. It falls to zero as ΔV reaches V<sub>s</sub>.',disc:'DISCHARGING (battery removed): the plates drive the current the other way and the lamp shines again.',open:S.Vc>.01?'ISOLATED: circuit removed, so the charge and energy stay on the plates.':'ISOLATED: no charge stored yet.'}[S.mode])]},
calc:{cam:12,info:`<h3>4.1.2 · Capacitance C = Q / ΔV</h3><p><b>Capacitance</b> is the amount of separated charge stored per unit potential difference:</p><p><b>C = Q / ΔV</b></p><p>Unit: the <b>farad (F)</b>, 1 F = 1 C V⁻¹. Practical capacitors are µF, nF or pF.</p><p>Choose a capacitor and change ΔV. More voltage puts more charge on the plates, but Q ÷ ΔV never changes: C belongs to the capacitor. Rearranged: <b>Q = CΔV</b> and <b>ΔV = Q/C</b>.</p><p><span class="step-tag">CHALLENGE</span> Press <b>🎯 Challenge Mode</b> to solve random problems with the rule.</p>`,
 ctrl:()=>S.chal?chalBtn().slice(chalBtn().indexOf('<button')):cBtns([1,2.2,4.7,10])+`<div class="sep"></div>`+sl('Vset','ΔV=',0,12,.5,'V')+chalBtn(),
 hud:()=>{if(hideQ())return[note('🎯 Challenge: readings are hidden. Use C = Q / ΔV.')];const Q=S.C*S.Vset;return[row('Capacitance C',eng(S.C,'F'),'amber'),row('Voltage ΔV',S.Vset.toFixed(1)+' V','blue'),row('Q = C·ΔV',eng(Q,'C'),'violet'),row('Q ÷ ΔV',S.Vset>0?eng(Q/S.Vset,'F'):'–','green'),note(`Q = ${+(S.C*1e6).toPrecision(3)} µF × ${S.Vset.toFixed(1)} V = ${eng(Q,'C')}`)]}},
graph:{cam:12,title:'Q against ΔV',graph:1,info:`<h3>4.1.3 · C from a Q–ΔV graph</h3><p>Set a voltage and press <b>Record</b> to plot a (ΔV, Q) point. Record several points at different voltages: they lie close to a straight line through the origin because Q ∝ ΔV.</p><p>With 2 or more points, press <b>📈 Fit line</b> in the graph panel to draw the line of best fit through the origin (⤢ enlarges the panel). Then open <b>📐 Gradient</b> and drag its two handles along the line. The tool shows <b>ΔV</b> and <b>ΔQ</b> for you to divide.</p><p><b>Gradient = ΔQ / ΔV = C</b>. A steeper line means a larger capacitance.</p><p>Free play uses hidden capacitors X, Y, Z (Reveal shows the marked value). Or press <b>🎯 Challenge Mode</b>.</p>`,
 ctrl:()=>(S.chal?'':HN.map((n,i)=>`<button class="btn${S.hid===i?' on':''}" data-a="hid" data-v="${i}">Capacitor ${n}</button>`).join('')+`<div class="sep"></div>`)+sl('Vset','ΔV=',1,12,1,'V')+`<button class="btn green" data-a="rec">● Record</button><button class="btn" data-a="clear">Clear</button>`+(S.chal?'':`<button class="btn amber" data-a="reveal">Reveal</button>`)+chalBtn(),
 hud:()=>{const r=[row('Voltage ΔV',S.Vset+' V','blue'),row('Charge Q (reading)',eng(Qcur(),'C'),'violet'),row('Points recorded',S.recs.length,'')];
  if(S.tool.on&&S.fit&&S.recs.length>=2){r.push(row('Tool ΔV',Math.abs(S.tool.h2.v-S.tool.h1.v).toFixed(1)+' V','green'),row('Tool ΔQ',Math.abs(toolQ(S.tool.h2)-toolQ(S.tool.h1)).toFixed(1)+' µC','green'))}
  if(S.reveal&&!S.chal)r.push(row('Marked value',eng(S.C,'F'),'amber'));
  r.push(note(S.recs.length<2?'Record at least 2 points to unlock 📈 Fit line.':!S.fit?'Press 📈 Fit line in the graph panel, then open 📐 Gradient.':'Drag the handles along the line, then divide ΔQ by ΔV.'));return r}},
geo:{cam:15,info:`<h3>4.1.4 · Parallel-plate capacitor</h3><p><b>C = ε₀A / d</b></p><p>A = area of one plate, d = plate separation, ε₀ = 8.85 × 10⁻¹² F m⁻¹ (permittivity of free space).</p><p><b>C ∝ A</b>: double the area, double C. <b>C ∝ 1/d</b>: double the gap, halve C.</p><p><b>Ideal capacitor:</b> the plates are very large compared with their separation, so the field between them is <b>constant</b>. Pull the plates far apart and watch the field lines bulge at the edges: the ideal formula no longer fits.</p><p>The capacitor stays connected to 12 V.</p>`,
 ctrl:()=>sl('side','plate side=',5,20,1,'cm')+sl('dmm','d=',1,20,.5,'mm')+`<button class="btn" data-a="georeset">Reset</button>`,
 hud:()=>{const A=Math.pow(S.side/100,2),ratio=S.side*10/S.dmm;return[row('Area A',(A*1e4).toFixed(0)+' cm²','green'),row('Separation d',S.dmm+' mm','green'),row('Capacitance C',eng(S.C,'F'),'amber'),row('Charge Q @12 V',eng(S.C*12,'C'),'violet'),row('Field E = ΔV/d',eng(12/(S.dmm/1000),'V/m'),'blue'),note(ratio>=10?'IDEAL: plate side ≫ d, so the field is uniform.':'NOT IDEAL: d is comparable to the plate size; the field bulges at the edges.')]}},
energy:{cam:12,title:'ΔV against Q',graph:1,info:`<h3>4.1.5 · Energy stored</h3><p>As the capacitor charges, ΔV rises with Q (V = Q/C). The energy stored is the <b>area under the V–Q graph</b>, a triangle:</p><p><b>U = ½QV = ½CV² = ½Q²/C</b></p><p>Charge, then Discharge: the lamp receives the stored energy. Double V and Q doubles too, so U becomes <b>four times</b> larger. All three formulas in the readings agree.</p>`,
 ctrl:()=>cBtns([1,2,5,10])+`<div class="sep"></div>`+swBtns+sl('Vs','V<sub>s</sub>=',1,12,1,'V')+`<button class="btn" data-a="reset">Reset</button>`,
 hud:()=>{const Q=S.C*S.Vc,V=S.Vc;return[row('C',eng(S.C,'F'),'amber'),row('ΔV',eng(V,'V'),'blue'),row('Q',eng(Q,'C'),'violet'),row('½ Q V',eng(.5*Q*V,'J'),'green'),row('½ C V²',eng(.5*S.C*V*V,'J'),'green'),row('½ Q² / C',eng(.5*Q*Q/S.C,'J'),'green'),row('Delivered to lamp',eng(S.Edel,'J'),'amber')]}},
quiz:{cam:12}
};

/* ---------- labels ---------- */
function chip(v,t,c){const p=v.clone().project(cam);if(p.z>1)return;const x=(p.x+1)/2*innerWidth,y=(1-p.y)/2*innerHeight;lctx.font='700 11px "Space Mono",monospace';const w=lctx.measureText(t).width+14;lctx.fillStyle='rgba(8,12,26,.85)';lctx.strokeStyle=c;lctx.lineWidth=1;lctx.fillRect(x-w/2,y-10,w,20);lctx.strokeRect(x-w/2,y-10,w,20);lctx.fillStyle=c;lctx.textAlign='center';lctx.textBaseline='middle';lctx.fillText(t,x,y+1)}
function drawLabels(){
  lctx.clearRect(0,0,lc.width,lc.height);if(S.mod==='quiz')return;
  const {s,g}=layout(),x=g/2+.05,y=.4,V=(a,b)=>new THREE.Vector3(a,b,0),hq=hideQ();
  chip(V(-x-.3,y+s/2+.35),'+Q','#ff5e72');chip(V(x+.3,y+s/2+.35),'−Q','#b57aff');
  if(!hq)chip(V(0,y+s/2+.9),'Q = '+eng(Qcur(),'C'),'#4dffa0');
  chip(V(0,y-s/2-.3),'d'+(S.mod==='geo'?' = '+S.dmm+' mm':''),'#ffc857');
  if(S.mod==='geo')chip(V(0,y+s/2+1.5),'A = '+S.side*S.side+' cm²','#4dffa0');
  if(bat.visible){chip(V(-1.4,-2.55),hq?'supply':engine()?'Vs = '+S.Vs+' V':S.mod==='geo'?'12 V':S.Vset.toFixed(1)+' V','#ffc857');chip(V(-2.02,-1.5),'+','#ff5e72');chip(V(-.78,-1.5),'−','#b57aff')}
  if(bulb.visible)chip(V(1.4,-2.55),'lamp','#ffc857');
}

/* ---------- 2D graph ---------- */
function fitK(){let a=0,b=0;S.recs.forEach(r=>{a+=r.v*r.q*1e6;b+=r.v*r.v});return b?a/b:0}
function toolQ(h){return Math.round(fitK()*h.v*10)/10}
function drawGraph(){
  const c=$('v2canvas'),W=c.clientWidth,H=c.clientHeight;if(!W||!H)return;
  if(c.width!==(W*DPR|0)||c.height!==(H*DPR|0)){c.width=W*DPR;c.height=H*DPR}
  const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);
  const fs=W>500?13:9,L=fs*4.2,Rp=fs*.9,T=fs,B=fs*3,m=S.mod;let xm,y0,ym,xl,yl;
  if(m==='energy'){xm=120;y0=0;ym=12;xl='Q (µC)';yl='ΔV (V)'}

    g.textAlign='left';g.fillStyle='#4dffa0';g.fillText('charging',L+6,T+fs);g.fillStyle='#ff5e72';g.fillText('discharging',L+6,H-B-6);

    g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.arc(X(S.Vset),Y(Qcur()*1e6),fs*.55,0,7);g.stroke();

    if(t.on&&S.fit&&S.recs.length>=2){
      const a={v:t.h1.v,q:toolQ(t.h1)},b={v:t.h2.v,q:toolQ(t.h2)};

function checkChal(){
  if(S.locked||!S.cq)return;const raw=$('chal-in').value.trim(),a=parseFloat(raw);
  if(raw===''||isNaN(a)){setRes('warn','Enter a numerical answer first.');return}
  if(S.mod==='graph'&&S.recs.length<2){setRes('warn','Record at least 2 points on the graph first, then use the gradient tool.');return}
  const q=S.cq,ok=Math.abs(a-q.ans)/q.ans<=q.tol;lockChal(true);
  const sc=S.score[S.mod];sc[1]++;if(ok)sc[0]++;scoreTxt();
  const slip=[1e3,1e-3,1e6,1e-6].some(r=>Math.abs(a/(q.ans*r)-1)<.05)?' Check your unit prefix (n, µ, m).':'';
  let msg;
  if(S.mod==='calc'){
    const inv=q.wrong&&Math.abs(a-q.wrong)/q.wrong<.03?' It looks like the rule was rearranged the wrong way round.':'';
    msg=ok?'✅ Correct! '+q.work:'❌ Not quite. You answered '+a+' '+q.unit+'. '+q.work+'.'+inv+slip;
  }else{
    const c=+q.ans.toPrecision(3);
    msg=ok?`✅ Correct! Your gradient (${a} µF) matches the capacitance, ${c} µF. Gradient of Q against ΔV = C.`:`❌ Not quite. Your gradient was ${a} µF but the capacitance was ${c} µF. Tip: take ΔV and ΔQ from well-separated handles on the fitted line; gradient = ΔQ ÷ ΔV.${slip}`;
  }
  setRes(ok?'pass':'fail',msg+'<br><i>Press “New challenge” for another problem.</i>');
}

const QZ_LEVELS=[
  {key:'easy',label:'Easy',n:5,color:'#4dffa0'},
  {key:'medium',label:'Medium',n:5,color:'#ffc857'},
  {key:'advanced',label:'Advanced',n:5,color:'#ff5e72'}
];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* prefer questions the student did not get on the previous visit */
function qzPick(pool,n,key){
  let seen=[];try{seen=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
  const idx=pool.map((_,i)=>i),fresh=shuf(idx.filter(i=>seen.indexOf(i)<0)),old=shuf(idx.filter(i=>seen.indexOf(i)>=0));
  const chosen=fresh.concat(old).slice(0,n);
  try{localStorage.setItem(key,JSON.stringify(chosen))}catch(e){}
  return shuf(chosen).map(i=>pool[i]);
}
let qz;
function qzStart(){
  const list=[];
  QZ_LEVELS.forEach(lv=>qzPick(QZ[lv.key],lv.n,'cap_quiz_seen_'+lv.key).forEach((it,k)=>list.push({lv,pos:k+1,k:it.k,q:it.q,e:it.e,o:it.o})));
  qz={list,i:0,score:0,missed:[],lvScore:{easy:0,medium:0,advanced:0}};qzShow();
}
function qzShow(){
  const box=$('quiz-box'),N=qz.list.length;
  if(qz.i>=N){
    const miss=[...new Set(qz.missed)].sort(),pct=Math.round(qz.score/N*100);
    const brk=QZ_LEVELS.map(lv=>{const p=Math.round(qz.lvScore[lv.key]/lv.n*100);return '<div class="qb-row"><span class="qb-name" style="color:'+lv.color+'">'+lv.label+'</span><span class="qb-bar"><i style="width:'+p+'%;background:'+lv.color+'"></i></span><span class="qb-val">'+p+'%</span></div>'}).join('');
    box.innerHTML='<div class="qz-meta"><span>RESULT</span></div><div class="qz-score">'+pct+'%</div><p style="font-size:13px;line-height:1.7;margin-bottom:12px">'+(pct>=80?'Outstanding grasp! 🎉':pct>=50?'Good job! Review the sections and try again.':'Keep practising these concepts!')+'</p><div class="qz-break">'+brk+'</div><p style="font-size:13px;line-height:1.7;margin-bottom:12px">'+(miss.length?'Revise these KPIs: <b style="color:var(--amber)">'+miss.join(', ')+'</b>':'<b style="color:var(--green)">Perfect: every KPI secure!</b>')+'</p><button class="btn green" id="qz-retry">↻ Try again (new questions)</button>';
    $('qz-retry').onclick=qzStart;return;
  }
  const Q=qz.list[qz.i],opts=shuf(Q.o.map((t,j)=>({t,ok:j===0})));
  box.innerHTML='<div class="qz-meta"><span>QUESTION '+(qz.i+1)+' / '+N+'</span><span><span class="qz-level" style="color:'+Q.lv.color+';border-color:'+Q.lv.color+'">'+Q.lv.label+' '+Q.pos+'/'+Q.lv.n+'</span>KPI '+Q.k+'</span></div><div class="qz-bar"><i style="width:'+qz.i/N*100+'%"></i></div><div class="qz-q"></div><div id="qz-opts"></div><div id="qz-fb"></div>';
  box.querySelector('.qz-q').textContent=Q.q;const wrap=$('qz-opts');
  opts.forEach(o=>{const b=document.createElement('button');b.className='qz-opt';b.textContent=o.t;
    b.onclick=()=>{wrap.querySelectorAll('.qz-opt').forEach((x,i)=>{x.disabled=true;if(opts[i].ok)x.classList.add('ok')});
      if(o.ok){qz.score++;qz.lvScore[Q.lv.key]++}else{b.classList.add('bad');qz.missed.push(Q.k)}
      const fb=$('qz-fb');fb.innerHTML='<div class="qz-exp"><b>'+(o.ok?'Correct. ':'Not quite. ')+'</b></div><button class="btn green" id="qz-next">'+(qz.i+1>=N?'See result':'Next →')+'</button>';
      fb.querySelector('.qz-exp').appendChild(document.createTextNode(Q.e));$('qz-next').onclick=()=>{qz.i++;qzShow()}};
    wrap.appendChild(b)});
}

/* ---------- main loop ---------- */
let lastHud='',last=performance.now(),lastR=0;
function frame(ts){
  requestAnimationFrame(frame);if(ts-lastR<33)return;lastR=ts;
  const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;
  if(S.mod==='quiz'){renderer.render(scene,cam);return}
  physics(dt);
  const {s,g}=layout(),Q=Qcur(),qr=QREF[S.mod],n=Q>0?Math.min(36,Math.max(1,Math.ceil(36*Q/qr))):0,op=Q>0?Math.min(1,.25+.75*Q/qr):0;
  let tilt=0;if(S.mod==='geo')tilt=Math.max(0,Math.min(1,(10-S.side*10/S.dmm)/10))*.9;
  setCap(s,g,n,op,tilt);
  const E=engine(),m=S.mode,run=E&&(m==='charge'||m==='disc'),circ=!E||m!=='open',fl=Math.abs(S.I)/(12/RES),act_=run&&Math.abs(S.I)>3e-7;
  wire.visible=circ;bat.visible=circ&&!(E&&m==='disc');bulb.visible=E&&circ;
  updateWire(s,g,act_&&circ,act_?Math.sign(S.I)*Math.min(1,Math.sqrt(fl))*.5:0,dt);
  const lamp=run?Math.min(1,Math.pow(fl,.6)):0;
  bulbMat.emissiveIntensity=lamp*2;bl.intensity=lamp*3;batMat.emissiveIntensity=act_&&m==='charge'?.5:0;
  const h=M[S.mod].hud().map(r=>typeof r==='string'?r:'<div class="dr"><span class="dl">'+r[0]+'</span><span class="dv '+r[2]+'">'+r[1]+'</span></div>').join('');
  if(h!==lastHud){$('hudBody').innerHTML=h;lastHud=h}
  const fb=$('v2-fit'),tb=$('v2-tool');if(S.recs.length<2)S.fit=false;if(!S.fit)S.tool.on=false;fb.disabled=S.recs.length<2;tb.disabled=!S.fit;fb.classList.toggle('on',S.fit);tb.classList.toggle('on',S.tool.on);
  if(M[S.mod].graph)drawGraph();
  drawLabels();renderer.render(scene,cam);
}
setMod('store');requestAnimationFrame(frame);
</script>

<div id="calc-panel" role="dialog" aria-label="Calculator">
  <div id="calc-head"><h2>🧮 CALCULATOR</h2><button id="calc-close" aria-label="Close calculator">✕</button></div>
  <iframe id="calc-frame" title="Calculator" data-src="https://darawa-io.github.io/ARLABS/calculator.html" allow="clipboard-write"></iframe>
</div>
<script>
(function(){
  var btn=document.getElementById('calc-btn'),panel=document.getElementById('calc-panel'),
      frame=document.getElementById('calc-frame'),head=document.getElementById('calc-head');
  function setOpen(o){
    panel.classList.toggle('show',o);btn.classList.toggle('on',o);btn.setAttribute('aria-expanded',o);
    if(o&&!frame.src)frame.src=frame.dataset.src; /* load once, keeps state when closed */
  }
  btn.addEventListener('click',function(){setOpen(!panel.classList.contains('show'));});
  document.getElementById('calc-close').addEventListener('click',function(){setOpen(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&panel.classList.contains('show'))setOpen(false);});
  /* drag by header */
  var sx,sy,ox,oy,dragging=false;
  head.addEventListener('pointerdown',function(e){
    if(e.target.id==='calc-close')return;
    var r=panel.getBoundingClientRect();
    panel.style.left=r.left+'px';panel.style.top=r.top+'px';panel.style.right='auto';panel.style.bottom='auto';
    sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;dragging=true;panel.classList.add('drag');head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var x=ox+e.clientX-sx,y=oy+e.clientY-sy;
    x=Math.max(0,Math.min(innerWidth-panel.offsetWidth,x));y=Math.max(0,Math.min(innerHeight-60,y));
    panel.style.left=x+'px';panel.style.top=y+'px';
  });
  function end(){dragging=false;panel.classList.remove('drag');}
  head.addEventListener('pointerup',end);head.addEventListener('pointercancel',end);
})();
</script>
