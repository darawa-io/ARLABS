<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Capacitance Lab | PHY51</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');
:root{--bg:#07090f;--border:rgba(180,200,255,.10);--amber:#ffc857;--blue:#5bc8ff;--violet:#b57aff;--green:#4dffa0;--red:#ff5e72;--text:#ddeeff;--muted:rgba(180,210,255,.45)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'DM Sans',sans-serif;font-weight:300;overflow:hidden;height:100vh;width:100vw;color:var(--text);touch-action:none;-webkit-tap-highlight-color:transparent}
#mainCanvas{position:absolute;inset:0;z-index:1;touch-action:none}
#labelCanvas{position:absolute;inset:0;pointer-events:none;z-index:3}
#title{position:absolute;top:16px;left:16px;z-index:5}
#title h1{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:#fff;letter-spacing:.4px}
#title p{font-size:9px;color:rgba(180,200,255,.4);letter-spacing:1.6px;text-transform:uppercase;margin-top:2px;font-family:'Space Mono',monospace}
#tabbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(10,14,28,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:5px;z-index:10;max-width:calc(100vw - 200px);overflow-x:auto}
#tabbar::-webkit-scrollbar{height:0}
.tab-btn{padding:8px 11px;border-radius:9px;border:none;background:transparent;color:var(--muted);font-family:'Space Mono',monospace;font-size:9.5px;white-space:nowrap;cursor:pointer;transition:all .18s}
.tab-btn:hover{color:#fff}.tab-btn.on{background:rgba(91,200,255,.2);color:#fff}
.panel{background:rgba(10,14,28,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:15px;z-index:10}
.panel>h2,#v2head{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2.5px;color:rgba(180,200,255,.45);text-transform:uppercase;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;user-select:none}
.panel>h2::after{content:'\25BE'}.folded>h2::after{content:'\25B8'}.folded>*:not(h2){display:none!important}.folded>h2{margin:0;border:0;padding:0}
#rightCol{position:absolute;top:70px;right:14px;width:230px;z-index:10;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 150px);overflow-y:auto}
#view2d{display:none}#view2d.show{display:block}
#v2head{cursor:default;margin-bottom:6px}
#v2canvas{display:block;width:100%;height:190px}
.dr{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:5px 8px;border-radius:8px;background:rgba(180,200,255,.04);gap:6px}
.dl{font-family:'Space Mono',monospace;font-size:10px;color:rgba(180,210,255,.6)}
.dv{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;text-align:right}
.dv.amber{color:var(--amber)}.dv.blue{color:var(--blue)}.dv.violet{color:var(--violet)}.dv.green{color:var(--green)}
.hdiv{height:1px;background:var(--border);margin:9px 0}
#legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-family:'Space Mono',monospace;font-size:9px}
.legchip{display:flex;align-items:center;gap:4px;color:rgba(200,215,255,.65)}
.legdot{width:8px;height:8px;border-radius:50%}
.note-box{padding:8px 9px;border-radius:9px;background:rgba(180,120,255,.06);border:1px solid rgba(180,120,255,.18);font-size:10px;font-family:'Space Mono',monospace;color:rgba(210,220,255,.8);line-height:1.7}
#infoPanel{position:absolute;top:70px;left:14px;width:270px;max-width:calc(100vw - 320px);max-height:calc(100vh - 160px);overflow-y:auto}
#info h3{font-family:'Syne',sans-serif;font-size:13.5px;font-weight:700;color:#fff;margin-bottom:8px}
#info p{font-size:11.5px;line-height:1.65;color:rgba(210,222,250,.82);margin-bottom:8px}
#info b{color:#fff}.pos{color:var(--red);font-weight:700}.neg{color:var(--violet);font-weight:700}
.step-tag{display:inline-block;font-family:'Space Mono',monospace;font-size:9px;color:var(--green);background:rgba(77,255,160,.08);border:1px solid rgba(77,255,160,.25);border-radius:6px;padding:2px 7px;letter-spacing:.5px}
#controls{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;background:rgba(10,14,28,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:40px;padding:8px 14px;z-index:10;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
#ctrlbody{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{padding:7px 14px;border-radius:26px;border:1px solid rgba(180,200,255,.25);background:rgba(180,200,255,.06);color:var(--blue);font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap;outline:none}
.btn:hover{background:rgba(180,200,255,.14)}.btn.on{background:rgba(91,200,255,.2);border-color:var(--blue);color:#fff}
.btn.green{border-color:rgba(77,255,160,.4);color:var(--green);background:rgba(77,255,160,.06)}
.btn.amber{border-color:rgba(255,200,87,.4);color:var(--amber);background:rgba(255,200,87,.06)}
.sep{width:1px;height:20px;background:var(--border)}
.sw{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10.5px;font-family:'Space Mono',monospace;white-space:nowrap}
input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:rgba(180,200,255,.15);outline:none;cursor:pointer;width:90px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--violet);box-shadow:0 0 8px rgba(181,122,255,.6)}
#hint{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);font-size:8.5px;color:rgba(180,200,255,.25);letter-spacing:1px;pointer-events:none;font-family:'Space Mono',monospace;z-index:10;white-space:nowrap}
#quiz{position:fixed;inset:70px 0 0 0;z-index:9;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;touch-action:pan-y;padding:16px;background:rgba(7,9,15,.88)}
#quiz-box{background:rgba(13,17,32,.97);border:1px solid var(--border);border-radius:16px;padding:22px;max-width:660px;width:100%}
.qz-meta{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--amber);margin-bottom:8px;display:flex;justify-content:space-between}
.qz-bar{height:4px;border-radius:3px;background:rgba(180,200,255,.1);margin-bottom:16px;overflow:hidden}
.qz-bar i{display:block;height:100%;background:var(--blue)}
.qz-q{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:#fff;margin-bottom:14px;line-height:1.4}
.qz-opt{display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;border-radius:11px;border:1px solid rgba(180,200,255,.2);background:rgba(180,200,255,.05);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}
.qz-opt:hover:not(:disabled){background:rgba(91,200,255,.14)}
.qz-opt.ok{border-color:var(--green);background:rgba(77,255,160,.14)}.qz-opt.bad{border-color:var(--red);background:rgba(255,94,114,.14)}
.qz-exp{margin:10px 0;padding:10px 12px;border-radius:10px;background:rgba(255,200,87,.07);border:1px solid rgba(255,200,87,.25);font-size:12px;line-height:1.6;color:rgba(230,236,255,.9)}
.qz-score{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;color:#fff;margin:6px 0}
@media (max-width:820px){#infoPanel{display:none}#rightCol{top:100px;width:190px;max-height:calc(100vh - 190px)}#tabbar{max-width:calc(100vw - 20px);top:60px;left:14px;transform:none}#quiz{inset:100px 0 0 0}}
</style>
</head>
<body>
<canvas id="mainCanvas"></canvas><canvas id="labelCanvas"></canvas>
<div id="title"><h1>CAPACITANCE LAB</h1><p>PHY51 · 4.1 · Charge · Voltage · Energy</p></div>
<div id="tabbar">
  <button class="tab-btn" data-mod="store">1 · CAPACITOR</button>
  <button class="tab-btn" data-mod="calc">2 · C = Q/ΔV</button>
  <button class="tab-btn" data-mod="graph">3 · Q–ΔV GRAPH</button>
  <button class="tab-btn" data-mod="geo">4 · PLATES</button>
  <button class="tab-btn" data-mod="energy">5 · ENERGY</button>
  <button class="tab-btn" data-mod="quiz">6 · SELF-TEST</button>
</div>
<div id="rightCol">
  <div id="hud" class="panel"><h2>Readings</h2>
    <div id="legend"><span class="legchip"><span class="legdot" style="background:var(--red)"></span>+ charge</span><span class="legchip"><span class="legdot" style="background:var(--violet)"></span>electrons (−)</span><span class="legchip"><span class="legdot" style="background:var(--amber)"></span>field</span></div>
    <div class="hdiv"></div><div id="hudBody"></div>
  </div>
  <div id="view2d" class="panel"><div id="v2head"><span id="v2t"></span></div><canvas id="v2canvas"></canvas></div>
</div>
<div id="quiz"><div id="quiz-box"></div></div>
<div id="infoPanel" class="panel"><h2>Concept</h2><div id="info"></div></div>
<div id="controls"><div id="ctrlbody"></div><div class="sep"></div><button class="btn" data-a="cam">⟲ View</button></div>
<div id="hint">drag: rotate view · scroll / pinch: zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('mainCanvas'),lc=$('labelCanvas'),lctx=lc.getContext('2d'),DPR=Math.min(devicePixelRatio||1,2);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x07090f,.018);
const cam=new THREE.PerspectiveCamera(50,1,.1,200);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();lc.width=w;lc.height=h}
addEventListener('resize',resize);resize();
scene.add(new THREE.AmbientLight(0xffffff,2.2));
const sun=new THREE.DirectionalLight(0xfff8f0,1.1);sun.position.set(5,10,6);scene.add(sun);
const rim=new THREE.DirectionalLight(0x6688ff,.5);rim.position.set(-6,4,-4);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x0d1020,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.6;scene.add(floor);
const grid=new THREE.GridHelper(40,30,0x1a2540,0x121c30);grid.position.y=-2.58;scene.add(grid);

/* ---------- orbit ---------- */
const orb={theta:.35,phi:.16,radius:12,cx:0,cy:-.2,cz:0};
function applyOrbit(){orb.phi=Math.max(-.6,Math.min(.95,orb.phi));orb.radius=Math.max(4,Math.min(30,orb.radius));const r=orb.radius,p=orb.phi,t=orb.theta;cam.position.set(orb.cx+r*Math.cos(p)*Math.sin(t),orb.cy+r*Math.sin(p),orb.cz+r*Math.cos(p)*Math.cos(t));cam.lookAt(orb.cx,orb.cy,orb.cz)}
const ptrs=new Map();let pd=0,pr=0;
const pdist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){pd=pdist();pr=orb.radius}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;if(ptrs.size===1){orb.theta-=(e.clientX-p.x)*.005;orb.phi+=(e.clientY-p.y)*.005}p.x=e.clientX;p.y=e.clientY;if(ptrs.size===2&&pd>0)orb.radius=pr*pd/pdist();applyOrbit()});
const pup=e=>ptrs.delete(e.pointerId);canvas.addEventListener('pointerup',pup);canvas.addEventListener('pointercancel',pup);
canvas.addEventListener('wheel',e=>{orb.radius+=e.deltaY*.01;applyOrbit();e.preventDefault()},{passive:false});
applyOrbit();

/* ---------- capacitor model (3D) ---------- */
const cap=new THREE.Group();cap.position.y=.4;scene.add(cap);
const plateMat=c=>new THREE.MeshStandardMaterial({color:0x56637f,metalness:.6,roughness:.35,emissive:c,emissiveIntensity:0});
const pL=new THREE.Mesh(new THREE.BoxGeometry(.1,1,1),plateMat(0xff5e72)),pR=new THREE.Mesh(new THREE.BoxGeometry(.1,1,1),plateMat(0xb57aff));cap.add(pL,pR);
const dotG=new THREE.SphereGeometry(.07,10,10),mRed=new THREE.MeshBasicMaterial({color:0xff5e72}),mVio=new THREE.MeshBasicMaterial({color:0xb57aff});
const dL=[],dR=[];for(let i=0;i<36;i++){const a=new THREE.Mesh(dotG,mRed),b=new THREE.Mesh(dotG,mVio);cap.add(a,b);dL.push(a);dR.push(b)}
const arrows=[];for(let i=0;i<25;i++){const a=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),1,0xffc857);a.line.material.transparent=a.cone.material.transparent=true;cap.add(a);arrows.push(a)}
function setCap(s,g,n,op,tilt){
  const x=g/2+.05;pL.scale.set(1,s,s);pR.scale.set(1,s,s);pL.position.x=-x;pR.position.x=x;
  for(let i=0;i<36;i++){const c=(i*7)%36,y=((c%6)-2.5)/2.5*.42*s,z=(((c/6)|0)-2.5)/2.5*.42*s;dL[i].position.set(-g/2+.03,y,z);dR[i].position.set(g/2-.03,y,z);dL[i].visible=dR[i].visible=i<n}
  pL.material.emissiveIntensity=pR.material.emissiveIntensity=.45*op;
  const len=Math.max(.15,g-.16);
  arrows.forEach((a,i)=>{const ai=i%5,ak=(i/5)|0,ey=(ai===0||ai===4)?(ai-2)/2*tilt:0,ez=(ak===0||ak===4)?(ak-2)/2*tilt:0;
    a.position.set(-g/2+.08,(ai-2)/2*.42*s,(ak-2)/2*.42*s);a.setDirection(new THREE.Vector3(1,ey,ez).normalize());a.setLength(len,Math.min(.22,len*.4),.1);
    a.visible=op>.02;a.line.material.opacity=a.cone.material.opacity=.2+.8*op});
}
/* wire, battery, lamp, flowing electrons */
const wire=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x8fa2c0}));cap.add(wire);
const batMat=new THREE.MeshStandardMaterial({color:0x2a3550,emissive:0xffc857,emissiveIntensity:0});
const bat=new THREE.Group();bat.position.set(-1.4,-2.4,0);bat.add(new THREE.Mesh(new THREE.BoxGeometry(1.1,.6,.5),batMat));
const tp=new THREE.Mesh(new THREE.BoxGeometry(.14,.3,.3),new THREE.MeshStandardMaterial({color:0xff5e72,emissive:0xff5e72,emissiveIntensity:.5}));tp.position.x=-.62;
const tn=new THREE.Mesh(new THREE.BoxGeometry(.14,.3,.3),new THREE.MeshStandardMaterial({color:0xb57aff,emissive:0xb57aff,emissiveIntensity:.5}));tn.position.x=.62;bat.add(tp,tn);cap.add(bat);
const bulbMat=new THREE.MeshStandardMaterial({color:0x445566,emissive:0xffc857,emissiveIntensity:0});
const bulb=new THREE.Group();bulb.position.set(1.4,-2.4,0);bulb.add(new THREE.Mesh(new THREE.SphereGeometry(.38,20,20),bulbMat));
const bl=new THREE.PointLight(0xffc857,0,8);bulb.add(bl);cap.add(bulb);
const flow=[];for(let i=0;i<16;i++){const m=new THREE.Mesh(dotG,mVio);m.scale.setScalar(1.2);cap.add(m);flow.push(m)}
let flowU=0;
function updateWire(s,g,showFlow,speed,dt){
  const x=g/2+.05,pts=[new THREE.Vector3(-x,-s/2,0),new THREE.Vector3(-2.8,-2.4,0),new THREE.Vector3(2.8,-2.4,0),new THREE.Vector3(x,-s/2,0)];
  wire.geometry.setFromPoints(pts);
  const ln=[],tot=pts.slice(1).reduce((a,p,i)=>{const l=p.distanceTo(pts[i]);ln.push(l);return a+l},0);
  flowU=(flowU+speed*dt+1)%1;
  flow.forEach((m,i)=>{m.visible=showFlow;if(!showFlow)return;let d=((i/flow.length+flowU)%1)*tot,k=0;while(k<ln.length-1&&d>ln[k]){d-=ln[k];k++}m.position.lerpVectors(pts[k],pts[k+1],d/ln[k])});
}

/* ---------- state & physics ---------- */
const EPS0=8.85e-12,HID=[2.2e-6,4.7e-6,8.2e-6],HN=['X','Y','Z'];
const S={mod:'store',C:5e-6,Vs:9,Vc:0,mode:'open',Vset:6,side:10,dmm:5,hid:0,recs:[],reveal:false,dV:0,Edel:0};
function eng(x,u){if(!x)return '0 '+u;const P=[[1e-12,'p'],[1e-9,'n'],[1e-6,'µ'],[1e-3,'m'],[1,'']];let a=Math.abs(x),p=P[0];for(const q of P)if(a>=q[0]*.9995)p=q;return (+(x/p[0]).toPrecision(3))+' '+p[1]+u}
const fitC=()=>{let a=0,b=0;S.recs.forEach(r=>{a+=r.v*r.q;b+=r.v*r.v});return b?a/b:0};
const layout=()=>S.mod==='geo'?{s:S.side*.2,g:.2+S.dmm*.16}:{s:3,g:1.6};
const engine=()=>S.mod==='store'||S.mod==='energy';
function physics(dt){
  const old=S.Vc,U0=.5*S.C*old*old;
  if(engine()){
    if(S.mode==='charge'){S.Vc+=(S.Vs-S.Vc)*(1-Math.exp(-dt/.7));if(Math.abs(S.Vs-S.Vc)<.005)S.Vc=S.Vs}
    else if(S.mode==='disc'){S.Vc*=Math.exp(-dt/.9);if(S.Vc<.005)S.Vc=0;S.Edel+=Math.max(0,U0-.5*S.C*S.Vc*S.Vc)}
  }else if(S.mod==='calc'){S.Vc=S.Vset}
  else if(S.mod==='graph'){S.C=HID[S.hid];S.Vc=S.Vset}
  else if(S.mod==='geo'){S.C=EPS0*Math.pow(S.side/100,2)/(S.dmm/1000);S.Vc=12}
  S.dV=(S.Vc-old)/Math.max(dt,.001);
}
const QREF={store:60e-6,calc:120e-6,graph:100e-6,geo:4.3e-9,energy:120e-6};

/* ---------- module definitions ---------- */
const sl=(k,lab,min,max,step,u)=>`<span class="sw">${lab}<input type="range" data-s="${k}" data-u="${u}" min="${min}" max="${max}" step="${step}" value="${S[k]}"><span id="lbl-${k}">${S[k]} ${u}</span></span>`;
const cBtns=a=>a.map(v=>`<button class="btn${Math.abs(S.C*1e6-v)<1e-6?' on':''}" data-a="C" data-v="${v}">${v} µF</button>`).join('');
const swBtns=`<button class="btn green" data-a="charge">⚡ Charge</button><button class="btn" data-a="open">Isolate</button><button class="btn amber" data-a="disc">💡 Discharge</button>`;
const row=(l,v,c)=>[l,v,c||''];
const note=t=>'<div class="note-box">'+t+'</div>';
const M={
store:{cam:12,info:`<h3>4.1.1 · A capacitor stores energy</h3><p>A <b>capacitor</b> is two conducting plates separated by a gap (an insulator). Connected to a battery, electrons are pushed from one plate to the other: one plate gains <span class="pos">+Q</span>, the other <span class="neg">−Q</span>.</p><p>The battery does work to separate these charges. That work is stored as <b>energy in the electric field</b> between the plates.</p><p><span class="step-tag">TRY IT</span> <b>Charge</b> → <b>Isolate</b> (charge and voltage stay: the energy is still stored) → <b>Discharge</b> (the lamp lights as the energy is released).</p>`,
 ctrl:()=>swBtns+`<div class="sep"></div>`+sl('Vs','V<sub>s</sub>=',1,12,1,'V')+`<button class="btn" data-a="reset">Reset</button>`,
 hud:()=>{const Q=S.C*S.Vc;return[row('Battery V<sub>s</sub>',S.Vs+' V','amber'),row('Capacitor ΔV',eng(S.Vc,'V'),'blue'),row('Charge Q',eng(Q,'C'),'violet'),row('Energy stored',eng(.5*Q*S.Vc,'J'),'green'),note({charge:'CHARGING: electrons move off the left plate onto the right plate.',disc:'DISCHARGING: stored energy is released as light and heat in the lamp.',open:S.Vc>.01?'ISOLATED: no circuit, so the charge and energy stay stored.':'Uncharged. Press Charge.'}[S.mode])]}},
calc:{cam:12,info:`<h3>4.1.2 · Capacitance C = Q / ΔV</h3><p><b>Capacitance</b> is the amount of separated charge stored per unit potential difference:</p><p><b>C = Q / ΔV</b></p><p>Unit: the <b>farad (F)</b>, 1 F = 1 C V⁻¹. Practical capacitors are µF, nF or pF.</p><p>Choose a capacitor and change ΔV. More voltage puts more charge on the plates, but Q ÷ ΔV never changes: C belongs to the capacitor. Rearranged: <b>Q = CΔV</b> and <b>ΔV = Q/C</b>.</p>`,
 ctrl:()=>cBtns([1,2.2,4.7,10])+`<div class="sep"></div>`+sl('Vset','ΔV=',0,12,.5,'V'),
 hud:()=>{const Q=S.C*S.Vset;return[row('Capacitance C',eng(S.C,'F'),'amber'),row('Voltage ΔV',S.Vset.toFixed(1)+' V','blue'),row('Q = C·ΔV',eng(Q,'C'),'violet'),row('Q ÷ ΔV',S.Vset>0?eng(Q/S.Vset,'F'):'–','green'),note(`Q = ${+(S.C*1e6).toPrecision(3)} µF × ${S.Vset.toFixed(1)} V = ${eng(Q,'C')}`)]}},
graph:{cam:12,info:`<h3>4.1.3 · C from a Q–ΔV graph</h3><p>Capacitor <b>X, Y or Z</b> is hidden. Set a voltage and press <b>Record</b> to take a (ΔV, Q) reading. Repeat for several voltages.</p><p>The points lie on a straight line through the origin because Q ∝ ΔV. The <b>gradient</b> ΔQ/ΔV is the <b>capacitance C</b>. A steeper line means a larger capacitance.</p><p>Readings scatter slightly, so use the line of best fit. Press <b>Reveal</b> to compare with the marked value.</p>`,
 ctrl:()=>HN.map((n,i)=>`<button class="btn${S.hid===i?' on':''}" data-a="hid" data-v="${i}">Capacitor ${n}</button>`).join('')+`<div class="sep"></div>`+sl('Vset','ΔV=',1,12,1,'V')+`<button class="btn green" data-a="rec">● Record</button><button class="btn" data-a="clear">Clear</button><button class="btn amber" data-a="reveal">Reveal</button>`,
 graph:1,hud:()=>{const f=fitC();return[row('Voltage ΔV',S.Vset+' V','blue'),row('Charge Q',eng(S.C*S.Vset,'C'),'violet'),row('Points recorded',S.recs.length,''),row('Gradient = C',f?eng(f,'F'):'–','green'),row('Marked value',S.reveal?eng(S.C,'F'):'hidden','amber')]}},
geo:{cam:15,info:`<h3>4.1.4 · Parallel-plate capacitor</h3><p><b>C = ε₀A / d</b></p><p>A = area of one plate, d = plate separation, ε₀ = 8.85 × 10⁻¹² F m⁻¹ (permittivity of free space).</p><p><b>C ∝ A</b>: double the area, double C. <b>C ∝ 1/d</b>: double the gap, halve C.</p><p><b>Ideal capacitor:</b> the plates are very large compared with their separation, so the field between them is <b>constant</b>. Pull the plates far apart and watch the field lines bulge at the edges: the ideal formula no longer fits.</p><p>The capacitor stays connected to 12 V.</p>`,
 ctrl:()=>sl('side','plate side=',5,20,1,'cm')+sl('dmm','d=',1,20,.5,'mm')+`<button class="btn" data-a="georeset">Reset</button>`,
 hud:()=>{const A=Math.pow(S.side/100,2),ratio=S.side*10/S.dmm;return[row('Area A',(A*1e4).toFixed(0)+' cm²','green'),row('Separation d',S.dmm+' mm','green'),row('Capacitance C',eng(S.C,'F'),'amber'),row('Charge Q @12 V',eng(S.C*12,'C'),'violet'),row('Field E = ΔV/d',eng(12/(S.dmm/1000),'V/m'),'blue'),note(ratio>=10?'IDEAL: plate side ≫ d, so the field is uniform.':'NOT IDEAL: d is comparable to the plate size; the field bulges at the edges.')]}},
energy:{cam:12,info:`<h3>4.1.5 · Energy stored</h3><p>As the capacitor charges, ΔV rises with Q (V = Q/C). The energy stored is the <b>area under the V–Q graph</b>, a triangle:</p><p><b>U = ½QV = ½CV² = ½Q²/C</b></p><p>Charge, then Discharge: the lamp receives the stored energy. Double V and Q doubles too, so U becomes <b>four times</b> larger. All three formulas in the readings agree.</p>`,
 ctrl:()=>cBtns([1,2,5,10])+`<div class="sep"></div>`+swBtns+sl('Vs','V<sub>s</sub>=',1,12,1,'V')+`<button class="btn" data-a="reset">Reset</button>`,
 graph:1,hud:()=>{const Q=S.C*S.Vc,V=S.Vc;return[row('C',eng(S.C,'F'),'amber'),row('ΔV',eng(V,'V'),'blue'),row('Q',eng(Q,'C'),'violet'),row('½ Q V',eng(.5*Q*V,'J'),'green'),row('½ C V²',eng(.5*S.C*V*V,'J'),'green'),row('½ Q² / C',eng(.5*Q*Q/S.C,'J'),'green'),row('Delivered to lamp',eng(S.Edel,'J'),'amber')]}},
quiz:{cam:12}
};

/* ---------- labels ---------- */
function chip(v,t,c){const p=v.clone().project(cam);if(p.z>1)return;const x=(p.x+1)/2*innerWidth,y=(1-p.y)/2*innerHeight;lctx.font='700 11px "Space Mono",monospace';const w=lctx.measureText(t).width+14;lctx.fillStyle='rgba(8,12,26,.85)';lctx.strokeStyle=c;lctx.lineWidth=1;lctx.fillRect(x-w/2,y-10,w,20);lctx.strokeRect(x-w/2,y-10,w,20);lctx.fillStyle=c;lctx.textAlign='center';lctx.textBaseline='middle';lctx.fillText(t,x,y+1)}
function drawLabels(){
  lctx.clearRect(0,0,lc.width,lc.height);if(S.mod==='quiz')return;
  const {s,g}=layout(),x=g/2+.05,y=.4,V=(a,b)=>new THREE.Vector3(a,b,0);
  chip(V(-x-.3,y+s/2+.35),'+Q','#ff5e72');chip(V(x+.3,y+s/2+.35),'−Q','#b57aff');
  chip(V(0,y-s/2-.3),'d'+(S.mod==='geo'?' = '+S.dmm+' mm':''),'#ffc857');
  if(S.mod==='geo')chip(V(0,y+s/2+.8),'A = '+S.side*S.side+' cm²','#4dffa0');
  chip(V(-1.4,-2.55),engine()?'Vs = '+S.Vs+' V':S.mod==='geo'?'12 V':S.Vset.toFixed(1)+' V','#ffc857');
  if(engine())chip(V(1.4,-2.55),'lamp','#ffc857');
}

/* ---------- 2D graph ---------- */
function drawGraph(){
  const c=$('v2canvas'),W=c.clientWidth,H=c.clientHeight;if(!W)return;
  if(c.width!==(W*DPR|0)){c.width=W*DPR;c.height=H*DPR}
  const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);
  const en=S.mod==='energy',xm=en?120:12,ym=en?12:120,L=36,R=8,T=8,B=26,X=v=>L+v/xm*(W-L-R),Y=v=>H-B-v/ym*(H-T-B);
  g.font='9px "Space Mono",monospace';g.lineWidth=1;
  for(let i=0;i<=4;i++){const xv=xm*i/4,yv=ym*i/4;g.strokeStyle='rgba(180,200,255,.12)';g.beginPath();g.moveTo(X(xv),Y(0));g.lineTo(X(xv),Y(ym));g.moveTo(X(0),Y(yv));g.lineTo(X(xm),Y(yv));g.stroke();g.fillStyle='rgba(180,210,255,.55)';g.textAlign='center';g.fillText(xv,X(xv),H-B+11);g.textAlign='right';g.fillText(yv,L-4,Y(yv)+3)}
  g.fillStyle='#ffc857';g.textAlign='center';g.fillText(en?'Q (µC)':'ΔV (V)',(L+W-R)/2,H-3);g.save();g.translate(9,(T+H-B)/2);g.rotate(-Math.PI/2);g.fillText(en?'ΔV (V)':'Q (µC)',0,0);g.restore();
  if(en){
    const C=S.C*1e6,Q=C*S.Vc,V=S.Vc,xe=Math.min(xm,12*C);
    g.strokeStyle='#5bc8ff';g.lineWidth=2;g.beginPath();g.moveTo(X(0),Y(0));g.lineTo(X(xe),Y(xe/C));g.stroke();
    g.fillStyle='rgba(255,200,87,.3)';g.beginPath();g.moveTo(X(0),Y(0));g.lineTo(X(Q),Y(0));g.lineTo(X(Q),Y(V));g.closePath();g.fill();
    g.fillStyle='#ffc857';g.beginPath();g.arc(X(Q),Y(V),4,0,7);g.fill();
    if(V>.5){g.textAlign='right';g.fillText('area = U',X(Q)-4,Y(0)-5)}
  }else{
    const k=fitC()*1e6;g.fillStyle='#ffc857';S.recs.forEach(r=>{g.beginPath();g.arc(X(r.v),Y(r.q*1e6),3.5,0,7);g.fill()});
    g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.arc(X(S.Vset),Y(S.C*S.Vset*1e6),5,0,7);g.stroke();
    if(k){g.strokeStyle='#4dffa0';g.lineWidth=1.5;g.beginPath();g.moveTo(X(0),Y(0));g.lineTo(X(xm),Y(Math.min(ym,k*xm)));g.stroke();
      const a=3,b=9;g.setLineDash([3,3]);g.strokeStyle='rgba(77,255,160,.7)';g.beginPath();g.moveTo(X(a),Y(k*a));g.lineTo(X(b),Y(k*a));g.lineTo(X(b),Y(k*b));g.stroke();g.setLineDash([]);
      g.fillStyle='#4dffa0';g.textAlign='center';g.fillText('ΔV',X((a+b)/2),Y(k*a)+11);g.textAlign='left';g.fillText('ΔQ',X(b)+3,Y(k*(a+b)/2))}
  }
}

/* ---------- controls ---------- */
function act(b){
  const a=b.dataset.a,v=b.dataset.v;
  if(a==='cam')return setCam();
  if(a==='charge'||a==='disc'||a==='open')S.mode=a;
  else if(a==='reset'){S.Vc=0;S.mode='open';S.Edel=0}
  else if(a==='C'){S.C=+v*1e-6;b.parentNode.querySelectorAll('[data-a=C]').forEach(x=>x.classList.toggle('on',x===b))}
  else if(a==='hid'){S.hid=+v;S.recs=[];S.reveal=false;b.parentNode.querySelectorAll('[data-a=hid]').forEach(x=>x.classList.toggle('on',x===b))}
  else if(a==='rec'){if(S.recs.length<24)S.recs.push({v:S.Vset,q:S.C*S.Vset*(1+(Math.random()-.5)*.08)})}
  else if(a==='clear')S.recs=[];
  else if(a==='reveal')S.reveal=!S.reveal;
  else if(a==='georeset'){S.side=10;S.dmm=5;setMod('geo')}
}
$('controls').addEventListener('click',e=>{const b=e.target.closest('button');if(b)act(b)});
$('controls').addEventListener('input',e=>{const k=e.target.dataset.s;if(!k)return;S[k]=+e.target.value;$('lbl-'+k).textContent=S[k]+' '+e.target.dataset.u});
function setCam(){orb.theta=.35;orb.phi=.16;orb.radius=M[S.mod].cam;orb.cy=-.2;applyOrbit()}
const INIT={store(){S.C=5e-6;S.Vc=0;S.mode='open';S.Vs=9;S.Edel=0},calc(){S.C=4.7e-6;S.Vset=6},graph(){S.hid=0;S.Vset=6;S.recs=[];S.reveal=false},geo(){},energy(){S.C=5e-6;S.Vc=0;S.mode='open';S.Vs=9;S.Edel=0},quiz(){}};
function setMod(id){
  S.mod=id;INIT[id]();
  const q=id==='quiz';
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('on',b.dataset.mod===id));
  ['infoPanel','rightCol','controls','hint'].forEach(i=>$(i).style.display=q?'none':'');
  $('quiz').style.display=q?'flex':'none';cap.visible=!q;
  if(!q){$('info').innerHTML=M[id].info;$('ctrlbody').innerHTML=M[id].ctrl();$('v2t').textContent=id==='energy'?'ΔV against Q':'Q against ΔV';
    $('view2d').classList.toggle('show',!!M[id].graph);bulb.visible=engine();setCam();lastHud=''}
}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>setMod(b.dataset.mod)));
['infoPanel','hud'].forEach(id=>$(id).querySelector('h2').addEventListener('click',()=>$(id).classList.toggle('folded')));

/* ---------- quiz ---------- */
const QZ=[
{k:'4.1.1',q:'A capacitor is best described as a device that…',o:['stores energy by holding separated electric charge','creates electric charge','stores charge only while a current flows','converts all electrical energy into heat'],e:'A capacitor stores energy in the electric field produced by equal and opposite charges on its plates.'},
{k:'4.1.1',q:'You charge a capacitor, then disconnect the battery. What happens to the stored energy?',o:['It stays stored, because the charge has nowhere to go','It drains away immediately','It flows back into the battery','It doubles'],e:'With no complete circuit the charge cannot leave the plates, so the energy remains stored until a path is provided.'},
{k:'4.1.2',q:'Capacitance is defined as…',o:['charge stored per unit potential difference, C = Q/ΔV','potential difference per unit charge','energy stored per unit charge','current per unit time'],e:'C = Q/ΔV: the more charge a capacitor holds for each volt, the larger its capacitance.'},
{k:'4.1.2',q:'The farad (F) is equivalent to…',o:['coulomb per volt (C V⁻¹)','volt per coulomb','joule per coulomb','coulomb per second'],e:'1 F = 1 C V⁻¹, which follows directly from C = Q/ΔV.'},
{k:'4.1.2',q:'A 4.7 µF capacitor is connected across 12 V. How much charge does it store?',o:['56 µC','0.39 µC','5.6 µC','560 µC'],e:'Q = CΔV = 4.7 µF × 12 V = 56.4 µC.'},
{k:'4.1.2',q:'A capacitor holds 240 µC when the potential difference across it is 6.0 V. Its capacitance is…',o:['40 µF','1.4 mF','0.025 µF','1440 µF'],e:'C = Q/ΔV = 240 µC ÷ 6.0 V = 40 µF.'},
{k:'4.1.3',q:'How do you find capacitance from a graph of Q (y-axis) against ΔV (x-axis)?',o:['Take the gradient of the line','Take the area under the line','Take the y-intercept','Read the last point'],e:'Since Q = CΔV, the gradient ΔQ/ΔV is the capacitance C.'},
{k:'4.1.3',q:'Two Q–ΔV lines pass through the origin. Line 2 is steeper than line 1. Which is true?',o:['Capacitor 2 has the larger capacitance','Capacitor 1 has the larger capacitance','They have equal capacitance','Capacitor 2 stores less charge at any voltage'],e:'A steeper gradient means more charge per volt, so a larger capacitance.'},
{k:'4.1.4',q:'The plate area of an ideal parallel-plate capacitor is doubled and the separation is unchanged. The capacitance…',o:['doubles','halves','stays the same','quadruples'],e:'C = ε₀A/d, so C is directly proportional to A.'},
{k:'4.1.4',q:'The plate separation is tripled and the area is unchanged. The capacitance becomes…',o:['one third','three times larger','nine times larger','unchanged'],e:'C is inversely proportional to d, so tripling d divides C by 3.'},
{k:'4.1.4',q:'What makes a parallel-plate capacitor ideal, with a constant field between the plates?',o:['The plate area is very large compared with the separation','The plates are very close to a third plate','The plates are very small','The gap is filled with a conductor'],e:'When the plates are very large compared with d, edge effects are negligible and the field is uniform.'},
{k:'4.1.4',q:'Plates of area 0.020 m² are 1.0 mm apart in air (ε₀ = 8.85 × 10⁻¹² F m⁻¹). The capacitance is…',o:['177 pF','17.7 pF','1.77 nF','177 nF'],e:'C = ε₀A/d = 8.85×10⁻¹² × 0.020 ÷ 1.0×10⁻³ = 1.77×10⁻¹⁰ F = 177 pF.'},
{k:'4.1.5',q:'Which expression gives the energy stored in a capacitor?',o:['U = ½CV²','U = CV²','U = ½C/V²','U = QV²'],e:'U = ½QV = ½CV² = ½Q²/C.'},
{k:'4.1.5',q:'A 100 µF capacitor is charged to 10 V. The stored energy is…',o:['5.0 mJ','10 mJ','1.0 mJ','0.50 mJ'],e:'U = ½CV² = ½ × 100×10⁻⁶ × 10² = 5.0×10⁻³ J.'},
{k:'4.1.5',q:'The voltage across a capacitor is doubled. The stored energy…',o:['increases by a factor of 4','doubles','halves','stays the same'],e:'U = ½CV², so U ∝ V². Doubling V gives four times the energy.'},
{k:'4.1.5',q:'On a graph of potential difference (y) against charge (x), the energy stored is represented by…',o:['the area under the line','the gradient of the line','the y-intercept','the length of the line'],e:'Energy = area under the V–Q graph = ½QV for the triangle.'}
];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let qz;
function qzStart(){qz={order:shuf(QZ.map((_,i)=>i)),i:0,score:0,missed:[]};qzShow()}
function qzShow(){
  const box=$('quiz-box');
  if(qz.i>=QZ.length){const miss=[...new Set(qz.missed)].sort();box.innerHTML='<div class="qz-meta"><span>RESULT</span></div><div class="qz-score">'+qz.score+' / '+QZ.length+'</div><p style="font-size:13px;line-height:1.7;margin-bottom:12px">'+(miss.length?'Revise these KPIs: <b style="color:var(--amber)">'+miss.join(', ')+'</b>':'<b style="color:var(--green)">Perfect: every KPI secure!</b>')+'</p><button class="btn green" id="qz-retry">↻ Try again (shuffled)</button>';$('qz-retry').onclick=qzStart;return}
  const Q=QZ[qz.order[qz.i]],opts=shuf(Q.o.map((t,j)=>({t,ok:j===0})));
  box.innerHTML='<div class="qz-meta"><span>QUESTION '+(qz.i+1)+' / '+QZ.length+'</span><span>KPI '+Q.k+'</span></div><div class="qz-bar"><i style="width:'+qz.i/QZ.length*100+'%"></i></div><div class="qz-q"></div><div id="qz-opts"></div><div id="qz-fb"></div>';
  box.querySelector('.qz-q').textContent=Q.q;const wrap=$('qz-opts');
  opts.forEach(o=>{const b=document.createElement('button');b.className='qz-opt';b.textContent=o.t;
    b.onclick=()=>{wrap.querySelectorAll('.qz-opt').forEach((x,i)=>{x.disabled=true;if(opts[i].ok)x.classList.add('ok')});
      if(o.ok)qz.score++;else{b.classList.add('bad');qz.missed.push(Q.k)}
      const fb=$('qz-fb');fb.innerHTML='<div class="qz-exp"><b>'+(o.ok?'Correct. ':'Not quite. ')+'</b></div><button class="btn green" id="qz-next">'+(qz.i+1>=QZ.length?'See result':'Next →')+'</button>';
      fb.querySelector('.qz-exp').appendChild(document.createTextNode(Q.e));$('qz-next').onclick=()=>{qz.i++;qzShow()}};
    wrap.appendChild(b)});
}
qzStart();

/* ---------- main loop ---------- */
let lastHud='',last=performance.now(),lastR=0;
function frame(ts){
  requestAnimationFrame(frame);if(ts-lastR<33)return;lastR=ts;
  const now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;
  if(S.mod==='quiz'){renderer.render(scene,cam);return}
  physics(dt);
  const {s,g}=layout(),Q=S.C*S.Vc,n=Q>0?Math.min(36,Math.max(1,Math.ceil(36*Q/QREF[S.mod]))):0,op=Q>0?Math.min(1,.25+.75*Q/QREF[S.mod]):0;
  let tilt=0;if(S.mod==='geo')tilt=Math.max(0,Math.min(1,(10-S.side*10/S.dmm)/10))*.9;
  setCap(s,g,n,op,tilt);
  const act_=engine()&&S.mode!=='open'&&Math.abs(S.dV)>.05,sp=act_?Math.sign(S.dV)*Math.min(1,Math.abs(S.dV)/10)*.5:0;
  updateWire(s,g,act_,sp,dt);
  const lamp=engine()&&S.mode==='disc'?Math.min(1,Math.abs(S.dV)/6):0;
  bulbMat.emissiveIntensity=lamp*2;bl.intensity=lamp*3;batMat.emissiveIntensity=engine()&&S.mode==='charge'&&act_?.5:0;
  const h=M[S.mod].hud().map(r=>typeof r==='string'?r:'<div class="dr"><span class="dl">'+r[0]+'</span><span class="dv '+r[2]+'">'+r[1]+'</span></div>').join('');
  if(h!==lastHud){$('hudBody').innerHTML=h;lastHud=h}
  if(M[S.mod].graph)drawGraph();
  drawLabels();renderer.render(scene,cam);
}
setMod('store');requestAnimationFrame(frame);
</script>
</body>
</html>
