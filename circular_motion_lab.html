<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Circular Motion Lab | PHY51</title>
<link rel="icon" type="image/png" href="assets/logo1.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');
:root{--bg:#07090f;--border:rgba(180,200,255,.10);--amber:#ffc857;--blue:#5bc8ff;--violet:#b57aff;--green:#4dffa0;--red:#ff5e72;--text:#ddeeff;--muted:rgba(180,210,255,.45)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'DM Sans',sans-serif;font-weight:300;overflow:hidden;height:100vh;width:100vw;color:var(--text);touch-action:none;-webkit-tap-highlight-color:transparent}
#mainCanvas{position:absolute;inset:0;z-index:1;touch-action:none}
#labelCanvas{position:absolute;inset:0;pointer-events:none;z-index:3}
#title{position:absolute;top:16px;left:16px;z-index:5}
#title h1{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:#fff;letter-spacing:.4px}
#title p{font-size:9px;color:rgba(180,200,255,.4);letter-spacing:1.6px;text-transform:uppercase;margin-top:2px;font-family:'Space Mono',monospace}
#tabbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(10,14,28,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:14px;padding:5px;z-index:10;max-width:calc(100vw - 200px);overflow-x:auto}
#tabbar::-webkit-scrollbar{height:0}
.tab-btn{padding:8px 11px;border-radius:9px;border:none;background:transparent;color:var(--muted);font-family:'Space Mono',monospace;font-size:9.5px;white-space:nowrap;cursor:pointer;transition:all .18s}
.tab-btn:hover{color:#fff}.tab-btn.on{background:rgba(91,200,255,.2);color:#fff}
.panel{background:rgba(10,14,28,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:15px;z-index:10}
.panel>h2,#v2head{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2.5px;color:rgba(180,200,255,.45);text-transform:uppercase;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;user-select:none}
.panel>h2::after{content:'\25BE'}.folded>h2::after{content:'\25B8'}.folded>*:not(h2){display:none!important}.folded>h2{margin:0;border:0;padding:0}
#rightCol{position:absolute;top:70px;right:14px;width:230px;z-index:10;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 150px);overflow-y:auto}
#view2d{display:none}#view2d.show{display:block}
#v2head{cursor:default;margin-bottom:6px}
#v2canvas{display:block;width:100%;height:190px}
.dr{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:5px 8px;border-radius:8px;background:rgba(180,200,255,.04);gap:6px}
.dl{font-family:'Space Mono',monospace;font-size:10px;color:rgba(180,210,255,.6)}
.dv{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;text-align:right}
.dv.amber{color:var(--amber)}.dv.blue{color:var(--blue)}.dv.violet{color:var(--violet)}.dv.green{color:var(--green)}
.hdiv{height:1px;background:var(--border);margin:9px 0}
#legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-family:'Space Mono',monospace;font-size:9px}
.legchip{display:flex;align-items:center;gap:4px;color:rgba(200,215,255,.65)}
.legdot{width:8px;height:8px;border-radius:50%}
.note-box{padding:8px 9px;border-radius:9px;background:rgba(180,120,255,.06);border:1px solid rgba(180,120,255,.18);font-size:10px;font-family:'Space Mono',monospace;color:rgba(210,220,255,.8);line-height:1.7}
#infoPanel{position:absolute;top:70px;left:14px;width:270px;max-width:calc(100vw - 320px);max-height:calc(100vh - 160px);overflow-y:auto}
#info h3{font-family:'Syne',sans-serif;font-size:13.5px;font-weight:700;color:#fff;margin-bottom:8px}
#info p{font-size:11.5px;line-height:1.65;color:rgba(210,222,250,.82);margin-bottom:8px}
#info b{color:#fff}.pos{color:var(--red);font-weight:700}.neg{color:var(--violet);font-weight:700}
.step-tag{display:inline-block;font-family:'Space Mono',monospace;font-size:9px;color:var(--green);background:rgba(77,255,160,.08);border:1px solid rgba(77,255,160,.25);border-radius:6px;padding:2px 7px;letter-spacing:.5px}
#controls{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:7px;align-items:center;background:rgba(10,14,28,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:40px;padding:8px 14px;z-index:10;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
#ctrlbody{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{padding:7px 14px;border-radius:26px;border:1px solid rgba(180,200,255,.25);background:rgba(180,200,255,.06);color:var(--blue);font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap;outline:none}
.btn:hover{background:rgba(180,200,255,.14)}.btn.on{background:rgba(91,200,255,.2);border-color:var(--blue);color:#fff}
.btn.green{border-color:rgba(77,255,160,.4);color:var(--green);background:rgba(77,255,160,.06)}
.btn.amber{border-color:rgba(255,200,87,.4);color:var(--amber);background:rgba(255,200,87,.06)}
.sep{width:1px;height:20px;background:var(--border)}
.sw{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10.5px;font-family:'Space Mono',monospace;white-space:nowrap}
input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:rgba(180,200,255,.15);outline:none;cursor:pointer;width:90px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--violet);box-shadow:0 0 8px rgba(181,122,255,.6)}
#hint{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);font-size:8.5px;color:rgba(180,200,255,.25);letter-spacing:1px;pointer-events:none;font-family:'Space Mono',monospace;z-index:10;white-space:nowrap}
#quiz{position:fixed;inset:70px 0 0 0;z-index:9;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;touch-action:pan-y;padding:16px;background:rgba(7,9,15,.88)}
#quiz-box{background:rgba(13,17,32,.97);border:1px solid var(--border);border-radius:16px;padding:22px;max-width:660px;width:100%}
.qz-meta{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--amber);margin-bottom:8px;display:flex;justify-content:space-between}
.qz-bar{height:4px;border-radius:3px;background:rgba(180,200,255,.1);margin-bottom:16px;overflow:hidden}
.qz-bar i{display:block;height:100%;background:var(--blue)}
.qz-q{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:#fff;margin-bottom:14px;line-height:1.4}
.qz-opt{display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;border-radius:11px;border:1px solid rgba(180,200,255,.2);background:rgba(180,200,255,.05);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}
.qz-opt:hover:not(:disabled){background:rgba(91,200,255,.14)}
.qz-opt.ok{border-color:var(--green);background:rgba(77,255,160,.14)}.qz-opt.bad{border-color:var(--red);background:rgba(255,94,114,.14)}
.qz-exp{margin:10px 0;padding:10px 12px;border-radius:10px;background:rgba(255,200,87,.07);border:1px solid rgba(255,200,87,.25);font-size:12px;line-height:1.6;color:rgba(230,236,255,.9)}
.qz-score{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;color:#fff;margin:6px 0}
@media (max-width:820px){#infoPanel{display:none}#rightCol{top:100px;width:190px;max-height:calc(100vh - 190px)}#tabbar{max-width:calc(100vw - 20px);top:60px;left:14px;transform:none}#quiz{inset:100px 0 0 0}}
#view2d.big{position:fixed;left:10vw;top:10vh;width:80vw;height:80vh;z-index:30;display:flex;flex-direction:column;box-shadow:0 0 0 100vmax rgba(4,6,18,.55)}
#view2d.big #v2canvas{flex:1;height:auto;min-height:0}
body.gbig #rightCol{z-index:40}
#v2head{flex-wrap:wrap;font-size:9px;letter-spacing:1.5px;gap:6px;align-items:center}
#v2btns{display:flex;gap:4px;letter-spacing:0}
.v2b{background:none;border:1px solid var(--border);color:var(--blue);border-radius:7px;cursor:pointer;font-size:11px;padding:2px 7px;font-family:'DM Sans',sans-serif}
.v2b.on{background:rgba(255,200,87,.2);border-color:var(--amber);color:var(--amber)}.v2b:disabled{opacity:.35;cursor:not-allowed}
#v2-restore{display:none}#view2d.big #v2-restore{display:inline-block}#view2d.big #v2-expand{display:none}
#v2canvas{touch-action:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
#chal{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);z-index:15;display:none;width:min(620px,calc(100vw - 24px))}
#chal.show{display:block}
#chal-bar{background:rgba(10,14,28,.97);backdrop-filter:blur(22px);border:1px solid rgba(255,200,87,.4);border-radius:18px;padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#chal-head{display:flex;justify-content:space-between;margin-bottom:8px;border-bottom:1px solid rgba(255,200,87,.2);padding-bottom:6px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--amber);text-transform:uppercase;font-weight:700}
#chal-score{color:var(--green);letter-spacing:0;font-size:10.5px}
#chal-prompt{font-size:12px;line-height:1.5;margin-bottom:10px;color:var(--text)}#chal-prompt b{color:#fff}
#chal-steps{display:none;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px;font-family:'Space Mono',monospace;font-size:10px}
#chal-steps.show{display:flex}
#chal-steps .st{color:var(--muted)}#chal-steps .st.done{color:var(--green)}
#chal-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#chal-row label,#chal-unit{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)}
.chal-input{background:rgba(180,200,255,.08);border:1px solid rgba(180,200,255,.3);color:var(--text);border-radius:8px;padding:6px 10px;font-family:'Space Mono',monospace;font-size:12px;outline:none;width:130px}
.chal-input:focus{border-color:var(--blue)}.chal-input:disabled{opacity:.45;cursor:not-allowed}
#chal-result{display:none;font-size:11.5px;line-height:1.55;margin-top:8px;padding:8px 12px;border-radius:10px}
#chal-result.pass{display:block;background:rgba(77,255,160,.12);color:var(--green);border:1px solid rgba(77,255,160,.35)}
#chal-result.fail{display:block;background:rgba(255,94,114,.12);color:var(--red);border:1px solid rgba(255,94,114,.35)}
#chal-result.warn{display:block;background:rgba(255,200,87,.1);color:var(--amber);border:1px solid rgba(255,200,87,.35)}
#chal-actions{display:flex;gap:8px;margin-top:8px}

#title{display:flex;align-items:center;gap:10px}
#title-logo{width:34px;height:37px;flex-shrink:0;opacity:.82}
/* Calculator + QR buttons */
#qr-btn{position:fixed;bottom:20px;right:20px;width:40px;height:40px;border-radius:11px;border:1px solid rgba(120,180,255,.25);background:rgba(6,8,20,.92);backdrop-filter:blur(14px);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;transition:all .2s;color:rgba(120,180,255,.7)}
#qr-btn:hover{border-color:rgba(120,180,255,.55);background:rgba(120,180,255,.14);color:#78b4ff}
#qr-btn svg{width:20px;height:20px}
#qr-modal{display:none;position:fixed;inset:0;z-index:300;background:rgba(4,8,20,.78);backdrop-filter:blur(10px);align-items:center;justify-content:center}
#qr-modal.show{display:flex}
#qr-modal-box{background:rgba(6,10,22,.97);border:1px solid rgba(120,180,255,.3);border-radius:20px;padding:26px 24px 22px;text-align:center;position:relative;max-width:270px;width:90%}
#qr-modal-box h3{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:3px;color:rgba(120,180,255,.5);text-transform:uppercase;margin-bottom:14px}
#qr-modal-box img{width:168px;height:168px;border-radius:10px;border:2px solid rgba(120,180,255,.2);display:block;margin:0 auto 14px}
#qr-modal-box p{font-family:'Space Mono',monospace;font-size:8px;color:rgba(120,180,255,.38);letter-spacing:1px;word-break:break-all;line-height:1.7}
#qr-modal-close{position:absolute;top:10px;right:13px;background:none;border:none;color:rgba(160,200,255,.38);font-size:17px;cursor:pointer;line-height:1;transition:color .2s;padding:2px 4px}
#qr-modal-close:hover{color:#78b4ff}
#calc-btn{position:fixed;bottom:68px;right:20px;width:40px;height:40px;border-radius:11px;border:1px solid rgba(255,200,87,.3);background:rgba(6,8,20,.92);backdrop-filter:blur(14px);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;transition:all .2s;color:rgba(255,200,87,.7)}
#calc-btn:hover,#calc-btn.on{border-color:rgba(255,200,87,.7);background:rgba(255,200,87,.14);color:var(--amber)}
#calc-btn svg{width:20px;height:20px}
#calc-panel{position:fixed;z-index:1100;right:16px;bottom:116px;width:min(380px,calc(100vw - 20px));height:min(620px,calc(100vh - 140px));display:none;flex-direction:column;background:rgba(10,14,28,.97);border:1px solid rgba(255,200,87,.35);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.6);overflow:hidden}
#calc-panel.show{display:flex}
#calc-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:grab;touch-action:none;user-select:none;border-bottom:1px solid var(--border);background:rgba(255,200,87,.06)}
#calc-head:active{cursor:grabbing}
#calc-head h2{font:700 10px 'Space Mono';letter-spacing:1.5px;color:var(--amber)}
#calc-close{border:1px solid var(--border);background:rgba(180,200,255,.08);color:var(--muted);font-size:13px;width:26px;height:26px;border-radius:7px;cursor:pointer}
#calc-close:hover{color:#fff;background:rgba(180,200,255,.18)}
#calc-frame{flex:1;width:100%;border:0;background:#07090f;min-height:0}
#calc-panel.drag #calc-frame{pointer-events:none}
@media(max-width:1040px){#calc-btn{right:10px;bottom:calc(62px + env(safe-area-inset-bottom,0px))}#qr-btn{right:10px}}
@media(max-width:600px){#calc-panel{left:10px;right:10px;width:auto;bottom:calc(110px + env(safe-area-inset-bottom,0px));height:min(600px,calc(100vh - 150px))}}
/* Quiz levels */
.qz-level{display:inline-block;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:1px solid;border-radius:8px;padding:2px 7px;margin-right:8px}
.qz-break{display:flex;flex-direction:column;gap:8px;margin:0 0 16px;max-width:320px}
.qb-row{display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:11px}
.qb-name{width:66px}
.qb-bar{flex:1;height:6px;border-radius:3px;background:rgba(180,200,255,.12);overflow:hidden}
.qb-bar i{display:block;height:100%;border-radius:3px}
.qb-val{width:38px;text-align:right;color:var(--text)}

.panel.folded{height:auto!important;min-height:0!important;max-height:none!important;padding-bottom:8px!important}
.panel.folded>#v2head{display:flex!important;border:0;padding:0;margin:0}
#v2head{cursor:pointer!important;justify-content:space-between;margin-bottom:6px}
#v2head::after{content:"\25BE"}
.folded>#v2head::after{content:"\25B8"}
#ctrlfold{display:block;width:100%;background:none;border:0;color:rgba(180,200,255,.55);font:700 10px "Space Mono",monospace;letter-spacing:.12em;cursor:pointer;padding:0 10px 2px}
#controls.cfolded #ctrlbody{display:none}
#controls.cfolded{border-radius:20px;padding:4px 14px}
#viewBar{position:fixed;left:16px;bottom:20px;z-index:11;display:flex;gap:8px}
#viewBtn,#pauseBtn{padding:9px 16px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;background:rgba(6,8,20,.92);backdrop-filter:blur(14px);border-color:rgba(120,180,255,.3)}
#pauseBtn.on{border-color:rgba(77,255,160,.6);color:var(--green);background:rgba(77,255,160,.1)}
#viewBtn.on{border-color:rgba(255,200,87,.7);color:var(--amber);background:rgba(255,200,87,.12)}
.vchk{display:flex;align-items:center;gap:6px;cursor:pointer}
.vchk input{margin:0;width:13px;height:13px;cursor:pointer}
</style>
</head>

function model(){ /* internal model F = m v^2 / r (never displayed as a formula: not required at IGCSE) */
 if(S.mod==='tube'){const m=1.5,v=S.v,F=S.W*4;return {m,v,F,r:clamp(m*v*v/F,.7,4.2)}}
 const m=S.m;

const M={
cm:{cam:11,title:'MASS · FORCE · SPEED · RADIUS',
 info:'<h3>Centripetal force</h3><p>An object moves in a circle only if a force acts <b>towards the centre</b>, <b>perpendicular</b> to its velocity. <b>Centripetal</b> = <i>centre-seeking</i>. Here the string tension is that force.</p><p><b>Accelerating?</b> Yes: speed is constant but the <b>direction</b> keeps changing, so the velocity changes.</p><p>Try <span class="step-tag">✂ Cut string</span>: no force, so the car moves in a straight line.</p><p><b>Explore the rules</b><br>(a) mass &amp; radius fixed: force ▲ → speed ▲<br>(b) mass &amp; speed fixed: force ▲ → radius ▼<br>(c) speed &amp; radius fixed: mass ▲ → force ▲</p>',

  return h+'<span class="sep"></span><button class="btn amber" data-a="cut">✂ Cut string</button><button class="btn" data-a="reset">↺ Reset</button><button class="btn'+(S.trailOn?' on':'')+'" data-a="trail">Trail</button>'},

const QZ={easy:[
{k:'Centripetal',q:'What does "centripetal" mean?',o:['Centre-seeking','Centre-fleeing','Moving in a line','Spinning fast'],e:'Centripetal means centre-seeking: the force points towards the centre of the circle.'},
{k:'Direction',q:'An object moves in a circle. In which direction must a force act?',o:['Towards the centre of the path','Away from the centre','Along the direction of motion','Opposite to the motion'],e:'The net force must point towards the centre of the circular path.'},
{k:'Perpendicular',q:'How is the centripetal force directed relative to the velocity?',o:['Perpendicular to it','Parallel to it','Opposite to it','At 45° to it'],e:'The force is at 90° to the velocity (velocity is along the tangent).'},
{k:'Cut string',q:'The string holding a whirling ball is cut. How does the ball move?',o:['In a straight line along the tangent','Towards the centre','Radially outwards','It keeps circling'],e:'With no force, Newton\'s 1st law: constant velocity in a straight line, along the tangent.'},
{k:'Tension',q:'Which force keeps a ball whirling on a string in a circle?',o:['Tension in the string','Its own weight','Friction with the air','A force outwards'],e:'The string tension pulls the ball towards the centre, acting as the centripetal force.'}],

{k:'Speed–force',q:'Mass and radius stay constant. The centripetal force increases. What happens to the speed?',o:['It increases','It decreases','It stays the same','It becomes zero'],e:'A stronger inward force goes with a faster circular motion (mass and radius constant).'},
{k:'Radius–force',q:'Mass and speed stay constant. The force increases. What happens to the radius?',o:['It decreases','It increases','It stays the same','It doubles'],e:'A larger force pulls the object into a tighter circle, so the radius decreases.'},
{k:'Mass–force',q:'The mass is increased but speed and radius must stay the same. What is needed?',o:['A larger force','A smaller force','The same force','No force'],e:'A larger mass needs a larger centripetal force to keep the same speed and radius.'},
{k:'Velocity',q:'Why is uniform circular motion "accelerated" even though speed is constant?',o:['Velocity is a vector and its direction changes','Speed changes slowly','Friction is acting','Mass changes'],e:'Acceleration is a change in velocity: magnitude OR direction. Here the direction changes.'}],
advanced:[
{k:'Speed change',q:'A force acts along the direction of motion of a ball on a circle. What changes?',o:['Its speed changes','Only its direction','Nothing','Its mass'],e:'Only a force perpendicular to the velocity keeps the speed constant; a component along it changes the speed.'},
